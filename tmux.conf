## General
# set     -g  default-command             "$SHELL -l"  # Omit to avoid double shell (tmux spawns login shell by default)
set     -g  default-terminal            'tmux-256color'
set     -s  extended-keys-format        csi-u
set     -sg extended-keys               on
set     -sa terminal-features           ',*:RGB'
set     -sa terminal-features           ',*:extkeys'
set     -sa terminal-features           ',*:clipboard'            # OSC 52 clipboard support
set     -sa terminal-features           ',*:hyperlinks'           # OSC 8 hyperlinks
set     -sa terminal-features           ',*:sync'                 # Synchronized updates
set     -sa terminal-features           ',*:sixel'                # SIXEL graphics
set     -sa terminal-overrides          ',*:Smulx=\E[4::%p1%dm'   # undercurl support
set     -sa terminal-overrides          ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors - needs tmux-3.0

set     -g  mode-keys                   vi
set     -g  status-keys                 vi

set     -g  mouse                       on      # Enable Mouse mode (scrolling, etc).
set     -s  set-clipboard               on

set     -sg repeat-time                 600     # Increase repeat timeout.
set     -s  focus-events                on
set     -g  focus-follows-mouse         on      # tmux 3.7+ only
set     -g  detach-on-destroy           off     # Switch to other session instead of detach when session destroyed

set     -g  history-limit               10000   # Boost history.
set     -g  input-buffer-size           10485760  # 10MB

## Apperance
setw    -g  automatic-rename            off     # Rename window to reflect current program.
set     -g  renumber-windows            on      # Renumber windows when a window is closed.

set     -g  set-titles                  on      # Set terminal title.
set     -g  set-titles-string           '#{?#{m:*!*,#{session_alert}},🔔 ,}#S:#W'

set     -g  display-panes-time          2000    # Slightly longer pane indicators display time.
set     -g  display-time                3000    # Slightly longer status messages display time.
set     -sg escape-time                 0       # Faster command sequences.

## Cursor style
set     -g  cursor-style                blinking-block
set     -g  prompt-command-cursor-style blinking-bar    # tmux 3.7+ only

## Activity
set     -g  monitor-activity            on      # Track output activity for each window and mark activity alerts.
set     -g  activity-action             none    # Ignore all activity alerts (equivalent to monitor-activity off for notifications).
set     -g  visual-activity             off     # When activity-action is not none: off=send BEL to terminal, on=tmux message, both=BEL+message.

## Bell
set     -gw monitor-bell                on      # Monitor bell alerts for windows
set     -g  bell-action                 any     # Treat bells from any window as session alerts (current + other windows).
set     -g  visual-bell                 off     # Do not show tmux bell message; BEL handling is delegated to terminal

## For yazi
set     -gw allow-passthrough           on
set     -ga update-environment          TERM
set     -ga update-environment          TERM_PROGRAM

source $HOME/.config/tmux/conf/variable.tmux.conf           ## Variables
source $HOME/.config/tmux/conf/keymap-unbind.tmux.conf      ## Unbind default keymaps

## Hooks
set-hook -g session-created "run-shell 'bash $HOME/.config/tmux/hook/session-created.sh \"#{session_name}\"'"

## Plugins
set     -g  @plugin 'tmux-plugins/tpm'
set     -g  @plugin 'tmux-plugins/tmux-resurrect'
set     -g  @plugin 'tmux-plugins/tmux-yank'
run "$HOME/.config/tmux/plugins/tpm/tpm"

source $HOME/.config/tmux/conf/keymap.tmux.conf             ## Customized keymaps
if-shell "[ $(uname) != 'Darwin' ]" "source $HOME/.config/tmux/conf/keymap.nix.tmux.conf"
run-shell "bash $HOME/.config/tmux/script/load-theme.sh"
