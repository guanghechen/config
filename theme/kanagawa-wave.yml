# kanagawa-wave
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: dark
  theme:
    activeBorderColor:
      - '#7E9CD8'
      - bold
    authorColors:
      '*': '#C8C093'
      guanghechen: '#7E9CD8'
    branchColorPatterns:
      "^(main|master)$": '#AC96CC'
      "^(user/[^/]+/)?chore": '#C8C093'
      "^(user/[^/]+/)?feat": '#98BB6C'
      "^(user/[^/]+/)?fix": '#ED7D86'
      "^(user/[^/]+/)?refactor": '#FFA066'
      "^(user/[^/]+/)?release": '#7E9CD8'
    cherryPickedCommitBgColor:
      - '#2A2A37'
    cherryPickedCommitFgColor:
      - '#AC96CC'
    defaultFgColor:
      - '#DCD7BA'
    inactiveBorderColor:
      - '#54546D'
    inactiveViewSelectedLineBgColor:
      - '#16161D'
    markedBaseCommitBgColor:
      - '#223249'
    markedBaseCommitFgColor:
      - '#DCD7BA'
    optionsTextColor:
      - '#7E9CD8'
    searchingActiveBorderColor:
      - '#E6C384'
      - bold
    selectedLineBgColor:
      - '#223249'
    selectedLineFgColor:
      - '#DCD7BA'
      - bold
    unstagedChangesColor:
      - '#ED7D86'

git:
  diffRenderers:
    # Narrow panels (< 100 columns) use the unified delta layout, matching fzf-git-log.
    - command: >-
        [ "${COLUMNS:-0}" -lt 100 ] && export DELTA_FEATURES=+unified; delta --paging=never --dark
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
