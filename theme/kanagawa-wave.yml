# kanagawa-wave

gui:
  authorColors:
    '*': '#C8C093'
    guanghechen: '#7E9CD8'
  branchColorPatterns:
    "^(main|master)$": '#AC96CC'
    "^(user/[^/]+/)?chore": '#C8C093'
    "^(user/[^/]+/)?feat": '#98BB6C'
    "^(user/[^/]+/)?feature": '#98BB6C'
    "^(user/[^/]+/)?fix": '#ED7D86'
    "^(user/[^/]+/)?refactor": '#FFA066'
    "^(user/[^/]+/)?release": '#7E9CD8'
  theme:
    activeBorderColor:
      - '#7E9CD8'
      - bold
    cherryPickedCommitBgColor:
      - '#2A2A37'
    cherryPickedCommitFgColor:
      - '#AC96CC'
    defaultFgColor:
      - '#DCD7BA'
    inactiveBorderColor:
      - '#54546D'
    inactiveViewSelectedLineBgColor:
      - '#16161D'
    markedBaseCommitBgColor:
      - '#223249'
    markedBaseCommitFgColor:
      - '#DCD7BA'
    optionsTextColor:
      - '#7E9CD8'
    searchingActiveBorderColor:
      - '#E6C384'
      - bold
    selectedLineBgColor:
      - '#223249'
      - bold
    unstagedChangesColor:
      - '#ED7D86'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
