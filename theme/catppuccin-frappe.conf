# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-frappe

[delta]
dark                          = true
syntax-theme                  = catppuccin-frappe

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#8CAAEE"

####################################################################################################

file-style                    = "#C6D0F5" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#B5BFE2"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#E78284" normal bold
line-numbers-plus-style       = "#A6D189" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#3B394A"
plus-style                    = syntax "#373D4A"
minus-non-emph-style          = syntax "#3B394A"
plus-non-emph-style           = syntax "#373D4A"
minus-emph-style              = "#C6D0F5" "#5C4755" bold
plus-emph-style               = "#C6D0F5" "#4C5A56" bold

plus-empty-line-marker-style  = "#373D4A" "#373D4A"
minus-empty-line-marker-style = "#3B394A" "#3B394A"

####################################################################################################

commit-style                  = "#E5C890" bold
commit-decoration-style       = none

blame-palette                 = "#303446" "#292C3C" "#414559"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#B5BFE2" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
