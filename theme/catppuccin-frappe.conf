# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-frappe

[delta]
dark                          = true
syntax-theme                  = catppuccin-frappe

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#8CAAEE"

####################################################################################################

file-style                    = "#B5BFE2" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#A5ADCE"

line-numbers                  = true
line-numbers-left-style       = "#A5ADCE" "#303446"
line-numbers-right-style      = "#A5ADCE" "#303446"
line-numbers-zero-style       = "#A5ADCE" "#303446"
line-numbers-minus-style      = "#A5ADCE" "#4C3A3A" bold
line-numbers-plus-style       = "#A5ADCE" "#3A4C3A" bold

zero-style                    = syntax normal
minus-style                   = syntax "#4C3A3A"
plus-style                    = syntax "#3A4C3A"
minus-non-emph-style          = syntax "#4C3A3A"
plus-non-emph-style           = syntax "#3A4C3A"
minus-emph-style              = syntax "#3A2A2A" bold
plus-emph-style               = syntax "#2A3A2A" bold

plus-empty-line-marker-style  = "#3A4C3A" "#3A4C3A"
minus-empty-line-marker-style = "#4C3A3A" "#4C3A3A"

####################################################################################################

commit-style                  = "#E5C890" bold
commit-decoration-style       = none

blame-palette                 = "#303446" "#232634" "#414559"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#A5ADCE" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

