# gruvbox-dark

gui:
  authorColors:
    '*': '#D5C4A1'
    guanghechen: '#458588'
  branchColorPatterns:
    "^(main|master)$": '#B16286'
    "^(user/[^/]+/)?chore": '#A89984'
    "^(user/[^/]+/)?feat": '#98971A'
    "^(user/[^/]+/)?feature": '#98971A'
    "^(user/[^/]+/)?fix": '#CC241D'
    "^(user/[^/]+/)?refactor": '#D65D0E'
    "^(user/[^/]+/)?release": '#458588'
  theme:
    activeBorderColor:
      - '#B16286'
      - bold
    cherryPickedCommitBgColor:
      - '#689D6A'
    cherryPickedCommitFgColor:
      - '#32302F'
    defaultFgColor:
      - '#D5C4A1'
    inactiveBorderColor:
      - '#A89984'
    inactiveViewSelectedLineBgColor:
      - '#504945'
    markedBaseCommitBgColor:
      - '#D79921'
    markedBaseCommitFgColor:
      - '#32302F'
    optionsTextColor:
      - '#D65D0E'
    searchingActiveBorderColor:
      - '#689D6A'
      - bold
    selectedLineBgColor:
      - '#665C54'
    unstagedChangesColor:
      - '#CC241D'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
