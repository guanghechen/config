# gruvbox-dark
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: dark
  theme:
    activeBorderColor:
      - '#D3869B'
      - bold
    authorColors:
      '*': '#D5C4A1'
      guanghechen: '#83A598'
    branchColorPatterns:
      "^(main|master)$": '#D3869B'
      "^(user/[^/]+/)?chore": '#D5C4A1'
      "^(user/[^/]+/)?feat": '#B8BB26'
      "^(user/[^/]+/)?fix": '#FB4934'
      "^(user/[^/]+/)?refactor": '#FE8019'
      "^(user/[^/]+/)?release": '#83A598'
    cherryPickedCommitBgColor:
      - '#504945'
    cherryPickedCommitFgColor:
      - '#EBDBB2'
    defaultFgColor:
      - '#D5C4A1'
    inactiveBorderColor:
      - '#A89984'
    inactiveViewSelectedLineBgColor:
      - '#504945'
    markedBaseCommitBgColor:
      - '#665C54'
    markedBaseCommitFgColor:
      - '#EBDBB2'
    optionsTextColor:
      - '#FE8019'
    searchingActiveBorderColor:
      - '#8EC07C'
      - bold
    selectedLineBgColor:
      - '#665C54'
    selectedLineFgColor:
      - '#EBDBB2'
      - bold
    unstagedChangesColor:
      - '#FB4934'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --dark
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
