# gruvbox-dark

gui:
  authorColors:
    guanghechen: '#458588'
    '*': '#D5C4A1'
  branchColorPatterns:
    "^(main|master)$": '#B16286'
    "^(user/[^/]+/)?fix": '#CC241D'
    "^(user/[^/]+/)?feat": '#98971A'
    "^(user/[^/]+/)?feature": '#98971A'
    "^(user/[^/]+/)?release": '#458588'
  theme:
    activeBorderColor:
      - '#B16286'
      - bold
    cherryPickedCommitBgColor:
      - '#689D6A'
    cherryPickedCommitFgColor:
      - '#458588'
    defaultFgColor:
      - '#D5C4A1'
    inactiveBorderColor:
      - '#A89984'
    inactiveViewSelectedLineBgColor:
      - '#665C54'
      - bold
    markedBaseCommitBgColor:
      - '#B16286'
    markedBaseCommitFgColor:
      - '#98971A'
    optionsTextColor:
      - '#D65D0E'
    searchingActiveBorderColor:
      - '#458588'
    selectedLineBgColor:
      - '#504945'
    unstagedChangesColor:
      - '#CC241D'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

