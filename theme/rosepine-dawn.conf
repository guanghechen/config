# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# rosepine-dawn

[delta]
hunk-header-style             = raw
hunk-header-decoration-style  = ul
hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}
detect-dark-light             = auto
line-numbers                  = true
navigate                      = true    # use n and N to move between diff sections
paging                        = never
side-by-side                  = true

light                         = true
syntax-theme                  = rosepine-dawn
plus-style                    = syntax "#E4EBE4"
plus-emph-style               = syntax "#D5E0D5" bold
plus-non-emph-style           = syntax "#E4EBE4" bold
minus-style                   = syntax "#F5D8E0"
minus-emph-style              = syntax "#F0C6D2" bold
minus-non-emph-style          = syntax "#F5D8E0" bold
line-numbers-left-style       = "#464261"
line-numbers-right-style      = "#464261"
line-numbers-minus-style      = "#464261" "#F5D8E0" bold
line-numbers-plus-style       = "#464261" "#E4EBE4" bold
true-color                    = always

