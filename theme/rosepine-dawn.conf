# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# rosepine-dawn

[delta]
light                         = true
syntax-theme                  = rosepine-dawn

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#235965"

####################################################################################################

file-style                    = "#2C283B" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#545064"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#8A344D" normal bold
line-numbers-plus-style       = "#205569" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#F5E7E5"
plus-style                    = syntax "#E4ECE7"
minus-non-emph-style          = syntax "#F5E7E5"
plus-non-emph-style           = syntax "#E4ECE7"
minus-emph-style              = "#2C283B" "#E4C9CB" bold
plus-emph-style               = "#2C283B" "#CBDDD6" bold

plus-empty-line-marker-style  = "#E4ECE7" "#E4ECE7"
minus-empty-line-marker-style = "#F5E7E5" "#F5E7E5"

####################################################################################################

commit-style                  = "#714A12" bold
commit-decoration-style       = none

blame-palette                 = "#FAF4ED" "#FFFAF3" "#F2E9E1"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#545064" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
