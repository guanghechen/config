# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# gruvbox-light

[delta]
hunk-header-style             = raw
hunk-header-decoration-style  = ul
hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}
detect-dark-light             = auto
line-numbers                  = true
navigate                      = true    # use n and N to move between diff sections
paging                        = never
side-by-side                  = true

light                         = true
true-color                    = always
syntax-theme                  = gruvbox-light
plus-emph-style               = syntax "#D3D192" bold
plus-non-emph-style           = syntax "#E8E6B0" bold
plus-style                    = syntax "#E8E6B0"
minus-emph-style              = syntax "#EB9D82" bold
minus-non-emph-style          = syntax "#FCC19F" bold
minus-style                   = syntax "#FCC19F"
line-numbers-left-style       = "#32302F"
line-numbers-right-style      = "#32302F"
line-numbers-zero-style       = "#32302F"
line-numbers-minus-style      = "#32302F" "#FCC19F" bold
line-numbers-plus-style       = "#32302F" "#E8E6B0" bold
whitespace-error-style        = "#32302F"

