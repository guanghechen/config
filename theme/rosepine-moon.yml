# rosepine-moon

gui:
  authorColors:
    '*': '#908CAA'
    guanghechen: '#3E8FB0'
  branchColorPatterns:
    "^(main|master)$": '#C4A7E7'
    "^(user/[^/]+/)?chore": '#6E6A86'
    "^(user/[^/]+/)?feat": '#95B1AC'
    "^(user/[^/]+/)?feature": '#95B1AC'
    "^(user/[^/]+/)?fix": '#EB6F92'
    "^(user/[^/]+/)?refactor": '#EA9A97'
    "^(user/[^/]+/)?release": '#3E8FB0'
  theme:
    activeBorderColor:
      - '#C4A7E7'
      - bold
    cherryPickedCommitBgColor:
      - '#9CCFD8'
    cherryPickedCommitFgColor:
      - '#232136'
    defaultFgColor:
      - '#908CAA'
    inactiveBorderColor:
      - '#6E6A86'
    inactiveViewSelectedLineBgColor:
      - '#393552'
    markedBaseCommitBgColor:
      - '#F6C177'
    markedBaseCommitFgColor:
      - '#232136'
    optionsTextColor:
      - '#EA9A97'
    searchingActiveBorderColor:
      - '#9CCFD8'
      - bold
    selectedLineBgColor:
      - '#44415A'
    unstagedChangesColor:
      - '#EB6F92'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --dark

