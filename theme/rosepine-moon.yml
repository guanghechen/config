# rosepine-moon

gui:
  authorColors:
    '*': '#A5A0BB'
    guanghechen: '#9CCFD8'
  branchColorPatterns:
    "^(main|master)$": '#C4A7E7'
    "^(user/[^/]+/)?chore": '#A5A0BB'
    "^(user/[^/]+/)?feat": '#75ADC1'
    "^(user/[^/]+/)?feature": '#75ADC1'
    "^(user/[^/]+/)?fix": '#F080A0'
    "^(user/[^/]+/)?refactor": '#EA9A97'
    "^(user/[^/]+/)?release": '#9CCFD8'
  theme:
    activeBorderColor:
      - '#EA9A97'
      - bold
    cherryPickedCommitBgColor:
      - '#393552'
    cherryPickedCommitFgColor:
      - '#EA9A97'
    defaultFgColor:
      - '#E0DEF4'
    inactiveBorderColor:
      - '#56526E'
    inactiveViewSelectedLineBgColor:
      - '#2A273F'
    markedBaseCommitBgColor:
      - '#44415A'
    markedBaseCommitFgColor:
      - '#E0DEF4'
    optionsTextColor:
      - '#9CCFD8'
    searchingActiveBorderColor:
      - '#F6C177'
      - bold
    selectedLineBgColor:
      - '#44415A'
      - bold
    unstagedChangesColor:
      - '#F080A0'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
