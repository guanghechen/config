#:schema https://yazi-rs.github.io/schemas/theme.json

# kanagawa-lotus

[app]
overall                 = { fg = "#38384D", bg = "#F2ECBC" }

[cmp]
border                  = { fg = "#3E5A87" }
active                  = { fg = "#38384D", bg = "#D5D6CE", bold = true }
inactive                = { fg = "#545464" }

# Icons
icon_file               = ""
icon_folder             = ""
icon_command            = ""

[confirm]
border                  = { fg = "#ACA99A" }
title                   = { fg = "#A1364B", bold = true }
body                    = { fg = "#38384D" }
list                    = { fg = "#38384D" }
btn_yes                 = { fg = "#F2ECBC", bg = "#4A6037", bold = true }
btn_no                  = { fg = "#38384D", bg = "#DCD5AC", bold = true }
btn_labels              = [ "  [Y]es  ", "  (N)o  " ]

[help]
border                  = { fg = "#ACA99A" }
chord                   = { fg = "#3E5A87" }
action                  = { fg = "#38384D" }
hovered                 = { fg = "#38384D", bg = "#D5D6CE", bold = true }

[input]
border                  = { fg = "#3E5A87" }
title                   = { bold = true }
value                   = { fg = "#38384D" }
selected                = { fg = "#38384D", bg = "#D5D6CE" }

[mgr]
cwd                     = { fg = "#3E5A87" }
border_symbol           = "│"
border_style            = { fg = "#ACA99A" }
count_copied            = { fg = "#F2ECBC", bg = "#4A6037" }
count_cut               = { fg = "#F2ECBC", bg = "#A1364B" }
count_selected          = { fg = "#F2ECBC", bg = "#624C83" }
find_keyword            = { fg = "#655A35",  bold = true, italic = true }
find_position           = { fg = "#624C83",  bg = "reset", bold = true, italic = true }
marker_copied           = { fg = "#4A6037",   bg = "#4A6037" }
marker_cut              = { fg = "#A1364B",     bg = "#A1364B" }
marker_marked           = { fg = "#3E5A87", bg = "#3E5A87" }
marker_selected         = { fg = "#624C83", bg = "#624C83" }
symlink_target          = { italic = true }
syntect_theme           = ""

[indicator]
parent                  = { fg = "#545464", bg = "#E5DDB0" }
current                 = { fg = "#38384D", bg = "#D5D6CE", bold = true }
preview                 = { fg = "#3E5A87", underline = true }

[mode]
normal_main             = { fg = "#F2ECBC", bg = "#3E5A87", bold = true }
normal_alt              = { fg = "#38384D", bg = "#DCD5AC", bold = true }
select_main             = { fg = "#F2ECBC", bg = "#624C83", bold = true }
select_alt              = { fg = "#38384D", bg = "#DCD5AC", bold = true }
unset_main              = { fg = "#F2ECBC", bg = "#914600", bold = true }
unset_alt               = { fg = "#38384D", bg = "#DCD5AC", bold = true }

[notify]
title_info              = { fg = "#4A6037" }
title_warn              = { fg = "#655A35" }
title_error             = { fg = "#A1364B" }
icon_info               = ""
icon_warn               = ""
icon_error              = ""

[pick]
border                  = { fg = "#3E5A87" }
active                  = { fg = "#38384D", bg = "#D5D6CE", bold = true }
inactive                = { fg = "#545464" }

[spot]
border                  = { fg = "#ACA99A" }
title                   = { fg = "#3E5A87", bold = true }

[status]
overall                 = { fg = "#545464", bg = "#F2ECBC" }
perm_exec               = { fg = "#4A6037", bold = true }
perm_read               = { fg = "#3E5A87", bold = true }
perm_sep                = { fg = "#545464", bold = true }
perm_write              = { fg = "#655A35", bold = true }
perm_type               = { fg = "#624C83", bold = true }
progress_error          = { fg = "#A1364B", bg = "#E5DDB0" }
# Let Gauge invert the label foreground as the filled area passes underneath it.
progress_label          = { bold = true }
progress_normal         = { fg = "#4A6037", bg = "#E5DDB0" }
sep_left                = { open = "",         close = "" }
sep_right               = { open = "",         close = "" }

[tabs]
active                  = { fg = "#F2ECBC", bg = "#655A35", bold = true }
inactive                = { fg = "#545464", bg = "#E5DDB0" }
sep_inner               = { open = "",         close = "" }
sep_outer               = { open = "",         close = "" }

[tasks]
border                  = { fg = "#3E5A87" }
title                   = { bold = true }
hovered                 = { fg = "#38384D", bg = "#D5D6CE", bold = true }

[which]
cols                    = 3
mask                    = { bg = "#E5DDB0" }
cand                    = { fg = "#3E5A87" }
rest                    = { fg = "#545464" }
desc                    = { fg = "#38384D" }
separator               = "  "
separator_style         = { fg = "#545464" }

[filetype]
rules = [
  # Images
  { mime = "**/image/*", fg = "#8E3F62" },

  # Media
  { mime = "**/{audio,video}/*", fg = "#914600" },

  # Archives
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#A1364B" },

  # Documents
  { mime = "**/application/{pdf,doc,rtf}", fg = "#3F6058" },

  # Empty files
  # { mime = "inode/empty", fg = "#A1364B" },

  # Special files
  { url = "*", is = "orphan", fg = "#F2ECBC", bg = "#A1364B" },
  { url = "*", is = "exec"  , fg = "#4A6037" },

  # Dummy files
  { url = "*", is = "dummy", fg = "#F2ECBC", bg = "#A1364B" },
  { url = "*/", is = "dummy", fg = "#F2ECBC", bg = "#A1364B" },

  # Fallback
  { url = "*/", fg = "#3E5A87" },
  { url = "*", fg = "#38384D" }
]

