# kanagawa-lotus

[bell]
color = "#914600"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#F2ECBC"
cursor            = "#655A35"

[colors.vi_mode_cursor]
text              = "#F2ECBC"
cursor            = "#3E5A87"

[colors.search.matches]
foreground        = "#F2ECBC"
background        = "#655A35"

[colors.search.focused_match]
foreground        = "#F2ECBC"
background        = "#914600"

[colors.hints.start]
foreground        = "#F2ECBC"
background        = "#624C83"

[colors.hints.end]
foreground        = "#F2ECBC"
background        = "#3E5A87"

[colors.selection]
text              = "#38384D"
background        = "#D5D6CE"

[colors.footer_bar]
foreground        = "#38384D"
background        = "#E5DDB0"

[colors.primary]
background        = "#F2ECBC"
foreground        = "#38384D"
dim_foreground    = "#545464"
bright_foreground = "#38384D"

# Keep ANSI slots independent from the readable app accents in unified.
[colors.normal]
black             = "#1F1F28"
red               = "#C84053"
green             = "#6F894E"
yellow            = "#77713F"
blue              = "#4D699B"
magenta           = "#B35B79"
cyan              = "#597B75"
white             = "#545464"

[colors.bright]
black             = "#8A8980"
red               = "#D7474B"
green             = "#6E915F"
yellow            = "#836F4A"
blue              = "#6693BF"
magenta           = "#624C83"
cyan              = "#5E857A"
white             = "#43436C"

[colors.dim]
black             = "#1F1F28"
red               = "#C84053"
green             = "#6F894E"
yellow            = "#77713F"
blue              = "#4D699B"
magenta           = "#B35B79"
cyan              = "#597B75"
white             = "#545464"

[[colors.indexed_colors]]
index = 16
color = "#E98A00"

[[colors.indexed_colors]]
index = 17
color = "#E82424"
