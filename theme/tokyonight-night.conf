# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# tokyonight-night

[delta]
dark                          = true
syntax-theme                  = tokyonight-night

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#7aa2f7"

####################################################################################################

file-style                    = "#c0caf5" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#a9b1d6"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#f78498" normal bold
line-numbers-plus-style       = "#9ece6a" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#3e2836"
plus-style                    = syntax "#20343e"
minus-non-emph-style          = syntax "#3e2836"
plus-non-emph-style           = syntax "#20343e"
minus-emph-style              = "#c0caf5" "#613849" bold
plus-emph-style               = "#c0caf5" "#30505d" bold

plus-empty-line-marker-style  = "#20343e" "#20343e"
minus-empty-line-marker-style = "#3e2836" "#3e2836"

####################################################################################################

commit-style                  = "#e0af68" bold
commit-decoration-style       = none

blame-palette                 = "#1a1b26" "#16161e" "#292e42"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#a9b1d6" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
