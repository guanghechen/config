# tokyonight-night

[bell]
color = "#ff9e64"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#1a1b26"
cursor            = "#bb9af7"

[colors.vi_mode_cursor]
text              = "#1a1b26"
cursor            = "#7aa2f7"

[colors.search.matches]
foreground        = "#1a1b26"
background        = "#e0af68"

[colors.search.focused_match]
foreground        = "#1a1b26"
background        = "#ff9e64"

[colors.hints.start]
foreground        = "#1a1b26"
background        = "#bb9af7"

[colors.hints.end]
foreground        = "#1a1b26"
background        = "#7aa2f7"

[colors.selection]
text              = "#c0caf5"
background        = "#30374e"

[colors.footer_bar]
foreground        = "#c0caf5"
background        = "#16161e"

[colors.primary]
background        = "#1a1b26"
foreground        = "#c0caf5"
dim_foreground    = "#a9b1d6"
bright_foreground = "#c0caf5"

# Official ANSI slots; bright accents are the upstream HSLuv-generated values.
[colors.normal]
black             = "#15161e"
red               = "#f7768e"
green             = "#9ece6a"
yellow            = "#e0af68"
blue              = "#7aa2f7"
magenta           = "#bb9af7"
cyan              = "#7dcfff"
white             = "#a9b1d6"

[colors.bright]
black             = "#414868"
red               = "#ff899d"
green             = "#9fe044"
yellow            = "#faba4a"
blue              = "#8db0ff"
magenta           = "#c7a9ff"
cyan              = "#a4daff"
white             = "#c0caf5"

[colors.dim]
black             = "#15161e"
red               = "#f7768e"
green             = "#9ece6a"
yellow            = "#e0af68"
blue              = "#7aa2f7"
magenta           = "#bb9af7"
cyan              = "#7dcfff"
white             = "#a9b1d6"

[[colors.indexed_colors]]
index = 16
color = "#ff9e64"

[[colors.indexed_colors]]
index = 17
color = "#db4b4b"
