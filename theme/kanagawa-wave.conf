# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# kanagawa-wave

[delta "kanagawa-wave"]
dark                          = true
syntax-theme                  = kanagawa-wave

inline-hint-style             = "#7E9CD8"

####################################################################################################

file-style                    = "#DCD7BA" bold

hunk-header-line-number-style = "#C8C093"

line-numbers-minus-style      = "#ED7D86" normal bold
line-numbers-plus-style       = "#98BB6C" normal bold

minus-style                   = syntax "#43242B"
plus-style                    = syntax "#2B3328"
minus-non-emph-style          = syntax "#43242B"
plus-non-emph-style           = syntax "#2B3328"
minus-emph-style              = "#DCD7BA" "#633841" bold
plus-emph-style               = "#DCD7BA" "#405137" bold

plus-empty-line-marker-style  = "#2B3328" "#2B3328"
minus-empty-line-marker-style = "#43242B" "#43242B"

####################################################################################################

commit-style                  = "#E6C384" bold

blame-palette                 = "#1F1F28" "#16161D" "#2A2A37"
blame-separator-style         = "#C8C093" dim
