# onehalf-dark

gui:
  authorColors:
    guanghechen: '#61AFEF'
    '*': '#C8CCD4'
  branchColorPatterns:
    "^(main|master)$": '#C678DD'
    "^(user/[^/]+/)?fix": '#E06C75'
    "^(user/[^/]+/)?feat": '#98C379'
    "^(user/[^/]+/)?feature": '#98C379'
    "^(user/[^/]+/)?release": '#61AFEF'
  theme:
    activeBorderColor:
      - '#C678DD'
      - bold
    cherryPickedCommitBgColor:
      - '#56B6C2'
    cherryPickedCommitFgColor:
      - '#61AFEF'
    defaultFgColor:
      - '#C8CCD4'
    inactiveBorderColor:
      - '#ABB2BF'
    inactiveViewSelectedLineBgColor:
      - '#545862'
      - bold
    markedBaseCommitBgColor:
      - '#C678DD'
    markedBaseCommitFgColor:
      - '#98C379'
    optionsTextColor:
      - '#D75F00'
    searchingActiveBorderColor:
      - '#61AFEF'
    selectedLineBgColor:
      - '#3E4451'
    unstagedChangesColor:
      - '#E06C75'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

