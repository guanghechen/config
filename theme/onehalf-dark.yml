# onehalf-dark

gui:
  authorColors:
    '*': '#C8CCD4'
    guanghechen: '#61AFEF'
  branchColorPatterns:
    "^(main|master)$": '#C678DD'
    "^(user/[^/]+/)?chore": '#ABB2BF'
    "^(user/[^/]+/)?feat": '#98C379'
    "^(user/[^/]+/)?feature": '#98C379'
    "^(user/[^/]+/)?fix": '#E06C75'
    "^(user/[^/]+/)?refactor": '#D75F00'
    "^(user/[^/]+/)?release": '#61AFEF'
  theme:
    activeBorderColor:
      - '#C678DD'
      - bold
    cherryPickedCommitBgColor:
      - '#56B6C2'
    cherryPickedCommitFgColor:
      - '#1E222A'
    defaultFgColor:
      - '#C8CCD4'
    inactiveBorderColor:
      - '#ABB2BF'
    inactiveViewSelectedLineBgColor:
      - '#3E4451'
    markedBaseCommitBgColor:
      - '#E5C07B'
    markedBaseCommitFgColor:
      - '#1E222A'
    optionsTextColor:
      - '#D75F00'
    searchingActiveBorderColor:
      - '#56B6C2'
      - bold
    selectedLineBgColor:
      - '#545862'
    unstagedChangesColor:
      - '#E06C75'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
