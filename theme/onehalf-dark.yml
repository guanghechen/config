# onehalf-dark

gui:
  authorColors:
    guanghechen: 'blue'
    '*': '#C8CCD4'
  branchColors:
    main: 'blue'
  theme:
    defaultFgColor:
      - '#C8CCD4'
    activeBorderColor:
      - 'magenta'
      - bold
    inactiveBorderColor:
      - '#ABB2BF'
    optionsTextColor:
      -  '#D75F00'
    selectedLineBgColor:
      - '#3E4451'
    cherryPickedCommitFgColor:
      - 'blue'
    cherryPickedCommitBgColor:
      - 'cyan'
    markedBaseCommitFgColor:
      - 'green'
    markedBaseCommitBgColor:
      - 'magenta'
    searchingActiveBorderColor:
      - 'blue'
    unstagedChangesColor:
      - 'red'

git:
  paging:
    colorArg: always
    useConfig: true
    pager: delta --diff-so-fancy --dark

