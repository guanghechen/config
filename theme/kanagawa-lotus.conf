# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# kanagawa-lotus

[delta]
light                         = true
syntax-theme                  = kanagawa-lotus

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#3E5A87"

####################################################################################################

file-style                    = "#38384D" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#545464"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#A1364B" normal bold
line-numbers-plus-style       = "#4A6037" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#EEDBC1"
plus-style                    = syntax "#DEE6B6"
minus-non-emph-style          = syntax "#EEDBC1"
plus-non-emph-style           = syntax "#DEE6B6"
minus-emph-style              = "#38384D" "#E0B8A5" bold
plus-emph-style               = "#38384D" "#BCD0A6" bold

plus-empty-line-marker-style  = "#DEE6B6" "#DEE6B6"
minus-empty-line-marker-style = "#EEDBC1" "#EEDBC1"

####################################################################################################

commit-style                  = "#655A35" bold
commit-decoration-style       = none

blame-palette                 = "#F2ECBC" "#E5DDB0" "#DCD5AC"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#545464" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
