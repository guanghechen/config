#:schema https://yazi-rs.github.io/schemas/theme.json

# catppuccin-mocha

[app]
overall                 = { fg = "#CDD6F4", bg = "reset" }

[cmp]
border                  = { fg = "#CBA6F7" }
active                  = { fg = "#CDD6F4", bg = "#45475A", bold = true }
inactive                = { fg = "#BAC2DE" }

# Icons
icon_file               = ""
icon_folder             = ""
icon_command            = ""

[confirm]
border                  = { fg = "#585B70" }
title                   = { fg = "#F38BA8", bold = true }
body                    = { fg = "#CDD6F4" }
list                    = { fg = "#CDD6F4" }
btn_yes                 = { fg = "#1E1E2E", bg = "#A6E3A1", bold = true }
btn_no                  = { fg = "#CDD6F4", bg = "#313244", bold = true }
btn_labels              = [ "  [Y]es  ", "  (N)o  " ]

[help]
border                  = { fg = "#585B70" }
chord                   = { fg = "#89B4FA" }
action                  = { fg = "#CDD6F4" }
hovered                 = { fg = "#CDD6F4", bg = "#45475A", bold = true }

[input]
border                  = { fg = "#CBA6F7" }
title                   = { bold = true }
value                   = { fg = "#CDD6F4" }
selected                = { fg = "#CDD6F4", bg = "#45475A" }

[mgr]
cwd                     = { fg = "#89B4FA" }
border_symbol           = "│"
border_style            = { fg = "#585B70" }
count_copied            = { fg = "#1E1E2E", bg = "#A6E3A1" }
count_cut               = { fg = "#1E1E2E", bg = "#F38BA8" }
count_selected          = { fg = "#1E1E2E", bg = "#CBA6F7" }
find_keyword            = { fg = "#F9E2AF",  bold = true, italic = true }
find_position           = { fg = "#CBA6F7",  bg = "reset", bold = true, italic = true }
marker_copied           = { fg = "#A6E3A1",   bg = "#A6E3A1" }
marker_cut              = { fg = "#F38BA8",     bg = "#F38BA8" }
marker_marked           = { fg = "#89B4FA", bg = "#89B4FA" }
marker_selected         = { fg = "#CBA6F7", bg = "#CBA6F7" }
symlink_target          = { italic = true }
syntect_theme           = "~/.config/bat/themes/catppuccin-mocha.tmTheme"

[indicator]
parent                  = { fg = "#BAC2DE", bg = "#181825" }
current                 = { fg = "#CDD6F4", bg = "#45475A", bold = true }
preview                 = { fg = "#89B4FA", underline = true }

[mode]
normal_main             = { fg = "#1E1E2E", bg = "#89B4FA", bold = true }
normal_alt              = { fg = "#CDD6F4", bg = "#313244", bold = true }
select_main             = { fg = "#1E1E2E", bg = "#CBA6F7", bold = true }
select_alt              = { fg = "#CDD6F4", bg = "#313244", bold = true }
unset_main              = { fg = "#1E1E2E", bg = "#FAB387", bold = true }
unset_alt               = { fg = "#CDD6F4", bg = "#313244", bold = true }

[notify]
title_info              = { fg = "#A6E3A1" }
title_warn              = { fg = "#F9E2AF" }
title_error             = { fg = "#F38BA8" }
icon_info               = ""
icon_warn               = ""
icon_error              = ""

[pick]
border                  = { fg = "#CBA6F7" }
active                  = { fg = "#CDD6F4", bg = "#45475A", bold = true }
inactive                = { fg = "#BAC2DE" }

[spot]
border                  = { fg = "#585B70" }
title                   = { fg = "#89B4FA", bold = true }
tbl_col                 = { fg = "#89B4FA" }
tbl_cell                = { fg = "#CDD6F4", bg = "#45475A", bold = true }

[status]
overall                 = { fg = "#BAC2DE", bg = "reset" }
perm_exec               = { fg = "#A6E3A1", bold = true }
perm_read               = { fg = "#89B4FA", bold = true }
perm_sep                = { fg = "#BAC2DE", bold = true }
perm_write              = { fg = "#F9E2AF", bold = true }
perm_type               = { fg = "#CBA6F7", bold = true }
progress_error          = { fg = "#F38BA8", bg = "#181825" }
progress_label          = { fg = "#CDD6F4", bold = true }
progress_normal         = { fg = "#A6E3A1", bg = "#181825" }
sep_left                = { open = "",         close = "" }
sep_right               = { open = "",         close = "" }

[tabs]
active                  = { fg = "#1E1E2E", bg = "#CBA6F7", bold = true }
inactive                = { fg = "#BAC2DE", bg = "#181825" }
sep_inner               = { open = "",         close = "" }
sep_outer               = { open = "",         close = "" }

[tasks]
border                  = { fg = "#CBA6F7" }
title                   = { bold = true }
hovered                 = { fg = "#CDD6F4", bg = "#45475A", bold = true }

[which]
border                  = { fg = "#585B70" }
cols                    = 3
mask                    = { bg = "#181825" }
cand                    = { fg = "#89B4FA" }
rest                    = { fg = "#BAC2DE" }
desc                    = { fg = "#CDD6F4" }
separator               = "  "
separator_style         = { fg = "#BAC2DE" }

[filetype]
rules = [
  # Images
  { mime = "**/image/*", fg = "#F5C2E7" },

  # Media
  { mime = "**/{audio,video}/*", fg = "#FAB387" },

  # Archives
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F38BA8" },

  # Documents
  { mime = "**/application/{pdf,doc,rtf}", fg = "#94E2D5" },

  # Empty files
  # { mime = "inode/empty", fg = "#F38BA8" },

  # Special files
  { url = "*", is = "orphan", fg = "#1E1E2E", bg = "#F38BA8" },
  { url = "*", is = "exec"  , fg = "#A6E3A1" },

  # Dummy files
  { url = "*", is = "dummy", fg = "#1E1E2E", bg = "#F38BA8" },
  { url = "*/", is = "dummy", fg = "#1E1E2E", bg = "#F38BA8" },

  # Fallback
  { url = "*/", fg = "#89B4FA" },
  { url = "*", fg = "#CDD6F4" }
]

[icon]

prepend_globs = [
  { url = "*.{spec,test}.{js,cjs,mjs}",      text = "󰙨", fg = "#F9E2AF" },
  { url = "*.{spec,test}.{ts,cts,mts,tsx}",  text = "󰙨", fg = "#89B4FA" },
]

