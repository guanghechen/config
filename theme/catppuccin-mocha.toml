# catppuccin-mocha

[bell]
color = "#FAB387"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#1E1E2E"
cursor            = "#CBA6F7"

[colors.vi_mode_cursor]
text              = "#1E1E2E"
cursor            = "#89B4FA"

[colors.search.matches]
foreground        = "#1E1E2E"
background        = "#F9E2AF"

[colors.search.focused_match]
foreground        = "#1E1E2E"
background        = "#FAB387"

[colors.hints.start]
foreground        = "#1E1E2E"
background        = "#CBA6F7"

[colors.hints.end]
foreground        = "#1E1E2E"
background        = "#89B4FA"

[colors.selection]
text              = "#CDD6F4"
background        = "#45475A"

[colors.footer_bar]
foreground        = "#CDD6F4"
background        = "#181825"

[colors.primary]
background        = "#1E1E2E"
foreground        = "#CDD6F4"
dim_foreground    = "#BAC2DE"
bright_foreground = "#CDD6F4"

# Keep ANSI slots independent from the readable app accents in unified.
[colors.normal]
black             = "#45475A"
red               = "#F38BA8"
green             = "#A6E3A1"
yellow            = "#F9E2AF"
blue              = "#89B4FA"
magenta           = "#F5C2E7"
cyan              = "#94E2D5"
white             = "#A6ADC8"

[colors.bright]
black             = "#585B70"
red               = "#F38BA8"
green             = "#A6E3A1"
yellow            = "#F9E2AF"
blue              = "#89B4FA"
magenta           = "#F5C2E7"
cyan              = "#94E2D5"
white             = "#BAC2DE"

[colors.dim]
black             = "#45475A"
red               = "#F38BA8"
green             = "#A6E3A1"
yellow            = "#F9E2AF"
blue              = "#89B4FA"
magenta           = "#F5C2E7"
cyan              = "#94E2D5"
white             = "#A6ADC8"

[[colors.indexed_colors]]
index = 16
color = "#FAB387"

[[colors.indexed_colors]]
index = 17
color = "#F5E0DC"
