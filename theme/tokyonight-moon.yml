# tokyonight-moon

gui:
  authorColors:
    '*': '#a5afd9'
    guanghechen: '#82aaff'
  branchColorPatterns:
    "^(main|master)$": '#fca7ea'
    "^(user/[^/]+/)?chore": '#7c86ba'
    "^(user/[^/]+/)?feat": '#c3e88d'
    "^(user/[^/]+/)?feature": '#c3e88d'
    "^(user/[^/]+/)?fix": '#ff757f'
    "^(user/[^/]+/)?refactor": '#ff966c'
    "^(user/[^/]+/)?release": '#82aaff'
  theme:
    activeBorderColor:
      - '#fca7ea'
      - bold
    cherryPickedCommitBgColor:
      - '#86e1fc'
    cherryPickedCommitFgColor:
      - '#222436'
    defaultFgColor:
      - '#a5afd9'
    inactiveBorderColor:
      - '#7c86ba'
    inactiveViewSelectedLineBgColor:
      - '#191b29'
    markedBaseCommitBgColor:
      - '#ffc777'
    markedBaseCommitFgColor:
      - '#222436'
    optionsTextColor:
      - '#ff966c'
    searchingActiveBorderColor:
      - '#86e1fc'
      - bold
    selectedLineBgColor:
      - '#2f334d'
    unstagedChangesColor:
      - '#ff757f'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
