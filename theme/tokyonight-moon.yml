# tokyonight-moon

gui:
  authorColors:
    '*': '#aab6df'
    guanghechen: '#82aaff'
  branchColorPatterns:
    "^(main|master)$": '#c099ff'
    "^(user/[^/]+/)?chore": '#aab6df'
    "^(user/[^/]+/)?feat": '#c3e88d'
    "^(user/[^/]+/)?feature": '#c3e88d'
    "^(user/[^/]+/)?fix": '#ff8590'
    "^(user/[^/]+/)?refactor": '#ff966c'
    "^(user/[^/]+/)?release": '#82aaff'
  theme:
    activeBorderColor:
      - '#c099ff'
      - bold
    cherryPickedCommitBgColor:
      - '#2f334d'
    cherryPickedCommitFgColor:
      - '#c099ff'
    defaultFgColor:
      - '#c8d3f5'
    inactiveBorderColor:
      - '#4c5878'
    inactiveViewSelectedLineBgColor:
      - '#1e2030'
    markedBaseCommitBgColor:
      - '#343b54'
    markedBaseCommitFgColor:
      - '#c8d3f5'
    optionsTextColor:
      - '#82aaff'
    searchingActiveBorderColor:
      - '#ffc777'
      - bold
    selectedLineBgColor:
      - '#343b54'
      - bold
    unstagedChangesColor:
      - '#ff8590'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
