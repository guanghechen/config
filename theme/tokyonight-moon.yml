# tokyonight-moon

gui:
  authorColors:
    guanghechen: '#82aaff'
    '*': '#a5afd9'
  branchColorPatterns:
    "^(main|master)$": '#fca7ea'
    "^(user/[^/]+/)?fix": '#ff757f'
    "^(user/[^/]+/)?feat": '#c3e88d'
    "^(user/[^/]+/)?feature": '#c3e88d'
    "^(user/[^/]+/)?release": '#82aaff'
  theme:
    activeBorderColor:
      - '#fca7ea'
      - bold
    cherryPickedCommitBgColor:
      - '#86e1fc'
    cherryPickedCommitFgColor:
      - '#82aaff'
    defaultFgColor:
      - '#a5afd9'
    inactiveBorderColor:
      - '#7c86ba'
    inactiveViewSelectedLineBgColor:
      - '#2f334d'
      - bold
    markedBaseCommitBgColor:
      - '#fca7ea'
    markedBaseCommitFgColor:
      - '#c3e88d'
    optionsTextColor:
      - '#ff966c'
    searchingActiveBorderColor:
      - '#82aaff'
    selectedLineBgColor:
      - '#191b29'
    unstagedChangesColor:
      - '#ff757f'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

