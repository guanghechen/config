# catppuccin-macchiato

[bell]
color = "#F5A97F"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#24273A"
cursor            = "#C6A0F6"

[colors.vi_mode_cursor]
text              = "#24273A"
cursor            = "#8AADF4"

[colors.search.matches]
foreground        = "#24273A"
background        = "#EED49F"

[colors.search.focused_match]
foreground        = "#24273A"
background        = "#F5A97F"

[colors.hints.start]
foreground        = "#24273A"
background        = "#C6A0F6"

[colors.hints.end]
foreground        = "#24273A"
background        = "#8AADF4"

[colors.selection]
text              = "#CAD3F5"
background        = "#494D64"

[colors.footer_bar]
foreground        = "#CAD3F5"
background        = "#1E2030"

[colors.primary]
background        = "#24273A"
foreground        = "#CAD3F5"
dim_foreground    = "#B8C0E0"
bright_foreground = "#CAD3F5"

# Keep ANSI slots independent from the readable app accents in unified.
[colors.normal]
black             = "#494D64"
red               = "#ED8796"
green             = "#A6DA95"
yellow            = "#EED49F"
blue              = "#8AADF4"
magenta           = "#F5BDE6"
cyan              = "#8BD5CA"
white             = "#A5ADCB"

[colors.bright]
black             = "#5B6078"
red               = "#ED8796"
green             = "#A6DA95"
yellow            = "#EED49F"
blue              = "#8AADF4"
magenta           = "#F5BDE6"
cyan              = "#8BD5CA"
white             = "#B8C0E0"

[colors.dim]
black             = "#494D64"
red               = "#ED8796"
green             = "#A6DA95"
yellow            = "#EED49F"
blue              = "#8AADF4"
magenta           = "#F5BDE6"
cyan              = "#8BD5CA"
white             = "#A5ADCB"

[[colors.indexed_colors]]
index = 16
color = "#F5A97F"

[[colors.indexed_colors]]
index = 17
color = "#F4DBD6"
