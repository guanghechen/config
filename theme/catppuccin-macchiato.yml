# catppuccin-macchiato

gui:
  authorColors:
    '*': '#B8C0E0'
    guanghechen: '#8AADF4'
  branchColorPatterns:
    "^(main|master)$": '#C6A0F6'
    "^(user/[^/]+/)?chore": '#B8C0E0'
    "^(user/[^/]+/)?feat": '#A6DA95'
    "^(user/[^/]+/)?feature": '#A6DA95'
    "^(user/[^/]+/)?fix": '#ED8796'
    "^(user/[^/]+/)?refactor": '#F5A97F'
    "^(user/[^/]+/)?release": '#8AADF4'
  theme:
    activeBorderColor:
      - '#C6A0F6'
      - bold
    cherryPickedCommitBgColor:
      - '#363A4F'
    cherryPickedCommitFgColor:
      - '#C6A0F6'
    defaultFgColor:
      - '#CAD3F5'
    inactiveBorderColor:
      - '#5B6078'
    inactiveViewSelectedLineBgColor:
      - '#1E2030'
    markedBaseCommitBgColor:
      - '#494D64'
    markedBaseCommitFgColor:
      - '#CAD3F5'
    optionsTextColor:
      - '#8AADF4'
    searchingActiveBorderColor:
      - '#EED49F'
      - bold
    selectedLineBgColor:
      - '#494D64'
      - bold
    unstagedChangesColor:
      - '#ED8796'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
