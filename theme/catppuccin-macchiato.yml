# catppuccin-macchiato

gui:
  authorColors:
    guanghechen: '#8AADF4'
    '*': '#A5ADCB'
  branchColorPatterns:
    "^(main|master)$": '#F5BDE6'
    "^(user/[^/]+/)?fix": '#ED8796'
    "^(user/[^/]+/)?feat": '#A6DA95'
    "^(user/[^/]+/)?feature": '#A6DA95'
    "^(user/[^/]+/)?release": '#8AADF4'
  theme:
    activeBorderColor:
      - '#F5BDE6'
      - bold
    cherryPickedCommitBgColor:
      - '#8BD5CA'
    cherryPickedCommitFgColor:
      - '#8AADF4'
    defaultFgColor:
      - '#A5ADCB'
    inactiveBorderColor:
      - '#8087A2'
    inactiveViewSelectedLineBgColor:
      - '#494D64'
      - bold
    markedBaseCommitBgColor:
      - '#F5BDE6'
    markedBaseCommitFgColor:
      - '#A6DA95'
    optionsTextColor:
      - '#F5A97F'
    searchingActiveBorderColor:
      - '#8AADF4'
    selectedLineBgColor:
      - '#363A4F'
    unstagedChangesColor:
      - '#ED8796'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

