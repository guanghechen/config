# catppuccin-macchiato

gui:
  authorColors:
    '*': '#A5ADCB'
    guanghechen: '#8AADF4'
  branchColorPatterns:
    "^(main|master)$": '#F5BDE6'
    "^(user/[^/]+/)?chore": '#8087A2'
    "^(user/[^/]+/)?feat": '#A6DA95'
    "^(user/[^/]+/)?feature": '#A6DA95'
    "^(user/[^/]+/)?fix": '#ED8796'
    "^(user/[^/]+/)?refactor": '#F5A97F'
    "^(user/[^/]+/)?release": '#8AADF4'
  theme:
    activeBorderColor:
      - '#F5BDE6'
      - bold
    cherryPickedCommitBgColor:
      - '#8BD5CA'
    cherryPickedCommitFgColor:
      - '#24273A'
    defaultFgColor:
      - '#A5ADCB'
    inactiveBorderColor:
      - '#8087A2'
    inactiveViewSelectedLineBgColor:
      - '#363A4F'
    markedBaseCommitBgColor:
      - '#EED49F'
    markedBaseCommitFgColor:
      - '#24273A'
    optionsTextColor:
      - '#F5A97F'
    searchingActiveBorderColor:
      - '#8BD5CA'
      - bold
    selectedLineBgColor:
      - '#494D64'
    unstagedChangesColor:
      - '#ED8796'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --dark

