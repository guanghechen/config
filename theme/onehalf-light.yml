# onehalf-light

gui:
  authorColors:
    guanghechen: '#4078F2'
    '*': '#5C5F66'
  branchColorPatterns:
    "^(main|master)$": '#A28DCD'
    "^(user/[^/]+/)?fix": '#E45649'
    "^(user/[^/]+/)?feat": '#50A14F'
    "^(user/[^/]+/)?feature": '#50A14F'
    "^(user/[^/]+/)?release": '#4078F2'
  theme:
    activeBorderColor:
      - '#A28DCD'
      - bold
    cherryPickedCommitBgColor:
      - '#0B8EC6'
    cherryPickedCommitFgColor:
      - '#4078F2'
    defaultFgColor:
      - '#5C5F66'
    inactiveBorderColor:
      - '#383A42'
    inactiveViewSelectedLineBgColor:
      - '#DCDCDC'
      - bold
    markedBaseCommitBgColor:
      - '#A28DCD'
    markedBaseCommitFgColor:
      - '#50A14F'
    optionsTextColor:
      - '#FF6A00'
    searchingActiveBorderColor:
      - '#4078F2'
    selectedLineBgColor:
      - '#EAEAEA'
    unstagedChangesColor:
      - '#E45649'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --light

