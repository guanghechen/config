# onehalf-light

gui:
  authorColors:
    '*': '#5C5F66'
    guanghechen: '#4078F2'
  branchColorPatterns:
    "^(main|master)$": '#A28DCD'
    "^(user/[^/]+/)?chore": '#383A42'
    "^(user/[^/]+/)?feat": '#50A14F'
    "^(user/[^/]+/)?feature": '#50A14F'
    "^(user/[^/]+/)?fix": '#E45649'
    "^(user/[^/]+/)?refactor": '#FF6A00'
    "^(user/[^/]+/)?release": '#4078F2'
  theme:
    activeBorderColor:
      - '#A28DCD'
      - bold
    cherryPickedCommitBgColor:
      - '#0B8EC6'
    cherryPickedCommitFgColor:
      - '#FAFAFA'
    defaultFgColor:
      - '#5C5F66'
    inactiveBorderColor:
      - '#383A42'
    inactiveViewSelectedLineBgColor:
      - '#EAEAEA'
    markedBaseCommitBgColor:
      - '#DEA95F'
    markedBaseCommitFgColor:
      - '#FAFAFA'
    optionsTextColor:
      - '#FF6A00'
    searchingActiveBorderColor:
      - '#0B8EC6'
      - bold
    selectedLineBgColor:
      - '#DCDCDC'
    unstagedChangesColor:
      - '#E45649'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --light

