# kanagawa-dragon

gui:
  authorColors:
    '*': '#A6A69C'
    guanghechen: '#8BA4B0'
  branchColorPatterns:
    "^(main|master)$": '#A49AB2'
    "^(user/[^/]+/)?chore": '#A6A69C'
    "^(user/[^/]+/)?feat": '#87A987'
    "^(user/[^/]+/)?feature": '#87A987'
    "^(user/[^/]+/)?fix": '#D58C84'
    "^(user/[^/]+/)?refactor": '#BF9D85'
    "^(user/[^/]+/)?release": '#8BA4B0'
  theme:
    activeBorderColor:
      - '#8BA4B0'
      - bold
    cherryPickedCommitBgColor:
      - '#282727'
    cherryPickedCommitFgColor:
      - '#A49AB2'
    defaultFgColor:
      - '#C5C9C5'
    inactiveBorderColor:
      - '#50534E'
    inactiveViewSelectedLineBgColor:
      - '#12120F'
    markedBaseCommitBgColor:
      - '#303632'
    markedBaseCommitFgColor:
      - '#C5C9C5'
    optionsTextColor:
      - '#8BA4B0'
    searchingActiveBorderColor:
      - '#C4B28A'
      - bold
    selectedLineBgColor:
      - '#303632'
      - bold
    unstagedChangesColor:
      - '#D58C84'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
