# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# rosepine-moon

[delta "rosepine-moon"]
dark                          = true
syntax-theme                  = rosepine-moon

inline-hint-style             = "#9CCFD8"

####################################################################################################

file-style                    = "#E0DEF4" bold

hunk-header-line-number-style = "#A5A0BB"

line-numbers-minus-style      = "#F080A0" normal bold
line-numbers-plus-style       = "#75ADC1" normal bold

minus-style                   = syntax "#3A293B"
plus-style                    = syntax "#2E3B46"
minus-non-emph-style          = syntax "#3A293B"
plus-non-emph-style           = syntax "#2E3B46"
minus-emph-style              = "#E0DEF4" "#594056" bold
plus-emph-style               = "#E0DEF4" "#405563" bold

plus-empty-line-marker-style  = "#2E3B46" "#2E3B46"
minus-empty-line-marker-style = "#3A293B" "#3A293B"

####################################################################################################

commit-style                  = "#F6C177" bold

blame-palette                 = "#232136" "#2A273F" "#393552"
blame-separator-style         = "#A5A0BB" dim
