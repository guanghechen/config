# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# vsc-dark-modern

[delta]
dark                          = true
syntax-theme                  = vsc-dark-modern

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#0078D4"

####################################################################################################

file-style                    = "#CCCCCC" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#9D9D9D"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#F85149" normal bold
line-numbers-plus-style       = "#2EA043" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#4A1717"
plus-style                    = syntax "#343A26"
minus-non-emph-style          = syntax "#4A1717"
plus-non-emph-style           = syntax "#343A26"
minus-emph-style              = syntax "#6E1212" bold
plus-emph-style               = syntax "#475626" bold

plus-empty-line-marker-style  = "#343A26" "#343A26"
minus-empty-line-marker-style = "#4A1717" "#4A1717"

####################################################################################################

commit-style                  = "#DCDCAA" bold
commit-decoration-style       = none

blame-palette                 = "#1F1F1F" "#202020" "#313131"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#9D9D9D" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

