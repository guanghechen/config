# catppuccin-latte

[bell]
color = "#973C0F"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#EFF1F5"
cursor            = "#722FBC"

[colors.vi_mode_cursor]
text              = "#EFF1F5"
cursor            = "#2451B5"

[colors.search.matches]
foreground        = "#EFF1F5"
background        = "#7B4D0D"

[colors.search.focused_match]
foreground        = "#EFF1F5"
background        = "#973C0F"

[colors.hints.start]
foreground        = "#EFF1F5"
background        = "#722FBC"

[colors.hints.end]
foreground        = "#EFF1F5"
background        = "#2451B5"

[colors.selection]
text              = "#303446"
background        = "#CCD0DA"

[colors.footer_bar]
foreground        = "#303446"
background        = "#E6E9EF"

[colors.primary]
background        = "#EFF1F5"
foreground        = "#303446"
dim_foreground    = "#4C4F69"
