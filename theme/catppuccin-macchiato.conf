# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-macchiato

[delta "catppuccin-macchiato"]
dark                          = true
syntax-theme                  = catppuccin-macchiato

inline-hint-style             = "#8AADF4"

####################################################################################################

file-style                    = "#CAD3F5" bold

hunk-header-line-number-style = "#B8C0E0"

line-numbers-minus-style      = "#ED8796" normal bold
line-numbers-plus-style       = "#A6DA95" normal bold

minus-style                   = syntax "#3C3345"
plus-style                    = syntax "#343C45"
minus-non-emph-style          = syntax "#3C3345"
plus-non-emph-style           = syntax "#343C45"
minus-emph-style              = "#CAD3F5" "#543E50" bold
plus-emph-style               = "#CAD3F5" "#435250" bold

plus-empty-line-marker-style  = "#343C45" "#343C45"
minus-empty-line-marker-style = "#3C3345" "#3C3345"

####################################################################################################

commit-style                  = "#EED49F" bold

blame-palette                 = "#24273A" "#1E2030" "#363A4F"
blame-separator-style         = "#B8C0E0" dim
