# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-macchiato

[delta]
dark                          = true
syntax-theme                  = catppuccin-macchiato

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#8AADF4"

####################################################################################################

file-style                    = "#B8C0E0" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#A5ADCB"

line-numbers                  = true
line-numbers-left-style       = "#A5ADCB" "#24273A"
line-numbers-right-style      = "#A5ADCB" "#24273A"
line-numbers-zero-style       = "#A5ADCB" "#24273A"
line-numbers-minus-style      = "#A5ADCB" "#3A273A" bold
line-numbers-plus-style       = "#A5ADCB" "#2A3A2A" bold

zero-style                    = syntax normal
minus-style                   = syntax "#3A273A"
plus-style                    = syntax "#2A3A2A"
minus-non-emph-style          = syntax "#3A273A"
plus-non-emph-style           = syntax "#2A3A2A"
minus-emph-style              = syntax "#8B3A3A" bold
plus-emph-style               = syntax "#4A6E4A" bold

plus-empty-line-marker-style  = "#2A3A2A" "#2A3A2A"
minus-empty-line-marker-style = "#3A273A" "#3A273A"

####################################################################################################

commit-style                  = "#EED49F" bold
commit-decoration-style       = none

blame-palette                 = "#24273A" "#181926" "#363A4F"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#A5ADCB" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

