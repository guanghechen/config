# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-macchiato

[delta]
dark                          = true
syntax-theme                  = catppuccin-macchiato

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#8AADF4"

####################################################################################################

file-style                    = "#CAD3F5" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#B8C0E0"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#ED8796" normal bold
line-numbers-plus-style       = "#A6DA95" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#3C3345"
plus-style                    = syntax "#343C45"
minus-non-emph-style          = syntax "#3C3345"
plus-non-emph-style           = syntax "#343C45"
minus-emph-style              = "#CAD3F5" "#543E50" bold
plus-emph-style               = "#CAD3F5" "#435250" bold

plus-empty-line-marker-style  = "#343C45" "#343C45"
minus-empty-line-marker-style = "#3C3345" "#3C3345"

####################################################################################################

commit-style                  = "#EED49F" bold
commit-decoration-style       = none

blame-palette                 = "#24273A" "#1E2030" "#363A4F"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#B8C0E0" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
