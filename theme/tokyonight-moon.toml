# tokyonight-moon

[bell]
color = "#ff966c"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#222436"
cursor            = "#c099ff"

[colors.vi_mode_cursor]
text              = "#222436"
cursor            = "#82aaff"

[colors.search.matches]
foreground        = "#222436"
background        = "#ffc777"

[colors.search.focused_match]
foreground        = "#222436"
background        = "#ff966c"

[colors.hints.start]
foreground        = "#222436"
background        = "#c099ff"

[colors.hints.end]
foreground        = "#222436"
background        = "#82aaff"

[colors.selection]
text              = "#c8d3f5"
background        = "#343b54"

[colors.footer_bar]
foreground        = "#c8d3f5"
background        = "#1e2030"

[colors.primary]
background        = "#222436"
foreground        = "#c8d3f5"
dim_foreground    = "#aab6df"
bright_foreground = "#c8d3f5"

# Official ANSI slots; bright accents are the upstream HSLuv-generated values.
[colors.normal]
black             = "#1b1d2b"
red               = "#ff757f"
green             = "#c3e88d"
yellow            = "#ffc777"
blue              = "#82aaff"
magenta           = "#c099ff"
cyan              = "#86e1fc"
white             = "#828bb8"

[colors.bright]
black             = "#444a73"
red               = "#ff8d94"
green             = "#c7fb6d"
yellow            = "#ffd8ab"
blue              = "#9ab8ff"
magenta           = "#caabff"
cyan              = "#b2ebff"
white             = "#c8d3f5"

[colors.dim]
black             = "#1b1d2b"
red               = "#ff757f"
green             = "#c3e88d"
yellow            = "#ffc777"
blue              = "#82aaff"
magenta           = "#c099ff"
cyan              = "#86e1fc"
white             = "#828bb8"

[[colors.indexed_colors]]
index = 16
color = "#ff966c"

[[colors.indexed_colors]]
index = 17
color = "#c53b53"
