# gruvbox_light

git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#458588"
    "*": "#504945"
  branchColors:
    main: "#458588"
  theme:
    defaultFgColor:
      - "#504945"
    activeBorderColor:
      - "#D65D0E"
      - bold
    inactiveBorderColor:
      - "#7C6F64"
    optionsTextColor:
      -  "#D65D0E"
    selectedLineBgColor:
      - "#D5C4A1"
    cherryPickedCommitFgColor:
      - "#458588"
    cherryPickedCommitBgColor:
      - "#689D6A"
    markedBaseCommitFgColor:
      - "#98971A"
    markedBaseCommitBgColor:
      - "#8F3F71"
    searchingActiveBorderColor:
      - "#458588"
    unstagedChangesColor:
      - "#CC241D"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
