# tokyonight-night

gui:
  authorColors:
    '*': '#a9b1d6'
    guanghechen: '#7aa2f7'
  branchColorPatterns:
    "^(main|master)$": '#bb9af7'
    "^(user/[^/]+/)?chore": '#a9b1d6'
    "^(user/[^/]+/)?feat": '#9ece6a'
    "^(user/[^/]+/)?feature": '#9ece6a'
    "^(user/[^/]+/)?fix": '#f78498'
    "^(user/[^/]+/)?refactor": '#ff9e64'
    "^(user/[^/]+/)?release": '#7aa2f7'
  theme:
    activeBorderColor:
      - '#bb9af7'
      - bold
    cherryPickedCommitBgColor:
      - '#292e42'
    cherryPickedCommitFgColor:
      - '#bb9af7'
    defaultFgColor:
      - '#c0caf5'
    inactiveBorderColor:
      - '#48536f'
    inactiveViewSelectedLineBgColor:
      - '#16161e'
    markedBaseCommitBgColor:
      - '#30374e'
    markedBaseCommitFgColor:
      - '#c0caf5'
    optionsTextColor:
      - '#7aa2f7'
    searchingActiveBorderColor:
      - '#e0af68'
      - bold
    selectedLineBgColor:
      - '#30374e'
      - bold
    unstagedChangesColor:
      - '#f78498'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
