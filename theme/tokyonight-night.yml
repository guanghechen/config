# tokyonight-night

gui:
  authorColors:
    '*': '#9ba5cf'
    guanghechen: '#7aa2f7'
  branchColorPatterns:
    "^(main|master)$": '#9d7cd8'
    "^(user/[^/]+/)?chore": '#707aa4'
    "^(user/[^/]+/)?feat": '#9ece6a'
    "^(user/[^/]+/)?feature": '#9ece6a'
    "^(user/[^/]+/)?fix": '#f7768e'
    "^(user/[^/]+/)?refactor": '#ff9e64'
    "^(user/[^/]+/)?release": '#7aa2f7'
  theme:
    activeBorderColor:
      - '#9d7cd8'
      - bold
    cherryPickedCommitBgColor:
      - '#7dcfff'
    cherryPickedCommitFgColor:
      - '#1a1b26'
    defaultFgColor:
      - '#9ba5cf'
    inactiveBorderColor:
      - '#707aa4'
    inactiveViewSelectedLineBgColor:
      - '#0c0e14'
    markedBaseCommitBgColor:
      - '#e0af68'
    markedBaseCommitFgColor:
      - '#1a1b26'
    optionsTextColor:
      - '#ff9e64'
    searchingActiveBorderColor:
      - '#7dcfff'
      - bold
    selectedLineBgColor:
      - '#292e42'
    unstagedChangesColor:
      - '#f7768e'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
