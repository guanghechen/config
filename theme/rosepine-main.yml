# rosepine-main

gui:
  authorColors:
    '*': '#908CAA'
    guanghechen: '#9CCFD8'
  branchColorPatterns:
    "^(main|master)$": '#C4A7E7'
    "^(user/[^/]+/)?chore": '#6E6A86'
    "^(user/[^/]+/)?feat": '#31748F'
    "^(user/[^/]+/)?feature": '#31748F'
    "^(user/[^/]+/)?fix": '#EB6F92'
    "^(user/[^/]+/)?refactor": '#EBBCBA'
    "^(user/[^/]+/)?release": '#9CCFD8'
  theme:
    activeBorderColor:
      - '#31748F'
      - bold
    cherryPickedCommitBgColor:
      - '#EBBCBA'
    cherryPickedCommitFgColor:
      - '#1F1D2E'
    defaultFgColor:
      - '#E0DEF4'
    inactiveBorderColor:
      - '#6E6A86'
    inactiveViewSelectedLineBgColor:
      - '#1F1D2E'
    markedBaseCommitBgColor:
      - '#F6C177'
    markedBaseCommitFgColor:
      - '#9CCFD8'
    optionsTextColor:
      - '#9CCFD8'
    searchingActiveBorderColor:
      - '#EBBCBA'
      - bold
    selectedLineBgColor:
      - '#403D52'
      - bold
    unstagedChangesColor:
      - '#EB6F92'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
