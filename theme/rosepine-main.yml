# rosepine-main

gui:
  authorColors:
    '*': '#908CAA'
    guanghechen: '#31748F'
  branchColorPatterns:
    "^(main|master)$": '#C4A7E7'
    "^(user/[^/]+/)?chore": '#6E6A86'
    "^(user/[^/]+/)?feat": '#95B1AC'
    "^(user/[^/]+/)?feature": '#95B1AC'
    "^(user/[^/]+/)?fix": '#EB6F92'
    "^(user/[^/]+/)?refactor": '#EBBCBA'
    "^(user/[^/]+/)?release": '#31748F'
  theme:
    activeBorderColor:
      - '#C4A7E7'
      - bold
    cherryPickedCommitBgColor:
      - '#9CCFD8'
    cherryPickedCommitFgColor:
      - '#191724'
    defaultFgColor:
      - '#908CAA'
    inactiveBorderColor:
      - '#6E6A86'
    inactiveViewSelectedLineBgColor:
      - '#26233A'
    markedBaseCommitBgColor:
      - '#F6C177'
    markedBaseCommitFgColor:
      - '#191724'
    optionsTextColor:
      - '#EBBCBA'
    searchingActiveBorderColor:
      - '#9CCFD8'
      - bold
    selectedLineBgColor:
      - '#403D52'
    unstagedChangesColor:
      - '#EB6F92'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
