# rosepine-main
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: dark
  theme:
    activeBorderColor:
      - '#EBBCBA'
      - bold
    authorColors:
      '*': '#908CAA'
      guanghechen: '#9CCFD8'
    branchColorPatterns:
      "^(main|master)$": '#C4A7E7'
      "^(user/[^/]+/)?chore": '#908CAA'
      "^(user/[^/]+/)?feat": '#6FA3B6'
      "^(user/[^/]+/)?fix": '#EB6F92'
      "^(user/[^/]+/)?refactor": '#EBBCBA'
      "^(user/[^/]+/)?release": '#9CCFD8'
    cherryPickedCommitBgColor:
      - '#26233A'
    cherryPickedCommitFgColor:
      - '#EBBCBA'
    defaultFgColor:
      - '#E0DEF4'
    inactiveBorderColor:
      - '#524F67'
    inactiveViewSelectedLineBgColor:
      - '#1F1D2E'
    markedBaseCommitBgColor:
      - '#403D52'
    markedBaseCommitFgColor:
      - '#E0DEF4'
    optionsTextColor:
      - '#9CCFD8'
    searchingActiveBorderColor:
      - '#F6C177'
      - bold
    selectedLineBgColor:
      - '#403D52'
    selectedLineFgColor:
      - '#E0DEF4'
      - bold
    unstagedChangesColor:
      - '#EB6F92'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --dark
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
