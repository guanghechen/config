# rosepine-main

gui:
  authorColors:
    '*': '#908CAA'
    guanghechen: '#9CCFD8'
  branchColorPatterns:
    "^(main|master)$": '#C4A7E7'
    "^(user/[^/]+/)?chore": '#908CAA'
    "^(user/[^/]+/)?feat": '#6FA3B6'
    "^(user/[^/]+/)?feature": '#6FA3B6'
    "^(user/[^/]+/)?fix": '#EB6F92'
    "^(user/[^/]+/)?refactor": '#EBBCBA'
    "^(user/[^/]+/)?release": '#9CCFD8'
  theme:
    activeBorderColor:
      - '#EBBCBA'
      - bold
    cherryPickedCommitBgColor:
      - '#26233A'
    cherryPickedCommitFgColor:
      - '#EBBCBA'
    defaultFgColor:
      - '#E0DEF4'
    inactiveBorderColor:
      - '#524F67'
    inactiveViewSelectedLineBgColor:
      - '#1F1D2E'
    markedBaseCommitBgColor:
      - '#403D52'
    markedBaseCommitFgColor:
      - '#E0DEF4'
    optionsTextColor:
      - '#9CCFD8'
    searchingActiveBorderColor:
      - '#F6C177'
      - bold
    selectedLineBgColor:
      - '#403D52'
      - bold
    unstagedChangesColor:
      - '#EB6F92'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
