# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-latte

[delta]
light                         = true
syntax-theme                  = catppuccin-latte

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#2451B5"

####################################################################################################

file-style                    = "#303446" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#4C4F69"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#AD1635" normal bold
line-numbers-plus-style       = "#25651C" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#ECDAE2"
plus-style                    = syntax "#DEE9E1"
minus-non-emph-style          = syntax "#ECDAE2"
plus-non-emph-style           = syntax "#DEE9E1"
minus-emph-style              = "#303446" "#E9BFCC" bold
plus-emph-style               = "#303446" "#C9DFC9" bold

plus-empty-line-marker-style  = "#DEE9E1" "#DEE9E1"
minus-empty-line-marker-style = "#ECDAE2" "#ECDAE2"

####################################################################################################

commit-style                  = "#7B4D0D" bold
commit-decoration-style       = none

blame-palette                 = "#EFF1F5" "#E6E9EF" "#DCE0E8"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#4C4F69" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
