# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-latte

[delta]
light                         = true
syntax-theme                  = catppuccin-latte

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#1E66F5"

####################################################################################################

file-style                    = "#5C5F77" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#6C6F85"

line-numbers                  = true
line-numbers-left-style       = "#6C6F85" "#EFF1F5"
line-numbers-right-style      = "#6C6F85" "#EFF1F5"
line-numbers-zero-style       = "#6C6F85" "#EFF1F5"
line-numbers-minus-style      = "#6C6F85" "#E8CDD6" bold
line-numbers-plus-style       = "#6C6F85" "#D2E1D5" bold

zero-style                    = syntax normal
minus-style                   = syntax "#E8CDD6"
plus-style                    = syntax "#D2E1D5"
minus-non-emph-style          = syntax "#E8CDD6"
plus-non-emph-style           = syntax "#D2E1D5"
minus-emph-style              = syntax "#E5BAC5" bold
plus-emph-style               = syntax "#C3D9C3" bold

plus-empty-line-marker-style  = "#D2E1D5" "#D2E1D5"
minus-empty-line-marker-style = "#E8CDD6" "#E8CDD6"

####################################################################################################

commit-style                  = "#DF8E1D" bold
commit-decoration-style       = none

blame-palette                 = "#EFF1F5" "#DCE0E8" "#CCD0DA"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#6C6F85" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

