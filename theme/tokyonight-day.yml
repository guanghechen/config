# tokyonight-day

gui:
  authorColors:
    '*': '#294891'
    guanghechen: '#2e7de9'
  branchColorPatterns:
    "^(main|master)$": '#7847bd'
    "^(user/[^/]+/)?chore": '#1e3469'
    "^(user/[^/]+/)?feat": '#587539'
    "^(user/[^/]+/)?feature": '#587539'
    "^(user/[^/]+/)?fix": '#f52a65'
    "^(user/[^/]+/)?refactor": '#b15c00'
    "^(user/[^/]+/)?release": '#2e7de9'
  theme:
    activeBorderColor:
      - '#7847bd'
      - bold
    cherryPickedCommitBgColor:
      - '#007197'
    cherryPickedCommitFgColor:
      - '#e1e2e7'
    defaultFgColor:
      - '#294891'
    inactiveBorderColor:
      - '#1e3469'
    inactiveViewSelectedLineBgColor:
      - '#c4c8da'
    markedBaseCommitBgColor:
      - '#8c6c3e'
    markedBaseCommitFgColor:
      - '#e1e2e7'
    optionsTextColor:
      - '#b15c00'
    searchingActiveBorderColor:
      - '#007197'
      - bold
    selectedLineBgColor:
      - '#c1c9df'
    unstagedChangesColor:
      - '#f52a65'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --light

