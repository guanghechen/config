# tokyonight-day

gui:
  authorColors:
    '*': '#445270'
    guanghechen: '#254e96'
  branchColorPatterns:
    "^(main|master)$": '#663999'
    "^(user/[^/]+/)?chore": '#445270'
    "^(user/[^/]+/)?feat": '#3e5d2c'
    "^(user/[^/]+/)?feature": '#3e5d2c'
    "^(user/[^/]+/)?fix": '#a21d49'
    "^(user/[^/]+/)?refactor": '#7d4005'
    "^(user/[^/]+/)?release": '#254e96'
  theme:
    activeBorderColor:
      - '#663999'
      - bold
    cherryPickedCommitBgColor:
      - '#d5d9e4'
    cherryPickedCommitFgColor:
      - '#663999'
    defaultFgColor:
      - '#293552'
    inactiveBorderColor:
      - '#9ca6be'
    inactiveViewSelectedLineBgColor:
      - '#d0d5e3'
    markedBaseCommitBgColor:
      - '#ccd1df'
    markedBaseCommitFgColor:
      - '#293552'
    optionsTextColor:
      - '#254e96'
    searchingActiveBorderColor:
      - '#6b4d25'
      - bold
    selectedLineBgColor:
      - '#ccd1df'
      - bold
    unstagedChangesColor:
      - '#a21d49'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
