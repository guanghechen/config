# tokyonight-day

gui:
  authorColors:
    guanghechen: '#2e7de9'
    '*': '#294891'
  branchColorPatterns:
    "^(main|master)$": '#7847bd'
    "^(user/[^/]+/)?fix": '#f52a65'
    "^(user/[^/]+/)?feat": '#587539'
    "^(user/[^/]+/)?feature": '#587539'
    "^(user/[^/]+/)?release": '#2e7de9'
  theme:
    activeBorderColor:
      - '#7847bd'
      - bold
    cherryPickedCommitBgColor:
      - '#007197'
    cherryPickedCommitFgColor:
      - '#2e7de9'
    defaultFgColor:
      - '#294891'
    inactiveBorderColor:
      - '#1e3469'
    inactiveViewSelectedLineBgColor:
      - '#c1c9df'
      - bold
    markedBaseCommitBgColor:
      - '#7847bd'
    markedBaseCommitFgColor:
      - '#587539'
    optionsTextColor:
      - '#b15c00'
    searchingActiveBorderColor:
      - '#2e7de9'
    selectedLineBgColor:
      - '#c4c8da'
    unstagedChangesColor:
      - '#f52a65'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --light

