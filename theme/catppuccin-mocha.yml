# catppuccin-mocha

gui:
  authorColors:
    '*': '#BAC2DE'
    guanghechen: '#89B4FA'
  branchColorPatterns:
    "^(main|master)$": '#CBA6F7'
    "^(user/[^/]+/)?chore": '#BAC2DE'
    "^(user/[^/]+/)?feat": '#A6E3A1'
    "^(user/[^/]+/)?feature": '#A6E3A1'
    "^(user/[^/]+/)?fix": '#F38BA8'
    "^(user/[^/]+/)?refactor": '#FAB387'
    "^(user/[^/]+/)?release": '#89B4FA'
  theme:
    activeBorderColor:
      - '#CBA6F7'
      - bold
    cherryPickedCommitBgColor:
      - '#313244'
    cherryPickedCommitFgColor:
      - '#CBA6F7'
    defaultFgColor:
      - '#CDD6F4'
    inactiveBorderColor:
      - '#585B70'
    inactiveViewSelectedLineBgColor:
      - '#181825'
    markedBaseCommitBgColor:
      - '#45475A'
    markedBaseCommitFgColor:
      - '#CDD6F4'
    optionsTextColor:
      - '#89B4FA'
    searchingActiveBorderColor:
      - '#F9E2AF'
      - bold
    selectedLineBgColor:
      - '#45475A'
      - bold
    unstagedChangesColor:
      - '#F38BA8'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
