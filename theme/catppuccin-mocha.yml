# catppuccin-mocha

gui:
  authorColors:
    guanghechen: 'blue'
    '*': '#A6ADC8'
  branchColors:
    main: 'blue'
  theme:
    defaultFgColor:
      - '#A6ADC8'
    activeBorderColor:
      - 'magenta'
      - bold
    inactiveBorderColor:
      - '#7F849C'
    optionsTextColor:
      -  '#FAB387'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitFgColor:
      - 'blue'
    cherryPickedCommitBgColor:
      - 'cyan'
    markedBaseCommitFgColor:
      - 'green'
    markedBaseCommitBgColor:
      - 'magenta'
    searchingActiveBorderColor:
      - 'blue'
    unstagedChangesColor:
      - 'red'

git:
  paging:
    colorArg: always
    useConfig: true
    pager: delta --diff-so-fancy --dark

