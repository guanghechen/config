# catppuccin-mocha

gui:
  authorColors:
    '*': '#A6ADC8'
    guanghechen: '#89B4FA'
  branchColorPatterns:
    "^(main|master)$": '#F5C2E7'
    "^(user/[^/]+/)?chore": '#7F849C'
    "^(user/[^/]+/)?feat": '#A6E3A1'
    "^(user/[^/]+/)?feature": '#A6E3A1'
    "^(user/[^/]+/)?fix": '#F38BA8'
    "^(user/[^/]+/)?refactor": '#FAB387'
    "^(user/[^/]+/)?release": '#89B4FA'
  theme:
    activeBorderColor:
      - '#F5C2E7'
      - bold
    cherryPickedCommitBgColor:
      - '#94E2D5'
    cherryPickedCommitFgColor:
      - '#1E1E2E'
    defaultFgColor:
      - '#A6ADC8'
    inactiveBorderColor:
      - '#7F849C'
    inactiveViewSelectedLineBgColor:
      - '#313244'
    markedBaseCommitBgColor:
      - '#F9E2AF'
    markedBaseCommitFgColor:
      - '#1E1E2E'
    optionsTextColor:
      - '#FAB387'
    searchingActiveBorderColor:
      - '#94E2D5'
      - bold
    selectedLineBgColor:
      - '#45475A'
    unstagedChangesColor:
      - '#F38BA8'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --dark

