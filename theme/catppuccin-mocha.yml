# catppuccin-mocha

gui:
  authorColors:
    guanghechen: '#89B4FA'
    '*': '#A6ADC8'
  branchColorPatterns:
    "^(main|master)$": '#F5C2E7'
    "^(user/[^/]+/)?fix": '#F38BA8'
    "^(user/[^/]+/)?feat": '#A6E3A1'
    "^(user/[^/]+/)?feature": '#A6E3A1'
    "^(user/[^/]+/)?release": '#89B4FA'
  theme:
    activeBorderColor:
      - '#F5C2E7'
      - bold
    cherryPickedCommitBgColor:
      - '#94E2D5'
    cherryPickedCommitFgColor:
      - '#89B4FA'
    defaultFgColor:
      - '#A6ADC8'
    inactiveBorderColor:
      - '#7F849C'
    inactiveViewSelectedLineBgColor:
      - '#45475A'
      - bold
    markedBaseCommitBgColor:
      - '#F5C2E7'
    markedBaseCommitFgColor:
      - '#A6E3A1'
    optionsTextColor:
      - '#FAB387'
    searchingActiveBorderColor:
      - '#89B4FA'
    selectedLineBgColor:
      - '#313244'
    unstagedChangesColor:
      - '#F38BA8'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

