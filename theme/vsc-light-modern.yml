# vsc-light-modern

gui:
  authorColors:
    guanghechen: '#005FB8'
    '*': '#616161'
  branchColorPatterns:
    "^(main|master)$": '#AF00DB'
    "^(user/[^/]+/)?fix": '#F85149'
    "^(user/[^/]+/)?feat": '#2EA043'
    "^(user/[^/]+/)?feature": '#2EA043'
    "^(user/[^/]+/)?release": '#005FB8'
  theme:
    activeBorderColor:
      - '#AF00DB'
      - bold
    cherryPickedCommitBgColor:
      - '#267F99'
    cherryPickedCommitFgColor:
      - '#005FB8'
    defaultFgColor:
      - '#616161'
    inactiveBorderColor:
      - '#767676'
    inactiveViewSelectedLineBgColor:
      - '#E5EBF1'
      - bold
    markedBaseCommitBgColor:
      - '#AF00DB'
    markedBaseCommitFgColor:
      - '#2EA043'
    optionsTextColor:
      - '#795E26'
    searchingActiveBorderColor:
      - '#005FB8'
    selectedLineBgColor:
      - '#E5E5E5'
    unstagedChangesColor:
      - '#F85149'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --light

