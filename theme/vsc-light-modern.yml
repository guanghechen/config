# vsc-light-modern
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: light
  theme:
    activeBorderColor:
      - '#AF00DB'
      - bold
    authorColors:
      '*': '#616161'
      guanghechen: '#005FB8'
    branchColorPatterns:
      "^(main|master)$": '#AF00DB'
      "^(user/[^/]+/)?chore": '#616161'
      "^(user/[^/]+/)?feat": '#107C10'
      "^(user/[^/]+/)?fix": '#CD3131'
      "^(user/[^/]+/)?refactor": '#C72E0F'
      "^(user/[^/]+/)?release": '#005FB8'
    cherryPickedCommitBgColor:
      - '#267F99'
    cherryPickedCommitFgColor:
      - '#FFFFFF'
    defaultFgColor:
      - '#616161'
    inactiveBorderColor:
      - '#8B949E'
    inactiveViewSelectedLineBgColor:
      - '#E8E8E8'
    markedBaseCommitBgColor:
      - '#795E26'
    markedBaseCommitFgColor:
      - '#FFFFFF'
    optionsTextColor:
      - '#795E26'
    searchingActiveBorderColor:
      - '#005FB8'
      - bold
    selectedLineBgColor:
      - '#D3D3D3'
    selectedLineFgColor:
      - '#3B3B3B'
      - bold
    unstagedChangesColor:
      - '#CD3131'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --light
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
