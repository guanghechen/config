# vsc-light-modern

gui:
  authorColors:
    '*': '#616161'
    guanghechen: '#005FB8'
  branchColorPatterns:
    "^(main|master)$": '#AF00DB'
    "^(user/[^/]+/)?chore": '#8B949E'
    "^(user/[^/]+/)?feat": '#2EA043'
    "^(user/[^/]+/)?feature": '#2EA043'
    "^(user/[^/]+/)?fix": '#F85149'
    "^(user/[^/]+/)?refactor": '#C72E0F'
    "^(user/[^/]+/)?release": '#005FB8'
  theme:
    activeBorderColor:
      - '#AF00DB'
      - bold
    cherryPickedCommitBgColor:
      - '#267F99'
    cherryPickedCommitFgColor:
      - '#FFFFFF'
    defaultFgColor:
      - '#616161'
    inactiveBorderColor:
      - '#8B949E'
    inactiveViewSelectedLineBgColor:
      - '#E8E8E8'
    markedBaseCommitBgColor:
      - '#795E26'
    markedBaseCommitFgColor:
      - '#FFFFFF'
    optionsTextColor:
      - '#795E26'
    searchingActiveBorderColor:
      - '#005FB8'
      - bold
    selectedLineBgColor:
      - '#D3D3D3'
    unstagedChangesColor:
      - '#F85149'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
