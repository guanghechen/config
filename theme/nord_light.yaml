git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#5E81AC"
    "*": "#E5E9F0"
  branchColors:
    main: "#5E81AC"
  theme:
    defaultFgColor:
      - "#E5E9F0"
    activeBorderColor:
      - "#D08770"
      - bold
    inactiveBorderColor:
      - "#C8CCD4"
    optionsTextColor:
      -  "#D08770"
    selectedLineBgColor:
      - "#3B4252"
    cherryPickedCommitFgColor:
      - "#5E81AC"
    cherryPickedCommitBgColor:
      - "#88C0D0"
    markedBaseCommitFgColor:
      - "#A3BE8C"
    markedBaseCommitBgColor:
      - "#B48EAD"
    searchingActiveBorderColor:
      - "#5E81AC"
    unstagedChangesColor:
      - "#BF616A"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
