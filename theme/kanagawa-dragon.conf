# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# kanagawa-dragon

[delta]
dark                          = true
syntax-theme                  = kanagawa-dragon

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#8BA4B0"

####################################################################################################

file-style                    = "#C8C093" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#A6A69C"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#C4746E" normal bold
line-numbers-plus-style       = "#8A9A7B" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#43242B"
plus-style                    = syntax "#2B3328"
minus-non-emph-style          = syntax "#43242B"
plus-non-emph-style           = syntax "#2B3328"
minus-emph-style              = syntax "#C34043" bold
plus-emph-style               = syntax "#76946A" bold

plus-empty-line-marker-style  = "#2B3328" "#2B3328"
minus-empty-line-marker-style = "#43242B" "#43242B"

####################################################################################################

commit-style                  = "#C4B28A" bold
commit-decoration-style       = none

blame-palette                 = "#181616" "#282727" "#393836"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#A6A69C" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
