# kanagawa-wave

[bell]
color = "#FFA066"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#1F1F28"
cursor            = "#E6C384"

[colors.vi_mode_cursor]
text              = "#1F1F28"
cursor            = "#7E9CD8"

[colors.search.matches]
foreground        = "#1F1F28"
background        = "#E6C384"

[colors.search.focused_match]
foreground        = "#1F1F28"
background        = "#FFA066"

[colors.hints.start]
foreground        = "#1F1F28"
background        = "#AC96CC"

[colors.hints.end]
foreground        = "#1F1F28"
background        = "#7E9CD8"

[colors.selection]
text              = "#DCD7BA"
background        = "#223249"

[colors.footer_bar]
foreground        = "#DCD7BA"
background        = "#16161D"

[colors.primary]
background        = "#1F1F28"
foreground        = "#DCD7BA"
dim_foreground    = "#C8C093"
bright_foreground = "#DCD7BA"

# Keep ANSI slots independent from the readable app accents in unified.
[colors.normal]
black             = "#16161D"
red               = "#C34043"
green             = "#76946A"
yellow            = "#C0A36E"
blue              = "#7E9CD8"
magenta           = "#957FB8"
cyan              = "#6A9589"
white             = "#C8C093"

[colors.bright]
black             = "#727169"
red               = "#E82424"
green             = "#98BB6C"
yellow            = "#E6C384"
blue              = "#7FB4CA"
magenta           = "#938AA9"
cyan              = "#7AA89F"
white             = "#DCD7BA"

[colors.dim]
black             = "#16161D"
red               = "#C34043"
green             = "#76946A"
yellow            = "#C0A36E"
blue              = "#7E9CD8"
magenta           = "#957FB8"
cyan              = "#6A9589"
white             = "#C8C093"

[[colors.indexed_colors]]
index = 16
color = "#FFA066"

[[colors.indexed_colors]]
index = 17
color = "#FF5D62"
