# kanagawa-dragon

[bell]
color = "#BF9D85"

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.cursor]
text              = "#181616"
cursor            = "#C4B28A"

[colors.vi_mode_cursor]
text              = "#181616"
cursor            = "#8BA4B0"

[colors.search.matches]
foreground        = "#181616"
background        = "#C4B28A"

[colors.search.focused_match]
foreground        = "#181616"
background        = "#BF9D85"

[colors.hints.start]
foreground        = "#181616"
background        = "#A49AB2"

[colors.hints.end]
foreground        = "#181616"
background        = "#8BA4B0"

[colors.selection]
text              = "#C5C9C5"
background        = "#303632"

[colors.footer_bar]
foreground        = "#C5C9C5"
