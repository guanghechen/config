# catppuccin-latte

gui:
  authorColors:
    '*': '#4C4F69'
    guanghechen: '#2451B5'
  branchColorPatterns:
    "^(main|master)$": '#722FBC'
    "^(user/[^/]+/)?chore": '#4C4F69'
    "^(user/[^/]+/)?feat": '#25651C'
    "^(user/[^/]+/)?feature": '#25651C'
    "^(user/[^/]+/)?fix": '#AD1635'
    "^(user/[^/]+/)?refactor": '#973C0F'
    "^(user/[^/]+/)?release": '#2451B5'
  theme:
    activeBorderColor:
      - '#722FBC'
      - bold
    cherryPickedCommitBgColor:
      - '#DCE0E8'
    cherryPickedCommitFgColor:
      - '#722FBC'
    defaultFgColor:
      - '#303446'
    inactiveBorderColor:
      - '#BCC0CC'
    inactiveViewSelectedLineBgColor:
      - '#E6E9EF'
    markedBaseCommitBgColor:
      - '#CCD0DA'
    markedBaseCommitFgColor:
      - '#303446'
    optionsTextColor:
      - '#2451B5'
    searchingActiveBorderColor:
      - '#7B4D0D'
      - bold
    selectedLineBgColor:
      - '#CCD0DA'
      - bold
    unstagedChangesColor:
      - '#AD1635'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
