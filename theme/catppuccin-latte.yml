# catppuccin-latte

gui:
  authorColors:
    '*': '#6C6F85'
    guanghechen: '#1E66F5'
  branchColorPatterns:
    "^(main|master)$": '#EA76CB'
    "^(user/[^/]+/)?chore": '#8C8FA1'
    "^(user/[^/]+/)?feat": '#40A02B'
    "^(user/[^/]+/)?feature": '#40A02B'
    "^(user/[^/]+/)?fix": '#D20F39'
    "^(user/[^/]+/)?refactor": '#FE640B'
    "^(user/[^/]+/)?release": '#1E66F5'
  theme:
    activeBorderColor:
      - '#EA76CB'
      - bold
    cherryPickedCommitBgColor:
      - '#179299'
    cherryPickedCommitFgColor:
      - '#EFF1F5'
    defaultFgColor:
      - '#6C6F85'
    inactiveBorderColor:
      - '#8C8FA1'
    inactiveViewSelectedLineBgColor:
      - '#CCD0DA'
    markedBaseCommitBgColor:
      - '#DF8E1D'
    markedBaseCommitFgColor:
      - '#EFF1F5'
    optionsTextColor:
      - '#FE640B'
    searchingActiveBorderColor:
      - '#179299'
      - bold
    selectedLineBgColor:
      - '#BCC0CC'
    unstagedChangesColor:
      - '#D20F39'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
