# catppuccin-latte

git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#1E66F5"
    "*": "#6C6F85"
  branchColors:
    main: "#1E66F5"
  theme:
    defaultFgColor:
      - "#6C6F85"
    activeBorderColor:
      - "#FE640B"
      - bold
    inactiveBorderColor:
      - "#8C8FA1"
    optionsTextColor:
      -  "#FE640B"
    selectedLineBgColor:
      - "#CCD0DA"
    cherryPickedCommitFgColor:
      - "#1E66F5"
    cherryPickedCommitBgColor:
      - "#179299"
    markedBaseCommitFgColor:
      - "#40A02B"
    markedBaseCommitBgColor:
      - "#8839EF"
    searchingActiveBorderColor:
      - "#1E66F5"
    unstagedChangesColor:
      - "#D20F39"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
