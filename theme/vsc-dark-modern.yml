# vsc-dark-modern
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: dark
  theme:
    activeBorderColor:
      - '#C586C0'
      - bold
    authorColors:
      '*': '#9D9D9D'
      guanghechen: '#4DAAFC'
    branchColorPatterns:
      "^(main|master)$": '#C586C0'
      "^(user/[^/]+/)?chore": '#9D9D9D'
      "^(user/[^/]+/)?feat": '#2EA043'
      "^(user/[^/]+/)?fix": '#F85149'
      "^(user/[^/]+/)?refactor": '#CE9178'
      "^(user/[^/]+/)?release": '#4DAAFC'
    cherryPickedCommitBgColor:
      - '#4EC9B0'
    cherryPickedCommitFgColor:
      - '#1F1F1F'
    defaultFgColor:
      - '#9D9D9D'
    inactiveBorderColor:
      - '#6E7681'
    inactiveViewSelectedLineBgColor:
      - '#313131'
    markedBaseCommitBgColor:
      - '#DCDCAA'
    markedBaseCommitFgColor:
      - '#1F1F1F'
    optionsTextColor:
      - '#DCDCAA'
    searchingActiveBorderColor:
      - '#0078D4'
      - bold
    selectedLineBgColor:
      - '#3C3C3C'
    selectedLineFgColor:
      - '#CCCCCC'
      - bold
    unstagedChangesColor:
      - '#F85149'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --dark
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
