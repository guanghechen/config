# vsc-dark-modern

gui:
  authorColors:
    guanghechen: 'blue'
    '*': '#868686'
  branchColors:
    main: 'blue'
  theme:
    defaultFgColor:
      - '#868686'
    activeBorderColor:
      - 'magenta'
      - bold
    inactiveBorderColor:
      - '#989898'
    optionsTextColor:
      -  '#CE9178'
    selectedLineBgColor:
      - '#2A2D2E'
    cherryPickedCommitFgColor:
      - 'blue'
    cherryPickedCommitBgColor:
      - 'cyan'
    markedBaseCommitFgColor:
      - 'green'
    markedBaseCommitBgColor:
      - 'magenta'
    searchingActiveBorderColor:
      - 'blue'
    unstagedChangesColor:
      - 'red'

git:
  paging:
    colorArg: always
    useConfig: true
    pager: delta --diff-so-fancy --dark

