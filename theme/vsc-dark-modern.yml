# vsc-dark-modern

gui:
  authorColors:
    guanghechen: '#4DAAFC'
    '*': '#9D9D9D'
  branchColorPatterns:
    "^(main|master)$": '#C586C0'
    "^(user/[^/]+/)?fix": '#F85149'
    "^(user/[^/]+/)?feat": '#2EA043'
    "^(user/[^/]+/)?feature": '#2EA043'
    "^(user/[^/]+/)?release": '#0078D4'
  theme:
    activeBorderColor:
      - '#C586C0'
      - bold
    cherryPickedCommitBgColor:
      - '#4EC9B0'
    cherryPickedCommitFgColor:
      - '#0078D4'
    defaultFgColor:
      - '#9D9D9D'
    inactiveBorderColor:
      - '#6E7681'
    inactiveViewSelectedLineBgColor:
      - '#3A3D41'
      - bold
    markedBaseCommitBgColor:
      - '#C586C0'
    markedBaseCommitFgColor:
      - '#2EA043'
    optionsTextColor:
      - '#DCDCAA'
    searchingActiveBorderColor:
      - '#0078D4'
    selectedLineBgColor:
      - '#313131'
    unstagedChangesColor:
      - '#F85149'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

