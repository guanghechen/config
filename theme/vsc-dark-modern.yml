# vsc-dark-modern

gui:
  authorColors:
    '*': '#9D9D9D'
    guanghechen: '#4DAAFC'
  branchColorPatterns:
    "^(main|master)$": '#C586C0'
    "^(user/[^/]+/)?chore": '#6E7681'
    "^(user/[^/]+/)?feat": '#2EA043'
    "^(user/[^/]+/)?feature": '#2EA043'
    "^(user/[^/]+/)?fix": '#F85149'
    "^(user/[^/]+/)?refactor": '#CE9178'
    "^(user/[^/]+/)?release": '#0078D4'
  theme:
    activeBorderColor:
      - '#C586C0'
      - bold
    cherryPickedCommitBgColor:
      - '#4EC9B0'
    cherryPickedCommitFgColor:
      - '#1F1F1F'
    defaultFgColor:
      - '#9D9D9D'
    inactiveBorderColor:
      - '#6E7681'
    inactiveViewSelectedLineBgColor:
      - '#313131'
    markedBaseCommitBgColor:
      - '#DCDCAA'
    markedBaseCommitFgColor:
      - '#1F1F1F'
    optionsTextColor:
      - '#DCDCAA'
    searchingActiveBorderColor:
      - '#0078D4'
      - bold
    selectedLineBgColor:
      - '#3C3C3C'
    unstagedChangesColor:
      - '#F85149'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
