git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#4078F2"
    "*": "#393F4A"
  branchColors:
    main: "#4078F2"
  theme:
    defaultFgColor:
      - "#393F4A"
    activeBorderColor:
      - "#F07178"
      - bold
    inactiveBorderColor:
      - "#565C64"
    optionsTextColor:
      -  "#F07178"
    selectedLineBgColor:
      - "#C8CCD4"
    cherryPickedCommitFgColor:
      - "#4078F2"
    cherryPickedCommitBgColor:
      - "#0B8EC6"
    markedBaseCommitFgColor:
      - "#50A14F"
    markedBaseCommitBgColor:
      - "#C678DD"
    searchingActiveBorderColor:
      - "#4078F2"
    unstagedChangesColor:
      - "#D84A3D"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
