git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#4078F2"
    "*": "#5C5F66"
  branchColors:
    main: "#4078F2"
  theme:
    defaultFgColor:
      - "#5C5F66"
    activeBorderColor:
      - "#FF6A00"
      - bold
    inactiveBorderColor:
      - "#383A42"
    optionsTextColor:
      -  "#FF6A00"
    selectedLineBgColor:
      - "#E5E5E5"
    cherryPickedCommitFgColor:
      - "#4078F2"
    cherryPickedCommitBgColor:
      - "#0B8EC6"
    markedBaseCommitFgColor:
      - "#50A14F"
    markedBaseCommitBgColor:
      - "#B294BB"
    searchingActiveBorderColor:
      - "#4078F2"
    unstagedChangesColor:
      - "#D84A3D"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
