# catppuccin-frappe

gui:
  authorColors:
    '*': '#B5BFE2'
    guanghechen: '#8CAAEE'
  branchColorPatterns:
    "^(main|master)$": '#CA9EE6'
    "^(user/[^/]+/)?chore": '#B5BFE2'
    "^(user/[^/]+/)?feat": '#A6D189'
    "^(user/[^/]+/)?feature": '#A6D189'
    "^(user/[^/]+/)?fix": '#E78284'
    "^(user/[^/]+/)?refactor": '#EF9F76'
    "^(user/[^/]+/)?release": '#8CAAEE'
  theme:
    activeBorderColor:
      - '#CA9EE6'
      - bold
    cherryPickedCommitBgColor:
      - '#414559'
    cherryPickedCommitFgColor:
      - '#CA9EE6'
    defaultFgColor:
      - '#C6D0F5'
    inactiveBorderColor:
      - '#626880'
    inactiveViewSelectedLineBgColor:
      - '#292C3C'
    markedBaseCommitBgColor:
      - '#51576D'
    markedBaseCommitFgColor:
      - '#C6D0F5'
    optionsTextColor:
      - '#8CAAEE'
    searchingActiveBorderColor:
      - '#E5C890'
      - bold
    selectedLineBgColor:
      - '#51576D'
      - bold
    unstagedChangesColor:
      - '#E78284'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
