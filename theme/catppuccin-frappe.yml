# catppuccin-frappe

git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#8CAAEE"
    "*": "#A5ADCE"
  branchColors:
    main: "#8CAAEE"
  theme:
    defaultFgColor:
      - "#A5ADCE"
    activeBorderColor:
      - "#CA9EE6"
      - bold
    inactiveBorderColor:
      - "#838BA7"
    optionsTextColor:
      -  "#EF9F76"
    selectedLineBgColor:
      - "#232634"
    cherryPickedCommitFgColor:
      - "#8CAAEE"
    cherryPickedCommitBgColor:
      - "#81C8BE"
    markedBaseCommitFgColor:
      - "#A6D189"
    markedBaseCommitBgColor:
      - "#CA9EE6"
    searchingActiveBorderColor:
      - "#8CAAEE"
    unstagedChangesColor:
      - "#E78284"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
