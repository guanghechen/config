# catppuccin-frappe

gui:
  authorColors:
    '*': '#A5ADCE'
    guanghechen: '#8CAAEE'
  branchColorPatterns:
    "^(main|master)$": '#F4B8E4'
    "^(user/[^/]+/)?chore": '#838BA7'
    "^(user/[^/]+/)?feat": '#A6D189'
    "^(user/[^/]+/)?feature": '#A6D189'
    "^(user/[^/]+/)?fix": '#E78284'
    "^(user/[^/]+/)?refactor": '#EF9F76'
    "^(user/[^/]+/)?release": '#8CAAEE'
  theme:
    activeBorderColor:
      - '#F4B8E4'
      - bold
    cherryPickedCommitBgColor:
      - '#81C8BE'
    cherryPickedCommitFgColor:
      - '#303446'
    defaultFgColor:
      - '#A5ADCE'
    inactiveBorderColor:
      - '#838BA7'
    inactiveViewSelectedLineBgColor:
      - '#414559'
    markedBaseCommitBgColor:
      - '#E5C890'
    markedBaseCommitFgColor:
      - '#303446'
    optionsTextColor:
      - '#EF9F76'
    searchingActiveBorderColor:
      - '#81C8BE'
      - bold
    selectedLineBgColor:
      - '#51576D'
    unstagedChangesColor:
      - '#E78284'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --dark

