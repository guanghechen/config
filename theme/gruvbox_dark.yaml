git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "#83A598"
    "*": "#D5C4A1"
  branchColors:
    main: "#83A598"
  theme:
    defaultFgColor:
      - "#D5C4A1"
    activeBorderColor:
      - "#FE8019"
      - bold
    inactiveBorderColor:
      - "#A89984"
    optionsTextColor:
      -  "#FE8019"
    selectedLineBgColor:
      - "#504945"
    cherryPickedCommitFgColor:
      - "#83A598"
    cherryPickedCommitBgColor:
      - "#8EC07C"
    markedBaseCommitFgColor:
      - "#B8BB26"
    markedBaseCommitBgColor:
      - "#B16286"
    searchingActiveBorderColor:
      - "#83A598"
    unstagedChangesColor:
      - "#FB4934"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
