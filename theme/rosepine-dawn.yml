# rosepine-dawn
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: light
  theme:
    activeBorderColor:
      - '#853C3A'
      - bold
    authorColors:
      '*': '#545064'
      guanghechen: '#235965'
    branchColorPatterns:
      "^(main|master)$": '#634873'
      "^(user/[^/]+/)?chore": '#545064'
      "^(user/[^/]+/)?feat": '#205569'
      "^(user/[^/]+/)?fix": '#8A344D'
      "^(user/[^/]+/)?refactor": '#853C3A'
      "^(user/[^/]+/)?release": '#235965'
    cherryPickedCommitBgColor:
      - '#F2E9E1'
    cherryPickedCommitFgColor:
      - '#853C3A'
    defaultFgColor:
      - '#2C283B'
    inactiveBorderColor:
      - '#CECACD'
    inactiveViewSelectedLineBgColor:
      - '#FFFAF3'
    markedBaseCommitBgColor:
      - '#DFDAD9'
    markedBaseCommitFgColor:
      - '#2C283B'
    optionsTextColor:
      - '#235965'
    searchingActiveBorderColor:
      - '#714A12'
      - bold
    selectedLineBgColor:
      - '#DFDAD9'
    selectedLineFgColor:
      - '#2C283B'
      - bold
    unstagedChangesColor:
      - '#8A344D'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --light
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
