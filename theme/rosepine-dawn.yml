# rosepine-dawn

gui:
  authorColors:
    '*': '#797593'
    guanghechen: '#56949F'
  branchColorPatterns:
    "^(main|master)$": '#907AA9'
    "^(user/[^/]+/)?chore": '#9893A5'
    "^(user/[^/]+/)?feat": '#286983'
    "^(user/[^/]+/)?feature": '#286983'
    "^(user/[^/]+/)?fix": '#B4637A'
    "^(user/[^/]+/)?refactor": '#D7827E'
    "^(user/[^/]+/)?release": '#56949F'
  theme:
    activeBorderColor:
      - '#286983'
      - bold
    cherryPickedCommitBgColor:
      - '#D7827E'
    cherryPickedCommitFgColor:
      - '#FFFAF3'
    defaultFgColor:
      - '#464261'
    inactiveBorderColor:
      - '#9893A5'
    inactiveViewSelectedLineBgColor:
      - '#FFFAF3'
    markedBaseCommitBgColor:
      - '#EA9D34'
    markedBaseCommitFgColor:
      - '#56949F'
    optionsTextColor:
      - '#56949F'
    searchingActiveBorderColor:
      - '#D7827E'
      - bold
    selectedLineBgColor:
      - '#DFDAD9'
      - bold
    unstagedChangesColor:
      - '#B4637A'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
