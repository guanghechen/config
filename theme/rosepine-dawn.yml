# rosepine-dawn

gui:
  authorColors:
    guanghechen: '#286983'
    '*': '#797593'
  branchColorPatterns:
    "^(main|master)$": '#907AA9'
    "^(user/[^/]+/)?fix": '#B4637A'
    "^(user/[^/]+/)?feat": '#6D8F89'
    "^(user/[^/]+/)?feature": '#6D8F89'
    "^(user/[^/]+/)?release": '#286983'
  theme:
    activeBorderColor:
      - '#907AA9'
      - bold
    cherryPickedCommitBgColor:
      - '#56949F'
    cherryPickedCommitFgColor:
      - '#286983'
    defaultFgColor:
      - '#797593'
    inactiveBorderColor:
      - '#9893A5'
    inactiveViewSelectedLineBgColor:
      - '#DFDAD9'
      - bold
    markedBaseCommitBgColor:
      - '#907AA9'
    markedBaseCommitFgColor:
      - '#6D8F89'
    optionsTextColor:
      - '#D7827E'
    searchingActiveBorderColor:
      - '#286983'
    selectedLineBgColor:
      - '#F2E9E1'
    unstagedChangesColor:
      - '#B4637A'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --light

