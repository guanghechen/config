# rosepine-dawn

gui:
  authorColors:
    '*': '#797593'
    guanghechen: '#286983'
  branchColorPatterns:
    "^(main|master)$": '#907AA9'
    "^(user/[^/]+/)?chore": '#9893A5'
    "^(user/[^/]+/)?feat": '#6D8F89'
    "^(user/[^/]+/)?feature": '#6D8F89'
    "^(user/[^/]+/)?fix": '#B4637A'
    "^(user/[^/]+/)?refactor": '#D7827E'
    "^(user/[^/]+/)?release": '#286983'
  theme:
    activeBorderColor:
      - '#907AA9'
      - bold
    cherryPickedCommitBgColor:
      - '#56949F'
    cherryPickedCommitFgColor:
      - '#FAF4ED'
    defaultFgColor:
      - '#797593'
    inactiveBorderColor:
      - '#9893A5'
    inactiveViewSelectedLineBgColor:
      - '#F2E9E1'
    markedBaseCommitBgColor:
      - '#EA9D34'
    markedBaseCommitFgColor:
      - '#FAF4ED'
    optionsTextColor:
      - '#D7827E'
    searchingActiveBorderColor:
      - '#56949F'
      - bold
    selectedLineBgColor:
      - '#DFDAD9'
    unstagedChangesColor:
      - '#B4637A'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --light

