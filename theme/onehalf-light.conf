# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# onehalf-light

[delta]
light                         = true
syntax-theme                  = onehalf-light

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#4078F2"

####################################################################################################

file-style                    = "#696D75" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#5C5F66"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#E45649" normal bold
line-numbers-plus-style       = "#50A14F" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#FBBBBE"
plus-style                    = syntax "#E7EDD9"
minus-non-emph-style          = syntax "#FBBBBE"
plus-non-emph-style           = syntax "#E7EDD9"
minus-emph-style              = syntax "#FBC8C8" bold
plus-emph-style               = syntax "#D4ECCD" bold

plus-empty-line-marker-style  = "#E7EDD9" "#E7EDD9"
minus-empty-line-marker-style = "#FBBBBE" "#FBBBBE"

####################################################################################################

commit-style                  = "#DEA95F" bold
commit-decoration-style       = none

blame-palette                 = "#FAFAFA" "#F0F0F0" "#EAEAEA"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#5C5F66" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

