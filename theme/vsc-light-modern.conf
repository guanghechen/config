# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# vsc-light-modern

[delta]
light                         = true
syntax-theme                  = vsc-light-modern

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#005FB8"

####################################################################################################

file-style                    = "#3B3B3B" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#616161"

line-numbers                  = true
line-numbers-left-style       = "#616161" "#FFFFFF"
line-numbers-right-style      = "#616161" "#FFFFFF"
line-numbers-zero-style       = "#616161" "#FFFFFF"
line-numbers-minus-style      = "#616161" "#FFCCCC" bold
line-numbers-plus-style       = "#616161" "#E9EFDB" bold

zero-style                    = syntax normal
minus-style                   = syntax "#FFCCCC"
plus-style                    = syntax "#E9EFDB"
minus-non-emph-style          = syntax "#FFCCCC"
plus-non-emph-style           = syntax "#E9EFDB"
minus-emph-style              = syntax "#FFA3A3" bold
plus-emph-style               = syntax "#D3E4AE" bold

plus-empty-line-marker-style  = "#E9EFDB" "#E9EFDB"
minus-empty-line-marker-style = "#FFCCCC" "#FFCCCC"

####################################################################################################

commit-style                  = "#795E26" bold
commit-decoration-style       = none

blame-palette                 = "#FFFFFF" "#F2F2F2" "#E8E8E8"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#616161" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

