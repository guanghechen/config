# nord

gui:
  authorColors:
    guanghechen: 'blue'
    '*': '#D8DEE9'
  branchColors:
    main: 'blue'
  theme:
    defaultFgColor:
      - '#D8DEE9'
    activeBorderColor:
      - 'magenta'
      - bold
    inactiveBorderColor:
      - '#B0BEC5'
    optionsTextColor:
      -  '#D08770'
    selectedLineBgColor:
      - '#434C5E'
    cherryPickedCommitFgColor:
      - 'blue'
    cherryPickedCommitBgColor:
      - 'cyan'
    markedBaseCommitFgColor:
      - 'green'
    markedBaseCommitBgColor:
      - 'magenta'
    searchingActiveBorderColor:
      - 'blue'
    unstagedChangesColor:
      - 'red'

git:
  paging:
    colorArg: always
    useConfig: true
    pager: delta --diff-so-fancy --dark

