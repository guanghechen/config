# nord

git:
  autoFetch: false
  commit:
    signOff: false
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  paging:
    # cargo install git-delta
    colorArg: always
    useConfig: false
    pager: delta --paging=never
  parseEmoji: true
  skipHookPrefix: WIP
gui:
  authorColors:
    guanghechen: "blue"
    "*": "#D8DEE9"
  branchColors:
    main: "blue"
  theme:
    defaultFgColor:
      - "#D8DEE9"
    activeBorderColor:
      - "magenta"
      - bold
    inactiveBorderColor:
      - "#B0BEC5"
    optionsTextColor:
      -  "#D08770"
    selectedLineBgColor:
      - "#434C5E"
    cherryPickedCommitFgColor:
      - "blue"
    cherryPickedCommitBgColor:
      - "cyan"
    markedBaseCommitFgColor:
      - "green"
    markedBaseCommitBgColor:
      - "magenta"
    searchingActiveBorderColor:
      - "blue"
    unstagedChangesColor:
      - "red"
  border: "rounded"
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: true
  showCommandLog: true
  showFileTree: true
  showIcons: true
  showRandomTip: true
  splitDiff: auto
  useHunkModeInStagingView: true
notARepository: skip
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
promptToReturnFromSubprocess: true
