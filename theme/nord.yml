# nord

gui:
  authorColors:
    '*': '#D8DEE9'
    guanghechen: '#5E81AC'
  branchColorPatterns:
    "^(main|master)$": '#B48EAD'
    "^(user/[^/]+/)?chore": '#B0BEC5'
    "^(user/[^/]+/)?feat": '#A3BE8C'
    "^(user/[^/]+/)?feature": '#A3BE8C'
    "^(user/[^/]+/)?fix": '#BF616A'
    "^(user/[^/]+/)?refactor": '#D08770'
    "^(user/[^/]+/)?release": '#5E81AC'
  theme:
    activeBorderColor:
      - '#B48EAD'
      - bold
    cherryPickedCommitBgColor:
      - '#88C0D0'
    cherryPickedCommitFgColor:
      - '#2E3440'
    defaultFgColor:
      - '#D8DEE9'
    inactiveBorderColor:
      - '#B0BEC5'
    inactiveViewSelectedLineBgColor:
      - '#434C5E'
    markedBaseCommitBgColor:
      - '#EBCB8B'
    markedBaseCommitFgColor:
      - '#2E3440'
    optionsTextColor:
      - '#D08770'
    searchingActiveBorderColor:
      - '#88C0D0'
      - bold
    selectedLineBgColor:
      - '#4C566A'
    unstagedChangesColor:
      - '#BF616A'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --dark
