# nord

gui:
  authorColors:
    guanghechen: '#5E81AC'
    '*': '#D8DEE9'
  branchColorPatterns:
    "^(main|master)$": '#B48EAD'
    "^(user/[^/]+/)?fix": '#BF616A'
    "^(user/[^/]+/)?feat": '#A3BE8C'
    "^(user/[^/]+/)?feature": '#A3BE8C'
    "^(user/[^/]+/)?release": '#5E81AC'
  theme:
    activeBorderColor:
      - '#B48EAD'
      - bold
    cherryPickedCommitBgColor:
      - '#88C0D0'
    cherryPickedCommitFgColor:
      - '#5E81AC'
    defaultFgColor:
      - '#D8DEE9'
    inactiveBorderColor:
      - '#B0BEC5'
    inactiveViewSelectedLineBgColor:
      - '#4C566A'
      - bold
    markedBaseCommitBgColor:
      - '#B48EAD'
    markedBaseCommitFgColor:
      - '#A3BE8C'
    optionsTextColor:
      - '#D08770'
    searchingActiveBorderColor:
      - '#5E81AC'
    selectedLineBgColor:
      - '#434C5E'
    unstagedChangesColor:
      - '#BF616A'

git:
  paging:
    colorArg: always
    pager: delta --paging=never --diff-so-fancy --dark

