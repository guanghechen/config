# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# tokyonight-moon

[delta]
dark                          = true
syntax-theme                  = tokyonight-moon

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#82aaff"

####################################################################################################

file-style                    = "#c8d3f5" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#aab6df"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#ff8590" normal bold
line-numbers-plus-style       = "#c3e88d" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#432e40"
plus-style                    = syntax "#293b47"
minus-non-emph-style          = syntax "#432e40"
plus-non-emph-style           = syntax "#293b47"
minus-emph-style              = "#c8d3f5" "#653d55" bold
plus-emph-style               = "#c8d3f5" "#365468" bold

plus-empty-line-marker-style  = "#293b47" "#293b47"
minus-empty-line-marker-style = "#432e40" "#432e40"

####################################################################################################

commit-style                  = "#ffc777" bold
commit-decoration-style       = none

blame-palette                 = "#222436" "#1e2030" "#2f334d"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#aab6df" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
