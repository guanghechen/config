# kanagawa-lotus

gui:
  authorColors:
    '*': '#545464'
    guanghechen: '#3E5A87'
  branchColorPatterns:
    "^(main|master)$": '#624C83'
    "^(user/[^/]+/)?chore": '#545464'
    "^(user/[^/]+/)?feat": '#4A6037'
    "^(user/[^/]+/)?feature": '#4A6037'
    "^(user/[^/]+/)?fix": '#A1364B'
    "^(user/[^/]+/)?refactor": '#914600'
    "^(user/[^/]+/)?release": '#3E5A87'
  theme:
    activeBorderColor:
      - '#3E5A87'
      - bold
    cherryPickedCommitBgColor:
      - '#DCD5AC'
    cherryPickedCommitFgColor:
      - '#624C83'
    defaultFgColor:
      - '#38384D'
    inactiveBorderColor:
      - '#ACA99A'
    inactiveViewSelectedLineBgColor:
      - '#E5DDB0'
    markedBaseCommitBgColor:
      - '#D5D6CE'
    markedBaseCommitFgColor:
      - '#38384D'
    optionsTextColor:
      - '#3E5A87'
    searchingActiveBorderColor:
      - '#655A35'
      - bold
    selectedLineBgColor:
      - '#D5D6CE'
      - bold
    unstagedChangesColor:
      - '#A1364B'

git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --light
