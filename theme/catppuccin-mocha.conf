# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-mocha

[delta]
dark                          = true
syntax-theme                  = catppuccin-mocha

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#89B4FA"

####################################################################################################

file-style                    = "#BAC2DE" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#A6ADC8"

line-numbers                  = true
line-numbers-left-style       = "#A6ADC8" "#1E1E2E"
line-numbers-right-style      = "#A6ADC8" "#1E1E2E"
line-numbers-zero-style       = "#A6ADC8" "#1E1E2E"
line-numbers-minus-style      = "#A6ADC8" "#362424" bold
line-numbers-plus-style       = "#A6ADC8" "#293232" bold

zero-style                    = syntax normal
minus-style                   = syntax "#362424"
plus-style                    = syntax "#293232"
minus-non-emph-style          = syntax "#362424"
plus-non-emph-style           = syntax "#293232"
minus-emph-style              = syntax "#833535" bold
plus-emph-style               = syntax "#476E6E" bold

plus-empty-line-marker-style  = "#293232" "#293232"
minus-empty-line-marker-style = "#362424" "#362424"

####################################################################################################

commit-style                  = "#F9E2AF" bold
commit-decoration-style       = none

blame-palette                 = "#1E1E2E" "#11111B" "#313244"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#A6ADC8" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

