# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# catppuccin-mocha

[delta]
dark                          = true
syntax-theme                  = catppuccin-mocha

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#89B4FA"

####################################################################################################

file-style                    = "#CDD6F4" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#BAC2DE"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#F38BA8" normal bold
line-numbers-plus-style       = "#A6E3A1" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#382B3D"
plus-style                    = syntax "#2E363C"
minus-non-emph-style          = syntax "#382B3D"
plus-non-emph-style           = syntax "#2E363C"
minus-emph-style              = "#CDD6F4" "#51384B" bold
plus-emph-style               = "#CDD6F4" "#3F4D4A" bold

plus-empty-line-marker-style  = "#2E363C" "#2E363C"
minus-empty-line-marker-style = "#382B3D" "#382B3D"

####################################################################################################

commit-style                  = "#F9E2AF" bold
commit-decoration-style       = none

blame-palette                 = "#1E1E2E" "#181825" "#313244"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#BAC2DE" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
