# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# rosepine-main

[delta]
dark                          = true
syntax-theme                  = rosepine-main

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#9CCFD8"

####################################################################################################

file-style                    = "#E0DEF4" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#908CAA"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#EB6F92" normal bold
line-numbers-plus-style       = "#31748F" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#43293A"
plus-style                    = syntax "#333C48"
minus-non-emph-style          = syntax "#43293A"
plus-non-emph-style           = syntax "#333C48"
minus-emph-style              = syntax "#6D3A50" bold
plus-emph-style               = syntax "#4D616C" bold

plus-empty-line-marker-style  = "#333C48" "#333C48"
minus-empty-line-marker-style = "#43293A" "#43293A"

####################################################################################################

commit-style                  = "#F6C177" bold
commit-decoration-style       = none

blame-palette                 = "#191724" "#1F1D2E" "#26233A"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#908CAA" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
