# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# rosepine-main

[delta "rosepine-main"]
dark                          = true
syntax-theme                  = rosepine-main

inline-hint-style             = "#9CCFD8"

####################################################################################################

file-style                    = "#E0DEF4" bold

hunk-header-line-number-style = "#908CAA"

line-numbers-minus-style      = "#EB6F92" normal bold
line-numbers-plus-style       = "#6FA3B6" normal bold

minus-style                   = syntax "#35222F"
plus-style                    = syntax "#233039"
minus-non-emph-style          = syntax "#35222F"
plus-non-emph-style           = syntax "#233039"
minus-emph-style              = "#E0DEF4" "#513343" bold
plus-emph-style               = "#E0DEF4" "#354A54" bold

plus-empty-line-marker-style  = "#233039" "#233039"
minus-empty-line-marker-style = "#35222F" "#35222F"

####################################################################################################

commit-style                  = "#F6C177" bold

blame-palette                 = "#191724" "#1F1D2E" "#26233A"
blame-separator-style         = "#908CAA" dim
