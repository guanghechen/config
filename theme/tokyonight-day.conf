# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# tokyonight-day

[delta]
light                         = true
syntax-theme                  = tokyonight-day

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#254e96"

####################################################################################################

file-style                    = "#293552" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#445270"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#a21d49" normal bold
line-numbers-plus-style       = "#3e5d2c" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#e3d4dc"
plus-style                    = syntax "#d1ddd9"
minus-non-emph-style          = syntax "#e3d4dc"
plus-non-emph-style           = syntax "#d1ddd9"
minus-emph-style              = "#293552" "#d5b7c5" bold
plus-emph-style               = "#293552" "#b0c9c4" bold

plus-empty-line-marker-style  = "#d1ddd9" "#d1ddd9"
minus-empty-line-marker-style = "#e3d4dc" "#e3d4dc"

####################################################################################################

commit-style                  = "#6b4d25" bold
commit-decoration-style       = none

blame-palette                 = "#e1e2e7" "#d0d5e3" "#d5d9e4"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#445270" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶
