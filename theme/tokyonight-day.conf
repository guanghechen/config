# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# tokyonight-day

[delta]
hunk-header-style             = raw
hunk-header-decoration-style  = ul
hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}
detect-dark-light             = auto
line-numbers                  = true
navigate                      = true    # use n and N to move between diff sections
paging                        = never
side-by-side                  = true

light                         = true
true-color                    = always
syntax-theme                  = tokyonight-day
plus-emph-style               = syntax "#4197a4" bold
plus-non-emph-style           = syntax "#b7ced5" bold
plus-style                    = syntax "#b7ced5"
minus-emph-style              = syntax "#c47981" bold
minus-non-emph-style          = syntax "#dababe" bold
minus-style                   = syntax "#dababe"
line-numbers-left-style       = "#3760bf"
line-numbers-right-style      = "#3760bf"
line-numbers-zero-style       = "#3760bf"
line-numbers-minus-style      = "#3760bf" "#dababe" bold
line-numbers-plus-style       = "#3760bf" "#b7ced5" bold
whitespace-error-style        = "#3760bf"

