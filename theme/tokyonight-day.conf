# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# tokyonight-day

[delta]
light                         = true
syntax-theme                  = tokyonight-day

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 0
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#2e7de9"

####################################################################################################

file-style                    = "#3054a8" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#294891"

line-numbers                  = true
line-numbers-left-style       = "#294891" "#e1e2e7"
line-numbers-right-style      = "#294891" "#e1e2e7"
line-numbers-zero-style       = "#294891" "#e1e2e7"
line-numbers-minus-style      = "#294891" "#dababe" bold
line-numbers-plus-style       = "#294891" "#b7ced5" bold

zero-style                    = syntax normal
minus-style                   = syntax "#dababe"
plus-style                    = syntax "#b7ced5"
minus-non-emph-style          = syntax "#dababe"
plus-non-emph-style           = syntax "#b7ced5"
minus-emph-style              = syntax "#c47981" bold
plus-emph-style               = syntax "#4197a4" bold

plus-empty-line-marker-style  = "#b7ced5" "#b7ced5"
minus-empty-line-marker-style = "#dababe" "#dababe"

####################################################################################################

commit-style                  = "#8c6c3e" bold
commit-decoration-style       = none

blame-palette                 = "#e1e2e7" "#d0d5e3" "#c4c8da"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#294891" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

