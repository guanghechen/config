# https://github.com/dandavison/delta/blob/main/themes.gitconfig
# nord

[delta]
dark                          = true
syntax-theme                  = nord

side-by-side                  = true
navigate                      = true
paging                        = never
tabs                          = 2
relative-paths                = true
wrap-max-lines                = 2
width                         = -0
line-buffer-size              = 64
line-fill-method              = ansi
max-line-distance             = 0.5
word-diff-regex               = "[a-zA-Z_][a-zA-Z0-9_]*|[0-9]+|."
inline-hint-style             = "#5E81AC"

####################################################################################################

file-style                    = "#E5E9F0" bold
file-decoration-style         = ul

hunk-header-style             = line-number syntax
hunk-header-decoration-style  = ul
hunk-header-line-number-style = "#D8DEE9"

line-numbers                  = true
line-numbers-left-style       = normal normal
line-numbers-right-style      = normal normal
line-numbers-zero-style       = normal normal
line-numbers-minus-style      = "#BF616A" normal bold
line-numbers-plus-style       = "#A3BE8C" normal bold

zero-style                    = syntax normal
minus-style                   = syntax "#582A33"
plus-style                    = syntax "#444F44"
minus-non-emph-style          = syntax "#582A33"
plus-non-emph-style           = syntax "#444F44"
minus-emph-style              = syntax "#773A44" bold
plus-emph-style               = syntax "#505F5D" bold

plus-empty-line-marker-style  = "#444F44" "#444F44"
minus-empty-line-marker-style = "#582A33" "#582A33"

####################################################################################################

commit-style                  = "#EBCB8B" bold
commit-decoration-style       = none

blame-palette                 = "#2E3440" "#3B4252" "#434C5E"
blame-format                  = "{author:<12} {commit:<8} {timestamp:<10}"
blame-code-style              = syntax
blame-separator-style         = "#D8DEE9" dim

hyperlinks                    = true
hyperlinks-file-link-format   = file://{path}:{line}

merge-conflict-begin-symbol   = ⟵
merge-conflict-end-symbol     = ⟶

