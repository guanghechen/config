# gruvbox-light
# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.66.0/schema/config.json

gui:
  colorScheme: light
  theme:
    activeBorderColor:
      - '#8F3F71'
      - bold
    authorColors:
      '*': '#504945'
      guanghechen: '#076678'
    branchColorPatterns:
      "^(main|master)$": '#8F3F71'
      "^(user/[^/]+/)?chore": '#504945'
      "^(user/[^/]+/)?feat": '#79740E'
      "^(user/[^/]+/)?fix": '#9D0006'
      "^(user/[^/]+/)?refactor": '#AF3A03'
      "^(user/[^/]+/)?release": '#076678'
    cherryPickedCommitBgColor:
      - '#D5C4A1'
    cherryPickedCommitFgColor:
      - '#3C3836'
    defaultFgColor:
      - '#504945'
    inactiveBorderColor:
      - '#7C6F64'
    inactiveViewSelectedLineBgColor:
      - '#D5C4A1'
    markedBaseCommitBgColor:
      - '#BDAE93'
    markedBaseCommitFgColor:
      - '#3C3836'
    optionsTextColor:
      - '#AF3A03'
    searchingActiveBorderColor:
      - '#427B58'
      - bold
    selectedLineBgColor:
      - '#BDAE93'
    selectedLineFgColor:
      - '#3C3836'
      - bold
    unstagedChangesColor:
      - '#9D0006'

git:
  diffRenderers:
    - command: >-
        delta --paging=never --light
        --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
