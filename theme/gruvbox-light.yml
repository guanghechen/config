# gruvbox-light

gui:
  authorColors:
    '*': '#504945'
    guanghechen: '#458588'
  branchColorPatterns:
    "^(main|master)$": '#B16286'
    "^(user/[^/]+/)?chore": '#7C6F64'
    "^(user/[^/]+/)?feat": '#98971A'
    "^(user/[^/]+/)?feature": '#98971A'
    "^(user/[^/]+/)?fix": '#CC241D'
    "^(user/[^/]+/)?refactor": '#D65D0E'
    "^(user/[^/]+/)?release": '#458588'
  theme:
    activeBorderColor:
      - '#B16286'
      - bold
    cherryPickedCommitBgColor:
      - '#689D6A'
    cherryPickedCommitFgColor:
      - '#F2E5BC'
    defaultFgColor:
      - '#504945'
    inactiveBorderColor:
      - '#7C6F64'
    inactiveViewSelectedLineBgColor:
      - '#D5C4A1'
    markedBaseCommitBgColor:
      - '#D79921'
    markedBaseCommitFgColor:
      - '#F2E5BC'
    optionsTextColor:
      - '#D65D0E'
    searchingActiveBorderColor:
      - '#689D6A'
      - bold
    selectedLineBgColor:
      - '#BDAE93'
    unstagedChangesColor:
      - '#CC241D'

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --light

