# Starship - Fish
# [I] user@host ~/path ( main|+1•?) 12:34:56 (conda)
#   $

format = """$character$os$username${custom.separator}$hostname$directory$git_branch${custom.git_dirty_sep}$git_status${custom.git_clean}${custom.git_suffix} $time$conda
  [\\$](white) """

[character]
format = "$symbol "
success_symbol = "[\\[I\\]](bold green)"
error_symbol = "[\\[I\\]](bold red)"
vimcmd_symbol = "[\\[N\\]](bold cyan)"
vimcmd_replace_one_symbol = "[\\[R\\]](bold purple)"
vimcmd_replace_symbol = "[\\[R\\]](bold purple)"
vimcmd_visual_symbol = "[\\[V\\]](bold yellow)"

[os]
format = "[$symbol]($style) "
style = "cyan"
disabled = false

[os.symbols]
Macos = ""
NixOS = ""
Windows = ""
Linux = ""
Ubuntu = ""
Unknown = ""

[username]
format = "[$user]($style)"
style_user = "bold bright-purple"
style_root = "bold bright-red"
show_always = true

[custom.separator]
command = "if [ $(id -u) -eq 0 ]; then echo '#'; else echo '@'; fi"
format = "[$output](white)"
when = true
shell = ["sh"]

[hostname]
format = "[$hostname]($style) "
style = "bold bright-cyan"
ssh_only = false
detect_env_vars = []

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold bright-blue"
read_only = " 󰌾"
read_only_style = "bright-red"
truncation_length = 5
truncate_to_repo = false

[git_branch]
format = " [\\(](white)[$branch]($style)"
style = "bold bright-purple"
symbol = ""

[git_status]
format = '$ahead_behind$staged$modified$untracked$conflicted$renamed$deleted$stashed'
staged = "[+${count}](bright-blue)"
modified = "[󰧞${count}](yellow)"
untracked = "[?${count}](bright-black)"
stashed = "[⚑${count}](cyan)"
conflicted = "[=${count}](red)"
ahead = "[⇡${count}](green)"
behind = "[⇣${count}](red)"
diverged = "[⇡${ahead_count}](green)[⇣${behind_count}](red)"
renamed = "[➜${count}](blue)"
deleted = "[✘${count}](red)"

[custom.git_dirty_sep]
command = "true"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git status --porcelain -b | { IFS= read -r first || exit 1; case "$first" in *ahead*|*behind*|*diverged*) exit 0;; esac; IFS= read -r _ && exit 0; exit 1; }'
format = "[|](white)"
shell = ["sh"]

[custom.git_clean]
command = "true"
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"'
format = "[|](white)[](bright-green)"
shell = ["sh"]

[custom.git_suffix]
command = "true"
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[\\)](white)"
shell = ["sh"]

[time]
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"
disabled = false

[conda]
format = " [\\($environment\\)]($style)"
style = "green"
symbol = ""
ignore_base = true
