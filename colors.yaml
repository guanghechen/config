## Aesthetic color scheme using basic 16 colors
## Designed for both dark and light terminal themes

user: cyan
group: cyan
permission:
  read: green
  write: yellow
  exec: red
  exec-sticky: magenta
  no-access: dark_grey
  octal: dark_grey
  acl: cyan
  context: blue
attributes:
  archive: yellow
  read: cyan
  hidden: dark_grey
  system: dark_grey
date:
  hour-old: dark_grey
  day-old: dark_grey
  older: dark_grey
size:
  none: dark_grey
  small: dark_grey
  medium: dark_grey
  large: dark_grey
inode:
  valid: cyan
  invalid: dark_grey
links:
  valid: magenta
  invalid: red
tree-edge: dark_grey
git-status:
  default: dark_grey
  unmodified: dark_grey
  ignored: dark_grey
  new-in-index: green
  new-in-workdir: green
  typechange: yellow
  deleted: red
  renamed: cyan
  modified: yellow
  conflicted: magenta
