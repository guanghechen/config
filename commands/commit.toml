description = "Create a git commit with optional file paths, scope restrictions, or message hints"

prompt = """
Create a git commit based on current changes. See `~/.gemini/agents/git-committer.md` for the full commit workflow spec.

## Arguments (Optional)

```text
{{args}}
```

**If arguments are provided**, use them as context:

- **Commit scope**: File paths, glob patterns (e.g., `src/*.ts`), or descriptive filters (e.g., "only auth changes")
- **Message hints**: Additional context for generating the commit message

**If no arguments are provided**, commit all staged/unstaged changes.

## Current Git Status

```
!{git status}
```

## Current Changes

```diff
!{git diff}
```

## Recent Commit History

```
!{git log --oneline -10}
```
"""
