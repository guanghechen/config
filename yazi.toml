# Starship - Yazi
# user@host ~/path ( main|+1•?) 12:34:56

format = "$username$custom$hostname$directory$git_branch$git_status $time"

[username]
format = "[$user]($style)"
style_user = "bold bright-purple"
style_root = "bold bright-red"
show_always = true

[custom.separator]
command = "if [ $(id -u) -eq 0 ]; then echo '#'; else echo '@'; fi"
format = "[$output](white)"
when = true
shell = ["sh"]

[hostname]
format = "[$hostname]($style) "
style = "bold bright-cyan"
ssh_only = false
detect_env_vars = []

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold bright-blue"
read_only = " 󰌾"
read_only_style = "bright-red"
truncation_length = 5
truncate_to_repo = false

[git_branch]
format = " [\\(](white)[$branch]($style)"
style = "bold bright-purple"
symbol = ""

[git_status]
format = '[|](white)$ahead_behind$staged$modified$untracked$conflicted$renamed$deleted$stashed$up_to_date[\)](white)'
staged = "[+${count}](bright-blue)"
modified = "[•${count}](yellow)"
untracked = "[?${count}](bright-black)"
stashed = "[⚑${count}](cyan)"
conflicted = "[=${count}](red)"
ahead = "[↑${count}](green)"
behind = "[↓${count}](red)"
diverged = "[↕↑${ahead_count}↓${behind_count}](red)"
renamed = "[»${count}](blue)"
deleted = "[✗${count}](red)"
up_to_date = "[](bright-green)"

[time]
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"
disabled = false
