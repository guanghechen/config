[input]
cursor_blink = true
origin = "top-center"

[manager]
image_quality = 90
linemode = "permissions"
ratio = [1, 4, 3]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true
sort_reverse = false
sort_sensitive = true
sort_translit = true
tab_size = 2
title_format = ""
wrap = false

[open]
prepend_rules = [
  { name = "*.json", use = [ "edit" ] },
  { name = "*.html", use = [ "edit" ] },
]
append_rules = [
  { name = "*", use = [ "edit" ]},
]

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
  { run = "nvim %*",   block = true, for = "windows" },
]
play = [
  { run = 'mpv "$@"', orphan = true, for = "unix" },
  { run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open" },
]

[plugin]
prepend_fetchers = [
  { id = "git", name = "*", run = "git" },
  { id = "git", name = "*/", run = "git" },
]


[preview]
tab_size = 2
wrap = "no"
