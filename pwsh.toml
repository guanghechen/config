# Starship - PowerShell
# user@host ~/path ( main|+1•?) 12:34:56 (conda)
#   $

"$schema" = "https://starship.rs/config-schema.json"

format = """$character$os$username[@](white)$hostname$directory$git_branch$git_status $time$conda
PS> """

[username]
format = "[$user]($style)"
style_user = "bold bright-purple"
style_root = "bold bright-red"
show_always = true

[hostname]
format = "[$hostname]($style) "
style = "bold bright-cyan"
ssh_only = false
detect_env_vars = []

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold bright-blue"
read_only = " 󰌾"
read_only_style = "bright-red"
truncation_length = 5
truncate_to_repo = false

[git_branch]
format = " [$branch]($style)"
style = "bold bright-purple"
symbol = ""

[git_status]
format = "( $ahead_behind$staged$modified$typechanged$untracked$conflicted$renamed$deleted$stashed)"
staged = "[+${count}](bright-blue)"
modified = "[󰧞${count}](yellow)"
typechanged = "[T${count}](yellow)"
untracked = "[?${count}](white)"
stashed = "[⚑${count}](cyan)"
conflicted = "[=${count}](red)"
ahead = "[⇡${count}](green)"
behind = "[⇣${count}](red)"
diverged = "[⇡${ahead_count}](green)[⇣${behind_count}](red)"
renamed = "[➜${count}](blue)"
deleted = "[✘${count}](red)"

[time]
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"
disabled = false

[conda]
format = " [\\($environment\\)]($style)"
style = "green"
symbol = ""
ignore_base = true
[character]
format = "$symbol "
success_symbol = "[\\[I\\]](bold green)"
error_symbol = "[\\[I\\]](bold red)"
vimcmd_symbol = "[\\[N\\]](bold cyan)"

[os]
format = "[$symbol]($style) "
style = "cyan"
disabled = false

[os.symbols]
Macos = ""
NixOS = ""
Windows = ""
Linux = ""
Ubuntu = ""
Unknown = ""
