_tmux_is_os_linux="uname -s | grep -iqE '^Linux$'"
_tmux_is_os_macos="uname -s | grep -iqE '^Darwin$'"
_tmux_is_os_windows="uname -s | grep -iqE '^Windows_NT$'"

# decide whether we're in a Vim process
# See: https://github.com/christoomey/vim-tmux-navigator/blob/a26954a585b02a2ac02f87145e204f8798a7cbc2/vim-tmux-navigator.tmux#L1
_tmux_is_zen_mode="(tmux display-message -p '#{window_panes}' | grep -iqE 1) || (tmux display-message -p '#{window_zoomed_flag}' | grep -iqE 1)"
_tmux_is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?(\\.exe)?$'"
_tmux_is_tui_pane="#{||:#{==:#{@GHC_TUI_APP},tui-demo},#{m/r:^(g?(view|n?vim?x?)(diff)?(\\.exe)?|yui-tui)$,#{pane_current_command}}}"

# Define custom_os_icon based on the OS
set -g @GHC_SYM_OS ""
if-shell "$_tmux_is_os_macos"           'set -g @GHC_SYM_OS ""'
if-shell "$_tmux_is_os_linux"           'set -g @GHC_SYM_OS ""'
if-shell "$_tmux_is_os_windows"         'set -g @GHC_SYM_OS ""'

# Symbols
set -g @GHC_SEP_LEFT                    ''
set -g @GHC_SEP_RIGHT                   ''
set -g @GHC_SYM_SESSION                 ''
set -g @GHC_SYM_APP                     ''
set -g @GHC_SYM_CPU                     ''
set -g @GHC_SYM_DATE                    ''
set -g @GHC_SEP_ROUND_LEFT              ''
set -g @GHC_SEP_ROUND_RIGHT             ''
set -g @GHC_SYM_NET                     '󰛳'
set -g @GHC_SYM_PID                     ''
set -g @GHC_SYM_TIME                    ''
set -g @GHC_SYM_USER                    ""
set -g @GHC_SYM_WIN                     ''
set -g @GHC_SYM_WIN_BELL                '󰂚'
set -g @GHC_SYM_WIN_LAST                ''
set -g @GHC_SYM_WIN_MARKED              '󰃀'
set -g @GHC_SYM_WIN_SILENCE             '󰂛'
set -g @GHC_SYM_WIN_ZOOM                '󰊓'
set -g @GHC_SYM_ALERT                   '󰂚'
set -g @GHC_SYM_ACTIVITY                ''
set -g @GHC_SYM_MARKER                  '󰓹'
set -g @GHC_SYM_PREFIX                  '󰌌'
set -g @GHC_SYM_COPY_MODE               '󰆏'
set -g @GHC_SYM_COPY_MODE_SEARCH        '󰍉'
set -g @GHC_SYM_COPY_MODE_SELECT        '󰒅'
set -g @GHC_SYM_DURATION                '󱦟'
set -g @GHC_SYM_INDEX                   '#'
set -g @GHC_SYM_TREE_SESSION            ''
set -g @GHC_SYM_TREE_WINDOW             '󰕰'
set -g @GHC_SYM_TREE_ATTACHED           '󰌘'
set -g @GHC_SYM_TREE_SEPARATOR          ''

# Choose-tree format
set -g @GHC_TREE_SESSION_LABEL_FMT "\
#{?session_attached,\
#[fg=cyan#,bold]#{@GHC_SYM_TREE_ATTACHED} \
#[fg=cyan#,bold]#S\
#[default]\
,\
#[fg=grey]#{@GHC_SYM_TREE_SESSION} \
#[fg=white#,bold]#S\
#[default]\
}"

set -g @GHC_TREE_SESSION_ALERT_FMT "\
#{?session_bell_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_BELL}#,bold]#{@GHC_SYM_WIN_BELL},}\
#{?session_activity_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_ACTIVITY}#,bold]#{@GHC_SYM_ACTIVITY},}\
#{?session_silence_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_SILENCE}#,bold]#{@GHC_SYM_WIN_SILENCE},}\
#[default]"

set -g @GHC_TREE_WINDOW_LABEL_FMT "\
#{?window_active,\
#[fg=cyan#,bold]#{@GHC_SYM_TREE_WINDOW} \
#[fg=cyan#,bold]#I:#W\
#[default]\
,\
#[fg=grey]#{@GHC_SYM_TREE_WINDOW} \
#[fg=white#,bold]#I:#W\
#[default]\
}"

set -g @GHC_TREE_WINDOW_ALERT_FMT "\
#{?window_bell_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_BELL}#,bold]#{@GHC_SYM_WIN_BELL},}\
#{?window_activity_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_ACTIVITY}#,bold]#{@GHC_SYM_ACTIVITY},}\
#{?window_last_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_LAST}#,bold]#{@GHC_SYM_WIN_LAST},}\
#{?window_zoomed_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_ZOOM}#,bold]#{@GHC_SYM_WIN_ZOOM},}\
#{?window_marked_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_MARKED}#,bold]#{@GHC_SYM_WIN_MARKED},}\
#{?window_silence_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_SILENCE}#,bold]#{@GHC_SYM_WIN_SILENCE},}\
#[default]"

set -g @GHC_TREE_PANE_ACTIVE_FMT "\
#[fg=cyan]#{@GHC_SYM_OS} \
#[fg=cyan]#{user} \
#[fg=cyan]#{@GHC_SYM_APP} \
#[fg=cyan]#{pane_current_command} \
#[fg=cyan]#{@GHC_SYM_PID}#{pane_pid} \
#[fg=#{@GHC_SL_FG_TREE_PANE_ID}#,bold]#{pane_id} \
#[fg=cyan]#{=/36/...:pane_title}\
#[default]"

set -g @GHC_TREE_PANE_INACTIVE_FMT "\
#[fg=grey]#{@GHC_SYM_OS} \
#[fg=grey]#{user} \
#[fg=grey]#{@GHC_SYM_APP} \
#[fg=grey]#{pane_current_command} \
#[fg=grey]#{@GHC_SYM_PID}#{pane_pid} \
#[fg=#{@GHC_SL_FG_TREE_PANE_ID}]#{pane_id} \
#[fg=grey]#{=/36/...:pane_title}\
#[default]"

set -g @GHC_TREE_PANE_FMT "#{?pane_active,#{E:@GHC_TREE_PANE_ACTIVE_FMT},#{E:@GHC_TREE_PANE_INACTIVE_FMT}}"

set -g @GHC_TREE_FORMAT "#{?session_format,#{E:@GHC_TREE_SESSION_LABEL_FMT}#{E:@GHC_TREE_SESSION_ALERT_FMT},#{?window_format,#{E:@GHC_TREE_WINDOW_LABEL_FMT}#{E:@GHC_TREE_WINDOW_ALERT_FMT},#{E:@GHC_TREE_PANE_FMT}}}"

# Plugin options
set -g  @resurrect-save                 'F8'              # Save the sessions
set -g  @resurrect-restore              'S-F8'            # Restore the sessions
