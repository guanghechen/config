_tmux_is_os_linux="uname -s | grep -iqE '^Linux$'"
_tmux_is_os_macos="uname -s | grep -iqE '^Darwin$'"
_tmux_is_os_windows="uname -s | grep -iqE '^Windows_NT$'"

# zen mode = single or zoomed pane: forward arrow keys to the app instead of resizing the tmux pane.
# grep -qxF matches the whole line exactly, so window_panes of 10/11/21... no longer false-match "1".
_tmux_is_zen_mode="(tmux display-message -p '#{window_panes}' | grep -qxF 1) || (tmux display-message -p '#{window_zoomed_flag}' | grep -qxF 1)"
_tmux_is_tui_pane="#{||:#{==:#{@GHC_TUI_APP},tui-demo},#{m/r:^(g?(view|n?vim?x?)(diff)?(\\.exe)?|yui-tui)$,#{pane_current_command}}}"

# Define custom_os_icon based on the OS
set -g @GHC_SYM_OS ""
if-shell "$_tmux_is_os_macos"           'set -g @GHC_SYM_OS ""'
if-shell "$_tmux_is_os_linux"           'set -g @GHC_SYM_OS ""'
if-shell "$_tmux_is_os_windows"         'set -g @GHC_SYM_OS ""'

# Symbols
set -g @GHC_SEP_LEFT                    ''
set -g @GHC_SEP_RIGHT                   ''
set -g @GHC_SYM_SESSION                 ''
set -g @GHC_SYM_APP                     ''
set -g @GHC_SYM_CPU                     '󰻠'
set -g @GHC_SYM_MEMORY                  '󰍛'
set -g @GHC_SYM_DATE                    ''
set -g @GHC_SEP_ROUND_LEFT              ''
set -g @GHC_SEP_ROUND_RIGHT             ''
set -g @GHC_SEP_SLANT_LEFT              ''
set -g @GHC_SEP_SLANT_RIGHT             ''
set -g @GHC_SEP_ARROW_RIGHT             ''
set -g @GHC_SYM_NET                     '󰀂'
set -g @GHC_SYM_PID                     ''
set -g @GHC_SYM_TIME                    ''
set -g @GHC_SYM_USER                    ""
set -g @GHC_SYM_WIN                     ''
set -g @GHC_SYM_WIN_BELL                '󰂚'
set -g @GHC_SYM_WIN_LAST                ''
set -g @GHC_SYM_WIN_MARKED              '󰃀'
set -g @GHC_SYM_WIN_SILENCE             '󰂛'
set -g @GHC_SYM_WIN_ZOOM                '󰊓'
set -g @GHC_SYM_ALERT                   '󰂚'
set -g @GHC_SYM_ACTIVITY                ''
set -g @GHC_SYM_MARKER                  '󰓹'
set -g @GHC_SYM_PREFIX                  '󰌌'
set -g @GHC_SYM_COPY_MODE               '󰆏'
set -g @GHC_SYM_COPY_MODE_SEARCH        '󰍉'
set -g @GHC_SYM_COPY_MODE_SELECT        '󰒅'
set -g @GHC_SYM_DURATION                '󱦟'
set -g @GHC_SYM_INDEX                   '#'
set -g @GHC_SYM_STATUS_CURRENT          ""
set -g @GHC_SYM_TREE_SESSION            ''
set -g @GHC_SYM_TREE_WINDOW             '󰕰'
set -g @GHC_SYM_TREE_ATTACHED           '󰌘'
set -g @GHC_SYM_TREE_SEPARATOR          ''

# Applications such as Codex expose active work by prefixing pane_title with a
# Braille spinner. Keep its live frame in tmux formats: title changes then
# degrade to an absent marker without snapshot/commit churn.
set -g @GHC_PANE_RUNNING_FMT "#{?#{&&:#{!:#{pane_dead}},#{m/r:^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏],#{pane_title}}},#{=1:pane_title} ,}"
set -g @GHC_WINDOW_RUNNING_FRAME_FMT "#{=2:#{P:#{E:@GHC_PANE_RUNNING_FMT}}}"
# Complete live window prefix in display order (spinner, bell, zoom). The caller
# reapplies its title style afterwards.
set -g @GHC_WINDOW_PREFIX_FMT "\
#{E:@GHC_WINDOW_RUNNING_FRAME_FMT}\
#{?window_bell_flag,\
#[fg=#{?window_active,#{@GHC_SL_FG_WIN_ACTIVE_ICON_BELL},#{?window_last_flag,#{@GHC_SL_FG_WIN_LAST_ICON_BELL},#{@GHC_SL_FG_WIN_ICON_BELL}}}#,bg=#{?window_active,#{@GHC_SL_BG_WIN_ACTIVE_ICON_BELL},#{?window_last_flag,#{@GHC_SL_BG_WIN_LAST_ICON_BELL},#{@GHC_SL_BG_WIN_ICON_BELL}}}#,bold]#{@GHC_SYM_WIN_BELL} \
,}\
#{?window_zoomed_flag,\
#[fg=#{?window_active,#{@GHC_SL_FG_WIN_ACTIVE_ICON_ZOOM},#{?window_last_flag,#{@GHC_SL_FG_WIN_LAST_ICON_ZOOM},#{@GHC_SL_FG_WIN_ICON_ZOOM}}}#,bg=#{?window_active,#{@GHC_SL_BG_WIN_ACTIVE_ICON_ZOOM},#{?window_last_flag,#{@GHC_SL_BG_WIN_LAST_ICON_ZOOM},#{@GHC_SL_BG_WIN_ICON_ZOOM}}}#,bold]#{@GHC_SYM_WIN_ZOOM} \
,}"
set -g @GHC_RUNNING_SESSIONS_FMT "#{S:#{?#{=1:#{W:#{E:@GHC_WINDOW_RUNNING_FRAME_FMT}}},|#{session_id}|,}}"
# status02 already redraws every second. Derive animation phase from that clock
# instead of publishing frame state or traversing panes from every session item.
set -g @GHC_SESSION_RUNNING_PREFIX_FMT "#{?#{==:#{e|%:%S,4},0}, ⠋,#{?#{==:#{e|%:%S,4},1}, ⠹,#{?#{==:#{e|%:%S,4},2}, ⠴, ⠧}}}"

# Choose-tree format
set -g @GHC_TREE_SESSION_LABEL_FMT "\
#{?session_attached,\
#[fg=cyan#,bold]#{@GHC_SYM_TREE_ATTACHED} \
#[fg=cyan#,bold]#S\
#[default]\
,\
#[fg=grey]#{@GHC_SYM_TREE_SESSION} \
#[fg=white#,bold]#S\
#[default]\
}"

# session_{bell,activity,silence}_flag are buggy in tmux: each only inspects the
# session's FIRST window (the format callback returns on the first RB-tree winlink),
# so an alert in any later window is missed. Derive each from session_alerts, which
# lists every alerted window: '!' = bell, '#' = activity, '~' = silence. Mirrors the
# renderer fix in rust/ghc-tmux-status/src/tmux.rs.
set -g @GHC_TREE_SESSION_ALERT_FMT "\
#{?#{m:*!*,#{session_alerts}}, #[fg=#{@GHC_SL_FG_WIN_ICON_BELL}#,bold]#{@GHC_SYM_WIN_BELL},}\
#{?#{m:*#*,#{session_alerts}}, #[fg=#{@GHC_SL_FG_WIN_ICON_ACTIVITY}#,bold]#{@GHC_SYM_ACTIVITY},}\
#{?#{m:*~*,#{session_alerts}}, #[fg=#{@GHC_SL_FG_WIN_ICON_SILENCE}#,bold]#{@GHC_SYM_WIN_SILENCE},}\
#[default]"

set -g @GHC_TREE_WINDOW_LABEL_FMT "\
#{?window_active,\
#[fg=cyan#,bold]#{@GHC_SYM_TREE_WINDOW} \
#[fg=cyan#,bold]#I:#W\
#[default]\
,\
#[fg=grey]#{@GHC_SYM_TREE_WINDOW} \
#[fg=white#,bold]#I:#W\
#[default]\
}"

set -g @GHC_TREE_WINDOW_ALERT_FMT "\
#{?window_bell_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_BELL}#,bold]#{@GHC_SYM_WIN_BELL},}\
#{?window_activity_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_ACTIVITY}#,bold]#{@GHC_SYM_ACTIVITY},}\
#{?window_last_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_LAST}#,bold]#{@GHC_SYM_WIN_LAST},}\
#{?window_zoomed_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_ZOOM}#,bold]#{@GHC_SYM_WIN_ZOOM},}\
#{?window_marked_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_MARKED}#,bold]#{@GHC_SYM_WIN_MARKED},}\
#{?window_silence_flag, #[fg=#{@GHC_SL_FG_WIN_ICON_SILENCE}#,bold]#{@GHC_SYM_WIN_SILENCE},}\
#[default]"

set -g @GHC_TREE_PANE_ACTIVE_FMT "\
#[fg=cyan]#{@GHC_SYM_OS} \
#[fg=cyan]#{user} \
#[fg=cyan]#{@GHC_SYM_APP} \
#[fg=cyan]#{pane_current_command} \
#[fg=cyan]#{@GHC_SYM_PID}#{pane_pid} \
#[fg=#{@GHC_SL_FG_TREE_PANE_ID}#,bold]#{pane_id} \
#[fg=cyan]#{=/36/...:pane_title}\
#[default]"

set -g @GHC_TREE_PANE_INACTIVE_FMT "\
#[fg=grey]#{@GHC_SYM_OS} \
#[fg=grey]#{user} \
#[fg=grey]#{@GHC_SYM_APP} \
#[fg=grey]#{pane_current_command} \
#[fg=grey]#{@GHC_SYM_PID}#{pane_pid} \
#[fg=#{@GHC_SL_FG_TREE_PANE_ID}]#{pane_id} \
#[fg=grey]#{=/36/...:pane_title}\
#[default]"

set -g @GHC_TREE_PANE_FMT "#{?pane_active,#{E:@GHC_TREE_PANE_ACTIVE_FMT},#{E:@GHC_TREE_PANE_INACTIVE_FMT}}"

set -g @GHC_TREE_FORMAT "#{?session_format,#{E:@GHC_TREE_SESSION_LABEL_FMT}#{E:@GHC_TREE_SESSION_ALERT_FMT},#{?window_format,#{E:@GHC_TREE_WINDOW_LABEL_FMT}#{E:@GHC_TREE_WINDOW_ALERT_FMT},#{E:@GHC_TREE_PANE_FMT}}}"

# Choose-tree preview label (tmux 3.7+ tree-mode-preview-format): the small tag
# drawn over each preview thumbnail. Pane previews show app-icon + command + id;
# window previews show the window icon + index:name. Colour is set separately by
# tree-mode-preview-style in conf/theme.tmux.conf (kept out of the format so no
# inline #[fg=] is relied on inside the preview label).
set -g @GHC_TREE_PREVIEW_FORMAT "\
#{?pane_format,\
#{@GHC_SYM_APP} #{pane_current_command} #{pane_id},\
#{@GHC_SYM_TREE_WINDOW} #{window_index}:#{window_name}}"

# Plugin options
set -g  @resurrect-save                 'F8'              # Save the sessions
set -g  @resurrect-restore              'S-F8'            # Restore the sessions
