#_tmux_widget_app_name="ps -o comm= -t '#{pane_tty}' | rg -o '[\\w-]+' | tail -1"
_tmux_widget_app_name="bash $HOME/.config/tmux/script/app_name.sh #{pane_tty}"
_tmux_widget_app_pid="ps -o pid= -t '#{pane_tty}' | rg -o '\\d+' | tail -1"

# Popup
set -g @popup-bg                        "colour0"
set -g @popup-fg                        "colour255"
set -g popup-border-style               "fg=#{@GHC_SL_COLOR_BORDER_CUR},bg=default"
set -g popup-border-lines               "single"

# Basic
setw  -g window-status-activity-style   "none"
setw  -g window-status-separator        " "
set   -g message-style                  "fg=#{@GHC_SL_COLOR_FG_MESSAGE},bg=#{@GHC_SL_COLOR_BG_MESSAGE}"
set   -g pane-border-style              "fg=#{@GHC_SL_COLOR_BORDER}"
set   -g pane-active-border-style       "fg=#{@GHC_SL_COLOR_BORDER_CUR}"
set   -g status-justify                 "centre"
set   -g status-style                   "none,bg=#{@GHC_SL_COLOR_BG}"
set   -g status-left-style              "bold"
set   -g status-right-style             "none"
set   -g status-left-length             32
set   -g status-right-length            64

set -g status-left "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}]\
#[fg=#{@GHC_SL_COLOR_FG_USER_TEXT},     bg=#{@GHC_SL_COLOR_BG_USER_TEXT}, bold] #{USER} \
#[fg=#{@GHC_SL_COLOR_FG_USER_SYM},      bg=#{@GHC_SL_COLOR_BG_USER_SYM}, bold] #{@GHC_SL_SYM_OS}\
#[fg=#{@GHC_SL_COLOR_BG_USER_SYM},      bg=#{@GHC_SL_COLOR_BG_SESSION_TEXT}]#{@GHC_SL_SEP_RIGHT}\
#[fg=#{@GHC_SL_COLOR_FG_SESSION_TEXT},  bg=#{@GHC_SL_COLOR_BG_SESSION_TEXT}, bold] #S \
#[fg=#{@GHC_SL_COLOR_FG_SESSION_SYM},   bg=#{@GHC_SL_COLOR_BG_SESSION_SYM}, bold] #{@GHC_SL_SYM_SESSION} \
#[fg=#{@GHC_SL_COLOR_BG_SESSION_SYM},   bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_RIGHT}\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}] \
"

set -g status-right "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}] \
#[fg=#{@GHC_SL_COLOR_BG_APP_SYM},       bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_APP_SYM},       bg=#{@GHC_SL_COLOR_BG_APP_SYM}]#{@GHC_SL_SYM_APP} \
#[fg=#{@GHC_SL_COLOR_FG_APP_TEXT},      bg=#{@GHC_SL_COLOR_BG_APP_TEXT}, bold] #($_tmux_widget_app_name) \
\
#[fg=#{@GHC_SL_COLOR_BG_PID_SYM},       bg=#{@GHC_SL_COLOR_BG_APP_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_PID_SYM},       bg=#{@GHC_SL_COLOR_BG_PID_SYM}]#{@GHC_SL_SYM_PID} \
#[fg=#{@GHC_SL_COLOR_FG_PID_TEXT},      bg=#{@GHC_SL_COLOR_BG_PID_TEXT}, bold] #($_tmux_widget_app_pid) \
\
#[fg=#{@GHC_SL_COLOR_BG_TIME_SYM},      bg=#{@GHC_SL_COLOR_BG_PID_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_TIME_SYM},      bg=#{@GHC_SL_COLOR_BG_TIME_SYM}]#{@GHC_SL_SYM_TIME} \
#[fg=#{@GHC_SL_COLOR_FG_TIME_TEXT},     bg=#{@GHC_SL_COLOR_BG_TIME_TEXT}, bold] %H:%M:%S \
\
#[fg=#{@GHC_SL_COLOR_BG_DATE_SYM},      bg=#{@GHC_SL_COLOR_BG_TIME_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_DATE_SYM},      bg=#{@GHC_SL_COLOR_BG_DATE_SYM}]#{@GHC_SL_SYM_DATE} \
#[fg=#{@GHC_SL_COLOR_FG_DATE_TEXT},     bg=#{@GHC_SL_COLOR_BG_DATE_TEXT}, bold] %a %b %d, %Y \
"

# window
setw -g window-status-format "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}]\
#[fg=#{@GHC_SL_COLOR_BG_WIN_NAME},      bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_WIN_NAME},      bg=#{@GHC_SL_COLOR_BG_WIN_NAME}]#W \
#[fg=#{@GHC_SL_COLOR_FG_WIN_NUM},       bg=#{@GHC_SL_COLOR_BG_WIN_NUM}, bold] #I\
#[fg=#{@GHC_SL_COLOR_BG_WIN_NUM},       bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_RIGHT}\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}]\
"

# active window
setw -g window-status-current-format "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}]\
#[fg=#{@GHC_SL_COLOR_BG_WIN_CUR_NAME},  bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_WIN_CUR_NAME},  bg=#{@GHC_SL_COLOR_BG_WIN_CUR_NAME}, bold]#{@GHC_SL_SYM_WIN} #W\
#[fg=#{@GHC_SL_COLOR_BG_WIN_CUR_NAME},  bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_RIGHT}\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}]\
"
