## Server
bind-key -n M-F1              run-shell "bash $HOME/.config/tmux/script/popup.sh"
bind-key -n M-F2              command-prompt -p "Set window name:"  -I "#{window_name}"    "rename-window '%%'"      # Rename window
bind-key -n M-F5              run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf; tmux display-message "Config reloaded.."'
bind-key -n M-F6              run-shell "fish -c 'ghc-ghostty-shader --silent'"
bind-key -n M-F10             set status
bind-key -n M-F11             run-shell "bash $HOME/.config/tmux/script/toggle-status.sh forward"
bind-key -n M-F12             run-shell "bash $HOME/.config/tmux/script/toggle-pane-status.sh forward"
bind-key -n M-S-F2            command-prompt -p "Set session name:" -I "#{session_name}"   "rename-session '%%'"     # Rename session
bind-key -n M-S-F6            run-shell "fish -c 'ghc-ghostty-shader --silent --prev'"
bind-key -n M-S-F10           set pane-border-status
bind-key -n M-S-F11           run-shell "bash $HOME/.config/tmux/script/toggle-status.sh backward"
bind-key -n M-S-F12           run-shell "bash $HOME/.config/tmux/script/toggle-pane-status.sh backward"

bind-key -n M-R               run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf; tmux display-message "Config reloaded.."'

### Create / Move
bind-key -n M-M               command-prompt -p "Move window to session:" -I "#{session_name}" 'run-shell "bash $HOME/.config/tmux/script/move-window.sh '%%'"'
bind-key -n M-N               command-prompt -p "New session name:"       -I "#{session_name}-2" "new-session -s '%%'"

### Focus
bind-key -n M-D               detach-client
bind-key -n M-S               choose-tree -w -K "" -F "#{E:@GHC_TREE_FORMAT}"
bind-key -n M-','             run-shell "bash $HOME/.config/tmux/script/focus-session.sh prev"
bind-key -n M-'.'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh next"
bind-key -n M-'"'             switch-client -l
bind-key -n M-'!'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 1"
bind-key -n M-'@'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 2"
bind-key -n M-'#'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 3"
bind-key -n M-'$'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 4"
bind-key -n M-'%'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 5"
bind-key -n M-'^'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 6"
bind-key -n M-'&'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 7"
bind-key -n M-'*'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 8"
bind-key -n M-'('             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 9"
bind-key -n M-')'             run-shell "bash $HOME/.config/tmux/script/focus-session.sh 0"

### Swap
bind-key -n M-'<'             run-shell "$HOME/.config/tmux/rust/ghc-tmux-status/target/release/ghc-tmux-status session swap prev"
bind-key -n M-'>'             run-shell "$HOME/.config/tmux/rust/ghc-tmux-status/target/release/ghc-tmux-status session swap next"

### Rename
bind-key -n M-'/'             command-prompt -p "Set window name:"  -I "#{window_name}"    "rename-window '%%'"      # Rename window
bind-key -n M-'?'             command-prompt -p "Set session name:" -I "#{session_name}"   "rename-session '%%'"     # Rename session

### Toggle
bind-key -n M-T               run-shell "node $HOME/.config/guanghechen/cli/theme.mjs toggle --silent"

## Session

### Create / Move
bind-key -n M-m               command-prompt -p "Move pane to window:"  -I "#{window_name}" 'run-shell "bash $HOME/.config/tmux/script/move-pane.sh '%%'"'
bind-key -n M-n               command-prompt -p "New window name:"      -I "#{window_name}-2" "new-window -n '%%'"

### Focus
bind-key -n M-1               select-window -t 1
bind-key -n M-2               select-window -t 2
bind-key -n M-3               select-window -t 3
bind-key -n M-4               select-window -t 4
bind-key -n M-5               select-window -t 5
bind-key -n M-6               select-window -t 6
bind-key -n M-7               select-window -t 7
bind-key -n M-8               select-window -t 8
bind-key -n M-9               select-window -t 9
bind-key -n M-0               select-window -t 10
# bind-key -n M-'['             previous-window
# bind-key -n M-']'             next-window
bind-key -n M-'`'             if -F "$_tmux_is_tui_pane"     "send-keys M-\`"    "last-window"
bind-key -n M-"'"             last-window
bind-key -n M-';'             last-pane -Z
bind-key -n M-p               select-pane -t '{next}' -Z
bind-key -n M-P               select-pane -t '{previous}' -Z

### Kill
bind-key -n M-O               confirm-before -p "Kill other windows? (y/n)"   "kill-window -a"  # Close other window.
bind-key -n M-W               confirm-before -p "Kill current window? (y/n)"  "kill-window"     # Close current window.

### Swap
bind-key -n M-'{'             swap-window -d -t -1
bind-key -n M-'}'             swap-window -d -t +1

## Window

### Create
bind-key -n M-H               split-window -hb  -c "#{pane_current_path}"   # Split pane to the left
bind-key -n M-J               split-window -v   -c "#{pane_current_path}"   # Split pane below
bind-key -n M-K               split-window -vb  -c "#{pane_current_path}"   # Split pane above
bind-key -n M-L               split-window -h   -c "#{pane_current_path}"   # Split pane to the right

### Focus
bind-key -n M-h               if -F "$_tmux_is_tui_pane"      "send-keys C-a h"   "if -F \"#{pane_at_left}\"    \"\"  \"select-pane -Z -L\""
bind-key -n M-j               if -F "$_tmux_is_tui_pane"      "send-keys C-a j"   "if -F \"#{pane_at_bottom}\"  \"\"  \"select-pane -Z -D\""
bind-key -n M-k               if -F "$_tmux_is_tui_pane"      "send-keys C-a k"   "if -F \"#{pane_at_top}\"     \"\"  \"select-pane -Z -U\""
bind-key -n M-l               if -F "$_tmux_is_tui_pane"      "send-keys C-a l"   "if -F \"#{pane_at_right}\"   \"\"  \"select-pane -Z -R\""

### Kill
bind-key -n M-o               if -F "$_tmux_is_tui_pane"      "send-keys M-o"      "confirm-before -p \"Kill other panes? (y/n)\" \"kill-pane -a\""
bind-key -n M-d               confirm-before -p "Kill current pane? (y/n)" "kill-pane" # Close current pane

### Misc
bind-key -n M-b               copy-mode\; send-keys -X previous-prompt
bind-key -n M-c               if -F "$_tmux_is_tui_pane"      "send-keys M-c"     "copy-mode"
bind-key -n M-C               copy-mode
bind-key -n M-:               command-prompt

### Popup
bind-key -n M-g               if -F "$_tmux_is_tui_pane"      "send-keys M-g"     "display-popup -d \"#{pane_current_path}\" -w90% -h90% -E \"lg\""
bind-key -n M-t               if -F "$_tmux_is_tui_pane"      "send-keys M-t"     "run-shell \"bash $HOME/.config/tmux/script/popup.sh\""
bind-key -n M-y               if -F "$_tmux_is_tui_pane"      "send-keys M-y"     "display-popup -d \"#{pane_current_path}\" -w90% -h90% -E \"fish -ic 'yazi 2>/dev/null'\""

### Resize
bind-key -n -r M-Left         if-shell "$_tmux_is_zen_mode"   "send-keys M-Left"  "resize-pane -L 1"
bind-key -n -r M-Down         if-shell "$_tmux_is_zen_mode"   "send-keys M-Down"  "resize-pane -D 1"
bind-key -n -r M-Up           if-shell "$_tmux_is_zen_mode"   "send-keys M-Up"    "resize-pane -U 1"
bind-key -n -r M-Right        if-shell "$_tmux_is_zen_mode"   "send-keys M-Right" "resize-pane -R 1"
bind-key -n    M-z            resize-pane -Z

### Swap
bind-key -n M-S-Left          swap-pane -d -t '{left-of}'
bind-key -n M-S-Down          swap-pane -d -t '{down-of}'
bind-key -n M-S-Up            swap-pane -d -t '{up-of}'
bind-key -n M-S-Right         swap-pane -d -t '{right-of}'

### Layout
bind-key -n M-'|'             select-layout "even-horizontal"
bind-key -n M-'_'             select-layout "even-vertical"
