set   -g pane-border-format "\
#[default] \
#[fg=#{?pane_active,#{@GHC_PSL_FG_SYM_ACTIVE},#{@GHC_PSL_FG_SYM}}, bg=#{?pane_active,#{@GHC_PSL_BG_SYM_ACTIVE},#{@GHC_PSL_BG_SYM}}]#{@GHC_SYM_OS} \
#[fg=#{?pane_active,#{@GHC_PSL_FG_TXT_ACTIVE},#{@GHC_PSL_FG_TXT}}, bg=#{?pane_active,#{@GHC_PSL_BG_TXT_ACTIVE},#{@GHC_PSL_BG_TXT}}]#(ps -o user= -t #{pane_tty})\
#[default]  \
#[fg=#{?pane_active,#{@GHC_PSL_FG_SYM_ACTIVE},#{@GHC_PSL_FG_SYM}}, bg=#{?pane_active,#{@GHC_PSL_BG_SYM_ACTIVE},#{@GHC_PSL_BG_SYM}}]#{@GHC_SYM_PID} \
#[fg=#{?pane_active,#{@GHC_PSL_FG_TXT_ACTIVE},#{@GHC_PSL_FG_TXT}}, bg=#{?pane_active,#{@GHC_PSL_BG_TXT_ACTIVE},#{@GHC_PSL_BG_TXT}}]#{pane_id} #{pane_pid}:#(ps -o pid= -t '#{pane_tty}' | rg -o '\\d+' | tail -1)\
#[default]  \
#[fg=#{?pane_active,#{@GHC_PSL_FG_SYM_ACTIVE},#{@GHC_PSL_FG_SYM}}, bg=#{?pane_active,#{@GHC_PSL_BG_SYM_ACTIVE},#{@GHC_PSL_BG_SYM}}]#{@GHC_SYM_APP} \
#[fg=#{?pane_active,#{@GHC_PSL_FG_TXT_ACTIVE},#{@GHC_PSL_FG_TXT}}, bg=#{?pane_active,#{@GHC_PSL_BG_TXT_ACTIVE},#{@GHC_PSL_BG_TXT}}]#{@GHC_SYM_INDEX}#{pane_index}/#{window_panes} #{pane_title}\
#[default]  \
#[fg=#{@GHC_PSL_FG_COPY_MODE}#,bg=#{@GHC_PSL_BG_COPY_MODE}#,bold]#{?pane_in_mode,#{@GHC_SYM_COPY_MODE} #{copy_cursor_y}/#{history_size} ,}\
#[default] \
"

