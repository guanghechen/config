set   -g pane-border-format "\
#[default] \
#[fg=#{?pane_active,#{@GHC_PSL_FG_SYM_ACTIVE},#{@GHC_PSL_FG_SYM}}, bg=#{?pane_active,#{@GHC_PSL_BG_SYM_ACTIVE},#{@GHC_PSL_BG_SYM}}]#{@GHC_SYM_PID} \
#[fg=#{?pane_active,#{@GHC_PSL_FG_TXT_ACTIVE},#{@GHC_PSL_FG_TXT}}, bg=#{?pane_active,#{@GHC_PSL_BG_TXT_ACTIVE},#{@GHC_PSL_BG_TXT}}]#{pane_id} #{pane_pid}:#(ps -o pid= -t '#{pane_tty}' | rg -o '\\d+' | tail -1)\
#[default]  \
#[fg=#{?pane_active,#{@GHC_PSL_FG_SYM_ACTIVE},#{@GHC_PSL_FG_SYM}}, bg=#{?pane_active,#{@GHC_PSL_BG_SYM_ACTIVE},#{@GHC_PSL_BG_SYM}}]#{@GHC_SYM_APP} \
#[fg=#{?pane_active,#{@GHC_PSL_FG_TXT_ACTIVE},#{@GHC_PSL_FG_TXT}}, bg=#{?pane_active,#{@GHC_PSL_BG_TXT_ACTIVE},#{@GHC_PSL_BG_TXT}}]#{@GHC_SYM_INDEX}#{pane_index}#{?#{e|>:#{window_panes},1},/#{window_panes},} #{pane_title}\
#[default] \
#[default]  \
#{?pane_in_mode,#[fg=#{@GHC_PSL_FG_COPY_MODE}#,bg=#{@GHC_PSL_BG_COPY_MODE}#,bold]#{@GHC_SYM_COPY_MODE} #{e|+:#{e|-:#{history_size},#{scroll_position}},#{e|+:#{copy_cursor_y},1}}/#{e|+:#{history_size},#{pane_height}}#{?selection_active, #{@GHC_SYM_COPY_MODE_SELECT},}#{?search_present, #{@GHC_SYM_COPY_MODE_SEARCH},} ,}\
"

