## Message
set   -g message-style                  "fg=#{@GHC_SL_FG_MESSAGE},bg=#{@GHC_SL_BG_MESSAGE},bold"
set   -g message-command-style          "fg=#{@GHC_SL_FG_CMDLINE},bg=#{@GHC_SL_BG_CMDLINE}"

## Mode
set   -g mode-style                     "fg=#{@GHC_SL_FG_COPY_MODE},bg=#{@GHC_SL_BG_COPY_MODE}"
set   -g copy-mode-match-style          "fg=#{@GHC_SL_FG_COPY_MODE_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_MATCH}"
set   -g copy-mode-current-match-style  "fg=#{@GHC_SL_FG_COPY_MODE_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_MATCH},bold"
set   -g copy-mode-mark-style           "fg=#{@GHC_SL_FG_COPY_MODE_MARK},bg=#{@GHC_SL_BG_COPY_MODE_MARK}"
set   -g copy-mode-position-style       "fg=#{@GHC_SL_FG_COPY_MODE_POS},bg=#{@GHC_SL_BG_COPY_MODE_POS}"
set   -g copy-mode-selection-style      "fg=#{@GHC_SL_FG_COPY_MODE_SEL},bg=#{@GHC_SL_BG_COPY_MODE_SEL}"

## Pane
setw  -g pane-base-index                1 # Make pane numbering consistent with windows.
# set   -g pane-border-status             top
set   -g pane-border-indicators         arrows
set   -g pane-border-lines              heavy
set   -g pane-border-style              "fg=#{@GHC_PSL_FG_BORDER}"
set   -g pane-active-border-style       "fg=#{@GHC_PSL_FG_BORDER_CUR},bold"
set   -g pane-scrollbars                off
set   -g pane-scrollbars-position       right
set   -g pane-scrollbars-style          "fg=white,bg=black,width=1,pad=0"
set   -g window-style                   "bg=#{@GHC_PANE_BG}"
set   -g window-active-style            "bg=#{@GHC_PANE_BG_ACTIVE}"

## Popup
set   -g @popup-bg                      "colour0"
set   -g @popup-fg                      "colour255"
set   -g popup-border-style             "fg=default,bg=default"
set   -g popup-border-lines             "rounded"

## Statusline
set   -g base-index                     1       # Start windows numbering at 1.
# set   -g status                         on
# set   -g status-position                top  # Put the status line position to top.
# set   -g status-justify                 "centre"
set   -g status-interval                1      # Redraw status line every 1 second.
set   -g status-style                   "none,bg=#{@GHC_SL_BG}"
set   -g status-left-style              "bold"
set   -g status-right-style             "none"
set   -g status-left-length             64
set   -g status-right-length            64

### window
setw  -g window-status-activity-style   "none"
setw  -g window-status-current-style    "none"
setw  -g window-status-separator        " "
setw  -g window-status-style            "none,bg=#{@GHC_SL_BG}"

setw -g window-status-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_NAME},  bg=#{@GHC_SL_BG}]#{@GHC_SEP_LEFT}\
#[fg=#{@GHC_SL_FG_WIN_NAME},  bg=#{@GHC_SL_BG_WIN_NAME}]#W \
#[fg=#{@GHC_SL_FG_WIN_NUM},   bg=#{@GHC_SL_BG_WIN_NUM}] #I\
#[fg=#{@GHC_SL_BG_WIN_NUM},   bg=#{@GHC_SL_BG}]#{@GHC_SEP_RIGHT}\
#[default]\
"

### window (active)
setw -g window-status-current-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_NAME_ACTIVE},   bg=#{@GHC_SL_BG}]#{@GHC_SEP_LEFT}\
#[fg=#{@GHC_SL_FG_WIN_NAME_ACTIVE},   bg=#{@GHC_SL_BG_WIN_NAME_ACTIVE}, bold]#W \
#[fg=#{@GHC_SL_FG_WIN_NUM_ACTIVE},    bg=#{@GHC_SL_BG_WIN_NUM_ACTIVE}, bold]| #I\
#[fg=#{@GHC_SL_BG_WIN_NUM_ACTIVE},    bg=#{@GHC_SL_BG}]#{@GHC_SEP_RIGHT}\
#[default]\
"
