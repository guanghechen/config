## Message
set   -g message-style                  "fg=#{@GHC_SL_FG_MESSAGE},bg=#{@GHC_SL_BG_MESSAGE},fill=#{@GHC_SL_BG_MESSAGE},bold"
set   -g message-command-style          "fg=#{@GHC_SL_FG_CMDLINE},bg=#{@GHC_SL_BG_CMDLINE},fill=#{@GHC_SL_BG_CMDLINE}"

## Mode
set   -g mode-style                     "fg=#{@GHC_SL_FG_COPY_MODE},bg=#{@GHC_SL_BG_COPY_MODE}"
set   -g copy-mode-match-style          "fg=#{@GHC_SL_FG_COPY_MODE_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_MATCH}"
set   -g copy-mode-current-match-style  "fg=#{@GHC_SL_FG_COPY_MODE_CUR_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_CUR_MATCH},bold"
set   -g copy-mode-mark-style           "fg=#{@GHC_SL_FG_COPY_MODE_MARK},bg=#{@GHC_SL_BG_COPY_MODE_MARK}"
set   -g copy-mode-position-style       "fg=#{@GHC_SL_FG_COPY_MODE_POS},bg=#{@GHC_SL_BG_COPY_MODE_POS}"
set   -g copy-mode-position-format      "#[align=right]#{@GHC_SYM_COPY_MODE} #{e|+:#{e|-:#{history_size},#{scroll_position}},#{e|+:#{copy_cursor_y},1}}/#{e|+:#{history_size},#{pane_height}}#{?selection_active, #{@GHC_SYM_COPY_MODE_SELECT},}#{?search_present, #{@GHC_SYM_COPY_MODE_SEARCH},}#{?search_count, (#{search_count}#{?search_count_partial,+,}),}"
set   -g copy-mode-selection-style      "fg=#{@GHC_SL_FG_COPY_MODE_SEL},bg=#{@GHC_SL_BG_COPY_MODE_SEL}"
set   -g copy-mode-line-numbers         hybrid   # absolute on current line, relative elsewhere (vi Nj/Nk)
set   -g copy-mode-line-number-style    "fg=#{@GHC_PSL_FG_BORDER}"
set   -g copy-mode-current-line-number-style "fg=#{@GHC_PSL_FG_COPY_MODE},bold"

## Tree mode (choose-tree preview label — tmux 3.7+)
# Label text comes from @GHC_TREE_PREVIEW_FORMAT (conf/variable.tmux.conf); here we
# only colour it, replacing tmux's default display-panes blue/red with the theme's
# tree accents: cyan for the active pane/window, #{@GHC_SL_FG_TREE_PANE_ID} otherwise.
set   -g tree-mode-preview-format       "#{E:@GHC_TREE_PREVIEW_FORMAT}"
set   -g tree-mode-preview-style        "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},cyan,#{@GHC_SL_FG_TREE_PANE_ID}}"

## Pane
setw  -g pane-base-index                1 # Make pane numbering consistent with windows.
# set   -g pane-border-status             top
set   -g pane-border-indicators         arrows
set   -g pane-border-lines              heavy
set   -g pane-border-style              "fg=#{@GHC_PSL_FG_BORDER}"
set   -g pane-active-border-style       "fg=#{@GHC_PSL_FG_BORDER_CUR},bold"
set   -g pane-scrollbars                off
set   -g pane-scrollbars-position       right
set   -g pane-scrollbars-style          "fg=white,bg=black,width=1,pad=0"
set   -g window-style                   "bg=#{@GHC_PANE_BG}"
set   -g window-active-style            "bg=#{@GHC_PANE_BG_ACTIVE}"

## Popup
set   -gF @popup-bg                     "#{@GHC_POPUP_BG}"
set   -gF @popup-fg                     "#{@GHC_POPUP_FG_BORDER}"
set   -g popup-style                    "bg=#{@GHC_POPUP_BG},fg=#{@GHC_POPUP_FG}"
set   -g popup-border-style             "bg=#{@GHC_POPUP_BG},fg=#{@GHC_POPUP_FG_BORDER}"
set   -g popup-border-lines             "rounded"

## Menu — themed overlay (readable on light & dark)
set   -g menu-style                     "bg=#{@GHC_MENU_BG},fg=#{@GHC_MENU_FG}"
set   -g menu-border-style              "fg=#{@GHC_MENU_FG},bg=#{@GHC_MENU_BG}"
set   -g menu-border-lines              "rounded"
set   -g menu-selected-style            "bg=#{@GHC_MENU_BG_SELECTED},fg=#{@GHC_MENU_FG_SELECTED},bold"

## Statusline
set   -g base-index                     1       # Start windows numbering at 1.
# set   -g status                         on
# set   -g status-position                top  # Put the status line position to top.
# set   -g status-justify                 "centre"
# status-interval is owned per mode: status01 sets 20, status02 drives 1 from Rust.
set   -g status-style                   "none,bg=#{@GHC_SL_BG}"
set   -g status-left-style              "bold"
set   -g status-right-style             "none"
set   -g status-left-length             64
set   -g status-right-length            84

### window
setw  -g window-status-activity-style   "none"
setw  -g window-status-bell-style       "none"
setw  -g window-status-current-style    "none"
setw  -g window-status-separator        " "
setw  -g window-status-style            "none,bg=#{@GHC_SL_BG}"

# The two-column state slot makes spinner and bell mutually exclusive without a
# second pane traversal: a live frame fills the slot; otherwise bell may fill it.
# Zoom is an independent decorator. The caller reapplies its title style afterwards.
# Decorators swap colors to preserve their palette in reverse mode.
# Keep this format with its callers so theme reloads update both styles together.
set -g @GHC_WINDOW_PREFIX_FMT "\
#{=2:\
#{E:@GHC_WINDOW_RUNNING_FRAME_FMT}\
#{?window_bell_flag,\
#[fg=#{?window_active,#{@GHC_SL_BG_WIN_ACTIVE_ICON_BELL},#{?window_last_flag,#{@GHC_SL_BG_WIN_LAST_ICON_BELL},#{@GHC_SL_BG_WIN_ICON_BELL}}}#,bg=#{?window_active,#{@GHC_SL_FG_WIN_ACTIVE_ICON_BELL},#{?window_last_flag,#{@GHC_SL_FG_WIN_LAST_ICON_BELL},#{@GHC_SL_FG_WIN_ICON_BELL}}}#,reverse#,bold]#{@GHC_SYM_WIN_BELL} \
,}}\
#{?window_zoomed_flag,\
#[fg=#{?window_active,#{@GHC_SL_BG_WIN_ACTIVE_ICON_ZOOM},#{?window_last_flag,#{@GHC_SL_BG_WIN_LAST_ICON_ZOOM},#{@GHC_SL_BG_WIN_ICON_ZOOM}}}#,bg=#{?window_active,#{@GHC_SL_FG_WIN_ACTIVE_ICON_ZOOM},#{?window_last_flag,#{@GHC_SL_FG_WIN_LAST_ICON_ZOOM},#{@GHC_SL_FG_WIN_ICON_ZOOM}}}#,reverse#,bold]#{@GHC_SYM_WIN_ZOOM} \
,}"

### !!!Note: I am using the '\u00a0' (invisible whitespace) to make sure the icon always showing in smaller size with 1-column gap.
### window (normal)
setw -g window-status-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_LAST_NAME},         bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,#{@GHC_SEP_LEFT},}\
#[fg=#{@GHC_SL_BG_WIN_NAME},              bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,,#{@GHC_SEP_LEFT}}\
#[fg=#{@GHC_SL_BG_WIN_LAST_NAME},bg=#{@GHC_SL_FG_WIN_LAST_NAME},reverse,bold]#{?window_last_flag,#{E:@GHC_WINDOW_PREFIX_FMT},}\
#[fg=#{@GHC_SL_BG_WIN_LAST_NAME},bg=#{@GHC_SL_FG_WIN_LAST_NAME},reverse,bold]#{?window_last_flag,#W ,}\
#[fg=#{@GHC_SL_BG_WIN_NAME},bg=#{@GHC_SL_FG_WIN_NAME},reverse,nobold]#{?window_last_flag,,#{E:@GHC_WINDOW_PREFIX_FMT}}\
#[fg=#{@GHC_SL_BG_WIN_NAME},bg=#{@GHC_SL_FG_WIN_NAME},reverse,nobold]#{?window_last_flag,,#W }\
#[fg=#{@GHC_SL_BG_WIN_LAST_NUM},bg=#{@GHC_SL_FG_WIN_LAST_NUM},reverse,bold]#{?window_last_flag, #I,}\
#[fg=#{@GHC_SL_BG_WIN_NUM},bg=#{@GHC_SL_FG_WIN_NUM},reverse]#{?window_last_flag,, #I}\
#[fg=#{@GHC_SL_BG_WIN_NUM},               bg=#{@GHC_SL_BG},noreverse]#{?window_last_flag,,#{@GHC_SEP_RIGHT}}\
#[fg=#{@GHC_SL_BG_WIN_LAST_NUM},          bg=#{@GHC_SL_BG},noreverse]#{?window_last_flag,#{@GHC_SEP_RIGHT},}\
#[default]\
"

### window (active)
# Swapped colors plus reverse keep the fill opaque with Ghostty cell transparency.
setw -g window-status-current-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NAME},       bg=#{@GHC_SL_BG}                            ]#{@GHC_SEP_LEFT}\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NAME},      bg=#{@GHC_SL_FG_WIN_ACTIVE_NAME},reverse,bold]#{E:@GHC_WINDOW_PREFIX_FMT}\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NAME},      bg=#{@GHC_SL_FG_WIN_ACTIVE_NAME},reverse,bold]#W \
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NUM},       bg=#{@GHC_SL_FG_WIN_ACTIVE_NUM}, reverse,bold]| #I\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NUM},       bg=#{@GHC_SL_BG},                  noreverse]#{@GHC_SEP_RIGHT}\
#[default]\
"
