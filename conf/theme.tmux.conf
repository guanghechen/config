## Message
set   -g message-style                  "fg=#{@GHC_SL_FG_MESSAGE},bg=#{@GHC_SL_BG_MESSAGE},bold"
set   -g message-command-style          "fg=#{@GHC_SL_FG_CMDLINE},bg=#{@GHC_SL_BG_CMDLINE}"

## Mode
set   -g mode-style                     "fg=#{@GHC_SL_FG_COPY_MODE},bg=#{@GHC_SL_BG_COPY_MODE}"
set   -g copy-mode-match-style          "fg=#{@GHC_SL_FG_COPY_MODE_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_MATCH}"
set   -g copy-mode-current-match-style  "fg=#{@GHC_SL_FG_COPY_MODE_MATCH},bg=#{@GHC_SL_BG_COPY_MODE_MATCH},bold"
set   -g copy-mode-mark-style           "fg=#{@GHC_SL_FG_COPY_MODE_MARK},bg=#{@GHC_SL_BG_COPY_MODE_MARK}"
set   -g copy-mode-position-style       "fg=#{@GHC_SL_FG_COPY_MODE_POS},bg=#{@GHC_SL_BG_COPY_MODE_POS}"
set   -g copy-mode-selection-style      "fg=#{@GHC_SL_FG_COPY_MODE_SEL},bg=#{@GHC_SL_BG_COPY_MODE_SEL}"

## Pane
setw  -g pane-base-index                1 # Make pane numbering consistent with windows.
# set   -g pane-border-status             top
set   -g pane-border-indicators         arrows
set   -g pane-border-lines              heavy
set   -g pane-border-style              "fg=#{@GHC_PSL_FG_BORDER}"
set   -g pane-active-border-style       "fg=#{@GHC_PSL_FG_BORDER_CUR},bold"
set   -g pane-scrollbars                off
set   -g pane-scrollbars-position       right
set   -g pane-scrollbars-style          "fg=white,bg=black,width=1,pad=0"
set   -g window-style                   "bg=#{@GHC_PANE_BG}"
set   -g window-active-style            "bg=#{@GHC_PANE_BG_ACTIVE}"

## Popup
set   -g @popup-bg                      "colour0"
set   -g @popup-fg                      "colour255"
set   -g popup-border-style             "fg=default,bg=default"
set   -g popup-border-lines             "rounded"

## Statusline
set   -g base-index                     1       # Start windows numbering at 1.
# set   -g status                         on
# set   -g status-position                top  # Put the status line position to top.
# set   -g status-justify                 "centre"
set   -g status-interval                1      # Redraw status line every 1 second.
set   -g status-style                   "none,bg=#{@GHC_SL_BG}"
set   -g status-left-style              "bold"
set   -g status-right-style             "none"
set   -g status-left-length             64
set   -g status-right-length            84

### window
setw  -g window-status-activity-style   "none"
setw  -g window-status-current-style    "none"
setw  -g window-status-separator        " "
setw  -g window-status-style            "none,bg=#{@GHC_SL_BG}"

### !!!Note: I am using the '\u00a0' (invisible whitespace) to make sure the icon always showing in smaller size with 1-column gap.
### window (normal)
setw -g window-status-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_LAST_NAME},         bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,#{@GHC_SEP_LEFT},}\
#[fg=#{@GHC_SL_BG_WIN_NAME},              bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,,#{@GHC_SEP_LEFT}}\
#[fg=#{@GHC_SL_FG_WIN_LAST_NAME},         bg=#{@GHC_SL_BG_WIN_LAST_NAME},         bold]#{?window_last_flag,#W ,}\
#[fg=#{@GHC_SL_FG_WIN_NAME},              bg=#{@GHC_SL_BG_WIN_NAME}                   ]#{?window_last_flag,,#W }\
#[fg=#{@GHC_SL_FG_WIN_LAST_NUM},          bg=#{@GHC_SL_BG_WIN_LAST_NUM},          bold]#{?window_last_flag, #I,}\
#[fg=#{@GHC_SL_FG_WIN_NUM},               bg=#{@GHC_SL_BG_WIN_NUM}                    ]#{?window_last_flag,, #I}\
#[fg=#{@GHC_SL_FG_WIN_LAST_ICON_BELL},    bg=#{@GHC_SL_BG_WIN_LAST_ICON_BELL},    bold]#{?#{&&:#{window_bell_flag},#{window_last_flag}}, #{@GHC_SYM_WIN_BELL},}\
#[fg=#{@GHC_SL_FG_WIN_ICON_BELL},         bg=#{@GHC_SL_BG_WIN_ICON_BELL},         bold]#{?#{&&:#{window_bell_flag},#{!:#{window_last_flag}}}, #{@GHC_SYM_WIN_BELL},}\
#[fg=#{@GHC_SL_FG_WIN_LAST_ICON_ZOOM},    bg=#{@GHC_SL_BG_WIN_LAST_ICON_ZOOM},    bold]#{?#{&&:#{window_zoomed_flag},#{window_last_flag}}, #{@GHC_SYM_WIN_ZOOM},}\
#[fg=#{@GHC_SL_FG_WIN_ICON_ZOOM},         bg=#{@GHC_SL_BG_WIN_ICON_ZOOM},         bold]#{?#{&&:#{window_zoomed_flag},#{!:#{window_last_flag}}}, #{@GHC_SYM_WIN_ZOOM},}\
#[fg=#{@GHC_SL_BG_WIN_NUM},               bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,,#{@GHC_SEP_RIGHT}}\
#[fg=#{@GHC_SL_BG_WIN_LAST_NUM},          bg=#{@GHC_SL_BG}                            ]#{?window_last_flag,#{@GHC_SEP_RIGHT},}\
#[default]\
"

### window (active)
setw -g window-status-current-format "\
#[default]\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NAME},       bg=#{@GHC_SL_BG}                            ]#{@GHC_SEP_LEFT}\
#[fg=#{@GHC_SL_FG_WIN_ACTIVE_NAME},       bg=#{@GHC_SL_BG_WIN_ACTIVE_NAME},       bold]#W \
#[fg=#{@GHC_SL_FG_WIN_ACTIVE_NUM},        bg=#{@GHC_SL_BG_WIN_ACTIVE_NUM},        bold]| #I\
#[fg=#{@GHC_SL_FG_WIN_ACTIVE_ICON_BELL},  bg=#{@GHC_SL_BG_WIN_ACTIVE_ICON_BELL},  bold]#{?window_bell_flag, #{@GHC_SYM_WIN_BELL},}\
#[fg=#{@GHC_SL_FG_WIN_ACTIVE_ICON_ZOOM},  bg=#{@GHC_SL_BG_WIN_ACTIVE_ICON_ZOOM},  bold]#{?window_zoomed_flag, #{@GHC_SYM_WIN_ZOOM},}\
#[fg=#{@GHC_SL_BG_WIN_ACTIVE_NUM},        bg=#{@GHC_SL_BG}                            ]#{@GHC_SEP_RIGHT}\
#[default]\
"
