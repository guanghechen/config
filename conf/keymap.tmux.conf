#, decide whether we're in a Vim process
# See: https://github.com/christoomey/vim-tmux-navigator/blob/a26954a585b02a2ac02f87145e204f8798a7cbc2/vim-tmux-navigator.tmux#L1
_tmux_is_zen_mode="(tmux display-message -p '#{window_panes}' | grep -iqE 1) || (tmux display-message -p '#{window_zoomed_flag}' | grep -iqE 1)"
_tmux_is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?(\\.exe)?$'"
_tmux_is_other_user="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?sudo$'"
_tmux_prefer_process="$_tmux_is_vim || ($_tmux_is_other_user && $_tmux_is_zen_mode)"

set -g      prefix C-a
bind    C-a send-prefix
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history # Clear both screen and history

## Server
bind-key -n F2                command-prompt -p "Set window name:"  -I "#{window_name}"    "rename-window '%%'"      # Rename window
bind-key -n S-F2              command-prompt -p "Set session name:" -I "#{session_name}"   "rename-session '%%'"     # Rename session
bind-key -n F12               run-shell "bash $HOME/.config/tmux/script/popup.sh"
bind-key    R                 run-shell 'tmux source-file $HOME/.config/tmux/tmux.conf; tmux display-message "Config reloaded.."'

### Create / Move
bind-key    M                 command-prompt -p "Move window to session:" -I "#{session_name}" 'run-shell "bash $HOME/.config/tmux/script/move-window.sh '%%'"'
bind-key    N                 command-prompt -p "New session name:"       -I "#{session_name}-2" "new-session -s '%%'"

### Focus
bind-key    D                 detach-client
bind-key    S                 choose-tree -s
bind-key    ','               run-shell "bash $HOME/.config/tmux/script/focus-session.sh prev"
bind-key    '.'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh next"

### Toggle
bind-key    F11               run-shell "bash $HOME/.config/tmux/script/status-toggle.sh"
bind-key    T                 run-shell "node $HOME/.config/guanghechen/config/theme/toggle_theme.mjs"

## Session

### Create / Move
bind-key    m                 command-prompt -p "Move pane to window:"  -I "#{window_name}" "join-pane -t :'%%'"
bind-key    n                 command-prompt -p "New window name:"      -I "#{window_name}-2" "new-window -n '%%'"

### Focus
bind-key    1                 select-window -t 1
bind-key    2                 select-window -t 2
bind-key    3                 select-window -t 3
bind-key    4                 select-window -t 4
bind-key    5                 select-window -t 5
bind-key    6                 select-window -t 6
bind-key    7                 select-window -t 7
bind-key    8                 select-window -t 8
bind-key    9                 select-window -t 9
bind-key    0                 select-window -t 10
bind-key    '['               previous-window
bind-key    ']'               next-window
bind-key    '`'               last-window

### Kill
bind-key    O                 confirm-before -p "Kill other windows? (y/n)"   "kill-window -a"  # Close other window.
bind-key    W                 confirm-before -p "Kill current window? (y/n)"  kill-window       # Close current window.

### Swap
bind-key    '{'               swap-window -t -1 \; previous-window
bind-key    '}'               swap-window -t +1 \; next-window

## Window

### Create
bind-key    L                 split-window -h -c '#{pane_current_path}'
bind-key    J                 split-window -v -c '#{pane_current_path}'

### Focus
bind-key    k                 if-shell "$_tmux_prefer_process"  'send-keys C-a k'     'select-pane -U'
bind-key    l                 if-shell "$_tmux_prefer_process"  'send-keys C-a l'     'select-pane -R'
bind-key    j                 if-shell "$_tmux_prefer_process"  'send-keys C-a j'     'select-pane -D'
bind-key    h                 if-shell "$_tmux_prefer_process"  'send-keys C-a h'     'select-pane -L'

### Kill
bind-key    o                 if-shell "$_tmux_prefer_process"  'send-keys M-o'       'confirm-before -p "Kill other panes? (y/n)" "kill-pane -a"' # Close other panes
bind-key    w                 confirm-before -p "Kill current pane? (y/n)" kill-pane # Close current pane
bind-key    p                 kill-pane # Close current pane

### Misc
bind-key    b                 copy-mode\; send-keys -X start-of-line\; send-keys -X search-backward "  "
bind-key    c                 if-shell "$_tmux_prefer_process"  'send-keys C-a c'     'copy-mode'
bind-key    :                 command-prompt -p ":" "send-keys ':' Enter"

### Popup
bind-key    g                 if-shell "$_tmux_prefer_process"  'send-keys C-a g'     'display-popup -d "#{pane_current_path}" -w90% -h90% -E "lazygit -ucf $HOME/.config/lazygit/local/theme.yml"'
bind-key    t                 if-shell "$_tmux_prefer_process"  'send-keys C-a t'     'run-shell "bash $HOME/.config/tmux/script/popup.sh"'
bind-key    y                 if-shell "$_tmux_prefer_process"  'send-keys C-a y'     'display-popup -d "#{pane_current_path}" -w90% -h90% -E "yazi"'

### Resize
bind-key -r Up                if-shell "$_tmux_is_zen_mode"     'send-keys C-a Up'    'resize-pane -U 1'
bind-key -r Right             if-shell "$_tmux_is_zen_mode"     'send-keys C-a Right' 'resize-pane -R 1'
bind-key -r Down              if-shell "$_tmux_is_zen_mode"     'send-keys C-a Down'  'resize-pane -D 1'
bind-key -r Left              if-shell "$_tmux_is_zen_mode"     'send-keys C-a Left'  'resize-pane -L 1'
bind-key    z                 resize-pane -Z

### Swap
bind-key    S-Up              swap-pane -t '{up-of}'    \; select-pane -t '{down-of}'
bind-key    S-Right           swap-pane -t '{right-of}' \; select-pane -t '{left-of}'
bind-key    S-Down            swap-pane -t '{down-of}'  \; select-pane -t '{up-of}'
bind-key    S-Left            swap-pane -t '{left-of}'  \; select-pane -t '{right-of}'
bind-key    '<'               select-layout "even-horizontal"
bind-key    '>'               select-layout "even-vertical"

if-shell "[ $(uname) != 'Darwin' ]" "source $HOME/.config/tmux/conf/keymap.nix.tmux.conf"

## Copy mode
bind-key -T copy-mode-vi v    send-keys -X begin-selection
bind-key -T copy-mode-vi C-v  send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V    send-keys -X rectangle-toggle
bind-key -T copy-mode-vi h    send-keys -X cursor-left
bind-key -T copy-mode-vi l    send-keys -X cursor-right
bind-key -T copy-mode-vi k    send-keys -X cursor-up
bind-key -T copy-mode-vi j    send-keys -X cursor-down
bind-key -T copy-mode-vi e    send-keys -X next-word-end
bind-key -T copy-mode-vi K    send-keys -N 5 -X cursor-up
bind-key -T copy-mode-vi J    send-keys -N 5 -X cursor-down
bind-key -T copy-mode-vi H    send-keys -X start-of-line
bind-key -T copy-mode-vi L    send-keys -X end-of-line
bind-key -T copy-mode-vi Y    send-keys -X copy-end-of-line
bind-key -T copy-mode-vi y    send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi =    send-keys -X search-again
bind-key -T copy-mode-vi +    send-keys -X search-reverse

