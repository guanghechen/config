set  -g     prefix            C-a
bind        C-a               send-prefix
bind -n     C-l               send-keys C-l \; run "sleep 0.2" \; clear-history # Clear both screen and history

## Server
bind-key    F1                run-shell "bash $HOME/.config/tmux/script/popup.sh"
bind-key    F5                if-shell 'tmux source-file $HOME/.config/tmux/tmux.conf' 'display-message "Config reloaded."' 'display-message "Config reload failed."'
bind-key    F6                run-shell "fish -c 'ghc-ghostty-shader --silent'"
bind-key    F9                run-shell "bash $HOME/.config/tmux/script/toggle-rows.sh forward"
bind-key    F10               set status
bind-key    F11               run-shell "bash $HOME/.config/tmux/script/toggle-status.sh forward"
bind-key    F12               run-shell "bash $HOME/.config/tmux/script/toggle-pane-status.sh forward"
bind-key    S-F6              run-shell "fish -c 'ghc-ghostty-shader --silent --prev'"
bind-key    S-F9              run-shell "bash $HOME/.config/tmux/script/toggle-rows.sh backward"
bind-key    S-F10             set pane-border-status
bind-key    S-F11             run-shell "bash $HOME/.config/tmux/script/toggle-status.sh backward"
bind-key    S-F12             run-shell "bash $HOME/.config/tmux/script/toggle-pane-status.sh backward"

### Create / Move
bind-key    M                 command-prompt -C -e -p "Move window to session:" -I "#{session_name}" 'set-option -p @GHC_MOVE_WINDOW_TARGET "%%%" ; run-shell "bash $HOME/.config/tmux/script/move-window.sh #{pane_id}"'
bind-key    N                 command-prompt -C -e -p "New session name:"       -I "#{session_name}-2" 'new-session -s "%%%"'

### Focus
bind-key    D                 detach-client
bind-key    S                 choose-tree -w -K "" -F "#{E:@GHC_TREE_FORMAT}"
bind-key    ','               run-shell "bash $HOME/.config/tmux/script/focus-session.sh prev"
bind-key    '.'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh next"
bind-key    '"'               switch-client -l
bind-key    '!'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 1"
bind-key    '@'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 2"
bind-key    '#'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 3"
bind-key    '$'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 4"
bind-key    '%'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 5"
bind-key    '^'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 6"
bind-key    '&'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 7"
bind-key    '*'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 8"
bind-key    '('               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 9"
bind-key    ')'               run-shell "bash $HOME/.config/tmux/script/focus-session.sh 10"

### Swap
bind-key    '<'               run-shell "$HOME/.config/tmux/rust/ghc-tmux-status/target/release/ghc-tmux-status session swap prev"
bind-key    '>'               run-shell "$HOME/.config/tmux/rust/ghc-tmux-status/target/release/ghc-tmux-status session swap next"

### Rename
bind-key    '/'               command-prompt -C -e -p "Set window name:"  -I "#{window_name}"    'rename-window "%%%"'      # Rename window
bind-key    '?'               command-prompt -C -e -p "Set session name:" -I "#{session_name}"   'rename-session "%%%"'     # Rename session

### Toggle
bind-key    T                 run-shell "node $HOME/.config/guanghechen/cli/theme.mjs toggle --silent"

## Session

### Create / Move
bind-key    m                 command-prompt -C -e -p "Move pane to window:"  -I "#{window_name}" 'set-option -p @GHC_MOVE_PANE_TARGET "%%%" ; run-shell "bash $HOME/.config/tmux/script/move-pane.sh #{pane_id}"'
bind-key    n                 command-prompt -C -e -p "New window name:"      -I "#{window_name}-2" 'new-window -n "%%%"'

### Focus
bind-key    1                 select-window -t 1
bind-key    2                 select-window -t 2
bind-key    3                 select-window -t 3
bind-key    4                 select-window -t 4
bind-key    5                 select-window -t 5
bind-key    6                 select-window -t 6
bind-key    7                 select-window -t 7
bind-key    8                 select-window -t 8
bind-key    9                 select-window -t 9
bind-key    0                 select-window -t 10
bind-key    '['               previous-window
bind-key    ']'               next-window
bind-key    '`'               if -F "$_tmux_is_tui_pane"    "send-keys C-a \`"    "last-window"
bind-key    "'"               last-window
bind-key    ';'               last-pane -Z
bind-key    p                 select-pane -t '{next}' -Z
bind-key    P                 select-pane -t '{previous}' -Z

### Kill
bind-key    O                 confirm-before -p "Kill other windows? (y/n)"   "kill-window -a"  # Close other window.
bind-key    W                 confirm-before -p "Kill current window? (y/n)"  "kill-window"     # Close current window.

### Swap
bind-key    '{'               swap-window -d -t -1
bind-key    '}'               swap-window -d -t +1

## Window

### Create
bind-key    H                 split-window -hb  -c "#{pane_current_path}"   # Split pane to the left
bind-key    J                 split-window -v   -c "#{pane_current_path}"   # Split pane below
bind-key    K                 split-window -vb  -c "#{pane_current_path}"   # Split pane above
bind-key    L                 split-window -h   -c "#{pane_current_path}"   # Split pane to the right

### Focus
bind-key    h                 if -F "$_tmux_is_tui_pane"      "send-keys C-a h"   "if -F \"#{pane_at_left}\"    \"\"  \"select-pane -Z -L\""
bind-key    j                 if -F "$_tmux_is_tui_pane"      "send-keys C-a j"   "if -F \"#{pane_at_bottom}\"  \"\"  \"select-pane -Z -D\""
bind-key    k                 if -F "$_tmux_is_tui_pane"      "send-keys C-a k"   "if -F \"#{pane_at_top}\"     \"\"  \"select-pane -Z -U\""
bind-key    l                 if -F "$_tmux_is_tui_pane"      "send-keys C-a l"   "if -F \"#{pane_at_right}\"   \"\"  \"select-pane -Z -R\""

### Kill
bind-key    o                 if -F "$_tmux_is_tui_pane"      "send-keys M-o"       "confirm-before -p \"Kill other panes? (y/n)\" \"kill-pane -a\""
bind-key    d                 confirm-before -p "Kill current pane? (y/n)" "kill-pane" # Close current pane

### Misc
bind-key    b                 copy-mode\; send-keys -X previous-prompt
bind-key    c                 if -F "$_tmux_is_tui_pane"      "send-keys C-a c"     "copy-mode"
bind-key    C                 copy-mode
bind-key    :                 command-prompt -C

### Popup
bind-key    g                 if -F "$_tmux_is_tui_pane"      "send-keys C-a g"     "display-popup -d \"#{pane_current_path}\" -w90% -h90% -E \"lg\""
bind-key    t                 if -F "$_tmux_is_tui_pane"      "send-keys C-a t"     "run-shell \"bash $HOME/.config/tmux/script/popup.sh\""
bind-key    y                 if -F "$_tmux_is_tui_pane"      "send-keys C-a y"     "display-popup -d \"#{pane_current_path}\" -w90% -h90% -E \"fish -ic 'yazi 2>/dev/null'\""

### Resize
bind-key -r Left              if -F "$_tmux_is_zen_mode"   "send-keys C-a Left"  "resize-pane -L 1"
bind-key -r Down              if -F "$_tmux_is_zen_mode"   "send-keys C-a Down"  "resize-pane -D 1"
bind-key -r Up                if -F "$_tmux_is_zen_mode"   "send-keys C-a Up"    "resize-pane -U 1"
bind-key -r Right             if -F "$_tmux_is_zen_mode"   "send-keys C-a Right" "resize-pane -R 1"
bind-key    z                 resize-pane -Z

### Swap
bind-key    S-Left            swap-pane -d -t '{left-of}'
bind-key    S-Down            swap-pane -d -t '{down-of}'
bind-key    S-Up              swap-pane -d -t '{up-of}'
bind-key    S-Right           swap-pane -d -t '{right-of}'

### Layout
bind-key    '|'               select-layout "even-horizontal"
bind-key    '_'               select-layout "even-vertical"

## Copy mode

### Mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-selection

### Navigation
bind-key -T copy-mode-vi h    send-keys -X cursor-left
bind-key -T copy-mode-vi j    send-keys -X cursor-down
bind-key -T copy-mode-vi k    send-keys -X cursor-up
bind-key -T copy-mode-vi l    send-keys -X cursor-right
bind-key -T copy-mode-vi e    send-keys -X next-word-end
bind-key -T copy-mode-vi H    send-keys -X start-of-line
bind-key -T copy-mode-vi J    send-keys -N 5 -X cursor-down
bind-key -T copy-mode-vi K    send-keys -N 5 -X cursor-up
bind-key -T copy-mode-vi L    send-keys -X end-of-line
bind-key -T copy-mode-vi C-h  send-keys -X page-up
bind-key -T copy-mode-vi C-j  send-keys -X halfpage-down
bind-key -T copy-mode-vi C-k  send-keys -X halfpage-up
bind-key -T copy-mode-vi C-l  send-keys -X page-down

### Selection
bind-key -T copy-mode-vi i    send-keys -X select-word
bind-key -T copy-mode-vi v    send-keys -X begin-selection
bind-key -T copy-mode-vi I    send-keys -X select-line
bind-key -T copy-mode-vi V    send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-v  send-keys -X rectangle-toggle

### Yank
bind-key -T copy-mode-vi a    send-keys -X append-selection
bind-key -T copy-mode-vi y    send-keys -X copy-selection
bind-key -T copy-mode-vi Y    send-keys -X copy-end-of-line

### Prompt
bind-key -T copy-mode-vi p    send-keys -X previous-prompt
bind-key -T copy-mode-vi P    send-keys -X next-prompt

### Search
bind-key -T copy-mode-vi /    command-prompt -i -p "(search down)" 'send-keys -X search-forward-incremental "%%%"'
bind-key -T copy-mode-vi ?    command-prompt -i -p "(search up)" 'send-keys -X search-backward-incremental "%%%"'
bind-key -T copy-mode-vi =    send-keys -X search-again
bind-key -T copy-mode-vi +    send-keys -X search-reverse
