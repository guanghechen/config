#_tmux_widget_app_name="ps -o comm= -t '#{pane_tty}' | rg -o '[\\w-]+' | tail -1"
_tmux_widget_app_name="bash $HOME/.config/tmux/script/app_name.sh #{pane_tty}"
_tmux_widget_app_pid="ps -o pid= -t '#{pane_tty}' | rg -o '\\d+' | tail -1"

set -g status-left "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}] \
#[fg=#{@GHC_SL_COLOR_BG_HOST_SYM},      bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_HOST_SYM},      bg=#{@GHC_SL_COLOR_BG_HOST_SYM}]#{@GHC_SL_SYM_OS} \
#[fg=#{@GHC_SL_COLOR_FG_USER_TEXT},     bg=#{@GHC_SL_COLOR_BG_USER_TEXT}, bold] #{USER}\
#[fg=#{@GHC_SL_COLOR_FG_USER_SEP},      bg=#{@GHC_SL_COLOR_BG_USER_SEP}, bold]@\
#[fg=#{@GHC_SL_COLOR_FG_HOST_TEXT},     bg=#{@GHC_SL_COLOR_BG_USER_TEXT}, bold]#{=21:host} \
\
#[fg=#{@GHC_SL_COLOR_BG_SESSION_SYM},   bg=#{@GHC_SL_COLOR_BG_HOST_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_SESSION_SYM},   bg=#{@GHC_SL_COLOR_BG_SESSION_SYM}]#{@GHC_SL_SYM_SESSION} \
#[fg=#{@GHC_SL_COLOR_FG_SESSION_TEXT},  bg=#{@GHC_SL_COLOR_BG_SESSION_TEXT}, bold] #S \
"

set -g status-right "\
#[fg=#{@GHC_SL_COLOR_BG},               bg=#{@GHC_SL_COLOR_BG}] \
#[fg=#{@GHC_SL_COLOR_BG_APP_SYM},       bg=#{@GHC_SL_COLOR_BG}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_APP_SYM},       bg=#{@GHC_SL_COLOR_BG_APP_SYM}]#{@GHC_SL_SYM_APP} \
#[fg=#{@GHC_SL_COLOR_FG_APP_TEXT},      bg=#{@GHC_SL_COLOR_BG_APP_TEXT}, bold] #($_tmux_widget_app_name) \
\
#[fg=#{@GHC_SL_COLOR_BG_PID_SYM},       bg=#{@GHC_SL_COLOR_BG_APP_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_PID_SYM},       bg=#{@GHC_SL_COLOR_BG_PID_SYM}]#{@GHC_SL_SYM_PID} \
#[fg=#{@GHC_SL_COLOR_FG_PID_TEXT},      bg=#{@GHC_SL_COLOR_BG_PID_TEXT}, bold] #($_tmux_widget_app_pid) \
\
#[fg=#{@GHC_SL_COLOR_BG_TIME_SYM},      bg=#{@GHC_SL_COLOR_BG_PID_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_TIME_SYM},      bg=#{@GHC_SL_COLOR_BG_TIME_SYM}]#{@GHC_SL_SYM_TIME} \
#[fg=#{@GHC_SL_COLOR_FG_TIME_TEXT},     bg=#{@GHC_SL_COLOR_BG_TIME_TEXT}, bold] %H:%M:%S \
\
#[fg=#{@GHC_SL_COLOR_BG_DATE_SYM},      bg=#{@GHC_SL_COLOR_BG_TIME_TEXT}]#{@GHC_SL_SEP_LEFT}\
#[fg=#{@GHC_SL_COLOR_FG_DATE_SYM},      bg=#{@GHC_SL_COLOR_BG_DATE_SYM}]#{@GHC_SL_SYM_DATE} \
#[fg=#{@GHC_SL_COLOR_FG_DATE_TEXT},     bg=#{@GHC_SL_COLOR_BG_DATE_TEXT}, bold] %a %b %d, %Y \
"

