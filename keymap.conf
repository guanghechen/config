# Clear all default keybindings first
keybind = clear

# ============================================================================
# CSI u format keybindings (for terminal applications)
# ============================================================================

# Special keys to CSI u format
keybind = tab=csi:9;1u
# keybind = enter=csi:13;1u
keybind = escape=csi:27;1u
keybind = shift+tab=csi:9;2u
keybind = shift+enter=csi:13;2u
keybind = shift+escape=csi:27;2u

# Control + Keys to CSI u format
keybind = ctrl+comma=csi:44;5u
keybind = ctrl+period=csi:46;5u
keybind = ctrl+slash=csi:47;5u
keybind = ctrl+digit_0=csi:48;5u
keybind = ctrl+digit_1=csi:49;5u
keybind = ctrl+digit_2=csi:50;5u
keybind = ctrl+digit_3=csi:51;5u
keybind = ctrl+digit_4=csi:52;5u
keybind = ctrl+digit_5=csi:53;5u
keybind = ctrl+digit_6=csi:54;5u
keybind = ctrl+digit_7=csi:55;5u
keybind = ctrl+digit_8=csi:56;5u
keybind = ctrl+digit_9=csi:57;5u
keybind = ctrl+left_bracket=csi:91;5u
keybind = ctrl+right_bracket=csi:93;5u
keybind = ctrl+grave_accent=csi:96;5u
keybind = ctrl+i=csi:105;5u
keybind = ctrl+m=csi:109;5u
keybind = ctrl+o=csi:111;5u

# Control + Shift + Keys to CSI u format
keybind = ctrl+shift+comma=csi:44;6u
keybind = ctrl+shift+period=csi:46;6u
keybind = ctrl+shift+slash=csi:47;6u
keybind = ctrl+shift+a=csi:65;6u
keybind = ctrl+shift+b=csi:66;6u
keybind = ctrl+shift+c=csi:67;6u
keybind = ctrl+shift+d=csi:68;6u
keybind = ctrl+shift+e=csi:69;6u
keybind = ctrl+shift+f=csi:70;6u
keybind = ctrl+shift+g=csi:71;6u
keybind = ctrl+shift+h=csi:72;6u
keybind = ctrl+shift+i=csi:73;6u
keybind = ctrl+shift+j=csi:74;6u
keybind = ctrl+shift+k=csi:75;6u
keybind = ctrl+shift+l=csi:76;6u
keybind = ctrl+shift+m=csi:77;6u
keybind = ctrl+shift+n=csi:78;6u
keybind = ctrl+shift+o=csi:79;6u
keybind = ctrl+shift+p=csi:80;6u
keybind = ctrl+shift+q=csi:81;6u
keybind = ctrl+shift+r=csi:82;6u
keybind = ctrl+shift+s=csi:83;6u
keybind = ctrl+shift+t=csi:84;6u
keybind = ctrl+shift+u=csi:85;6u
keybind = ctrl+shift+v=csi:86;6u
keybind = ctrl+shift+w=csi:87;6u
keybind = ctrl+shift+x=csi:88;6u
keybind = ctrl+shift+y=csi:89;6u
keybind = ctrl+shift+z=csi:90;6u
keybind = ctrl+shift+left_bracket=csi:91;6u
keybind = ctrl+shift+right_bracket=csi:93;6u

