# ============================================================================
# Terminal functions (Ghostty actions)
# ============================================================================

# Clipboard
keybind = cmd+v=paste_from_clipboard
keybind = ctrl+insert=copy_to_clipboard
keybind = shift+insert=paste_from_clipboard

# Tab management
keybind = cmd+ctrl+n=new_tab
keybind = cmd+ctrl+w=close_surface
keybind = cmd+ctrl+comma=previous_tab
keybind = cmd+ctrl+period=next_tab
keybind = cmd+ctrl+shift+comma=move_tab:-1
keybind = cmd+ctrl+shift+period=move_tab:1

# Split management
keybind = cmd+ctrl+shift+h=new_split:left
keybind = cmd+ctrl+shift+j=new_split:down
keybind = cmd+ctrl+shift+k=new_split:up
keybind = cmd+ctrl+shift+l=new_split:right
keybind = cmd+ctrl+h=goto_split:left
keybind = cmd+ctrl+j=goto_split:bottom
keybind = cmd+ctrl+k=goto_split:top
keybind = cmd+ctrl+l=goto_split:right
keybind = cmd+ctrl+left=resize_split:left,10
keybind = cmd+ctrl+down=resize_split:down,10
keybind = cmd+ctrl+up=resize_split:up,10
keybind = cmd+ctrl+right=resize_split:right,10
keybind = cmd+ctrl+z=toggle_split_zoom

# Font size controls
keybind = cmd+ctrl+equal=increase_font_size:1
keybind = cmd+ctrl+minus=decrease_font_size:1

# Configuration
keybind = cmd+ctrl+f5=reload_config
keybind = cmd+ctrl+f11=toggle_fullscreen
keybind = cmd+ctrl+f12=toggle_fullscreen
