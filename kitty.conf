include local/theme.conf
include keymap.conf

macos_option_as_alt yes
sync_to_monitor no

# font
font_size 15
font_family RobotoMono
bold_font auto
bold_italic_font auto
italic_font auto

# Letter and line spacing
letter_spacing -0.5
line_spacing 0.0

# window
hide_window_decorations titlebar-only
remember_window_size yes
window_padding_width 0

# Background
background_blur 30
background_image ~/.config/guanghechen/config/wallpaper/Flowerlit-Prayers.jpg
background_image_alignment center
background_image_layout scaled
background_image_linear no
background_image_scale_to_fit false
background_image_stretch
background_opacity 1
background_tint 0.7
dynamic_background_opacity yes

# Cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4
