include local/theme.conf
include keymap.conf

sync_to_monitor               no

# Background
background_blur               30
background_image_layout       scaled
background_image_linear       no
background_opacity            0.8
background_tint               0.85
dynamic_background_opacity    yes

# cursor
# curosr none
cursor_trail                  3
cursor_trail_decay            0.1 0.4

# font
font_size                     15
font_family                   family="Maple Mono Normal NL NF CN" style="Regular"
bold_font                     family="Maple Mono Normal NL NF CN" style="Bold" 
# bold_font                     family="Maple Mono Normal NL NF CN" style="ExtraBold" 
italic_font                   family="Maple Mono Normal NL NF CN" style="Medium Italic"
bold_italic_font              family="Maple Mono Normal NL NF CN" style="Bold Italic"
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E634,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF Symbols Nerd Font Mono
text_composition_strategy     legacy

# Misc
copy_on_select yes
enable_audio_bell no

# Scroll
scrollback_lines              10000
touch_scroll_multiplier       2.0

# Tab bar
tab_bar_edge                  top
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_separator                 " "

# Window
hide_window_decorations       titlebar-only
initial_window_height         1000
initial_window_width          1600
remember_window_size          yes
window_padding_width          0

