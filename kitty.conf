include local/theme.conf
include keymap.conf

sync_to_monitor               no

# font
#
# list fonts: kitty list-fonts --psnames
#
#
font_size                     15
font_family                   family="Maple Mono Normal NF CN"
bold_font                     auto
italic_font                   auto
bold_italic_font              auto
font_features                 MapleMono-NF-CN-ExtraLight  +cv01 +ss02 +ss04 +ss05 +zero
font_features                 MapleMono-NF-CN-Bold        +cv01 +ss02 +ss04 +ss05 +zero
font_features                 MapleMono-NF-CN-Italic      +cv01 +ss02 +ss04 +ss05 +zero
font_features                 MapleMono-NF-CN-BoldItalic  +cv01 +ss02 +ss04 +ss05 +zero
text_composition_strategy     legacy

# window
hide_window_decorations       titlebar-only
remember_window_size          yes
window_padding_width          0

# tab bar
tab_bar_edge                  top
tab_bar_style                 powerline
tab_powerline_style           slanted

# Background
background_blur               30
background_image_layout       scaled
background_image_linear       no
background_opacity            0.8
background_tint               0.85
dynamic_background_opacity    yes

# Cursor
cursor_trail                  3
cursor_trail_decay            0.1 0.4

