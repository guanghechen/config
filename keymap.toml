# https://github.com/sxyazi/yazi/blob/5cfcab305ef0a02771b3bd651ed343e436fc7f7e/yazi-config/preset/keymap-default.toml#L5

"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
  { on   = [ "c", "m" ],      run  = "plugin chmod",                                  desc = "change: chmod on selected files"} 
]
keymap = [
  # Navigation
  { on = "<Up>",              run = "arrow -1",                                       desc = "move: cursor up" },
  { on = "<Down>",            run = "arrow 1",                                        desc = "move: cursor down" },
  { on = "k",                 run = "arrow -1",                                       desc = "move: cursor up" },
  { on = "j",                 run = "arrow 1",                                        desc = "move: cursor down" },
  { on = "<S-PageUp>",        run = "arrow -50%",                                     desc = "move: cursor up half page" },
  { on = "<S-PageDown>",      run = "arrow 50%",                                      desc = "move: cursor down half page" },
  { on = "<PageUp>",          run = "arrow -100%",                                    desc = "move: cursor up one page" },
  { on = "<PageDown>",        run = "arrow 100%",                                     desc = "move: cursor down one page" },
  { on = ["g", "g"],          run = "arrow top",                                      desc = "move: cursor to the top" },
  { on = "G",                 run = "arrow bot",                                      desc = "move: cursor to the bottom" },

  { on = "<Left>",            run = "leave",                                          desc = "Go back to the parent directory" },
  { on = "<Right>",           run = "enter",                                          desc = "Enter the child directory" },
  { on = "h",                 run = "leave",                                          desc = "Go back to the parent directory" },
  { on = "l",                 run = "enter",                                          desc = "Enter the child directory" },
  { on = "H",                 run = "back",                                           desc = "Go back to the previous directory" },
  { on = "L",                 run = "forward",                                        desc = "Go forward to the next directory" },

  # Clipboard Copy/Paste/Yank
  { on = ["c", "c"],          run = "copy path",                                      desc = "copy: filepath" },
  { on = ["c", "d"],          run = "copy dirname",                                   desc = "copy: dirpath" },
  { on = ["c", "f"],          run = "copy filename",                                  desc = "copy: filename" },
  { on = ["c", "n"],          run = "copy name_without_ext",                          desc = "copy: filename without extension" },
  { on = "P",                 run = "paste --force",                                  desc = "paste: yanked files (overwrite if the destination exists)" },
  { on = "p",                 run = "paste",                                          desc = "paste: yanked files" },
  { on = "y",                 run = "yank",                                           desc = "yank: selected files (copy)" },
  { on = "x",                 run = "yank --cut",                                     desc = "yank: selected files (cut)" },
  { on = "Y",                 run = "unyank",                                         desc = "yank: Cancel the yank status" },
  { on = "X",                 run = "unyank",                                         desc = "yank: Cancel the yank status" },

  # Goto
  { on = ["g", "?"],          run = "help",                                           desc = "goto: help" },
  { on = ["g", "h"],          run = "cd ~",                                           desc = "goto: home" },
  { on = ["g", "i"],          run = "cd --interactive",                               desc = "goto: interactively" },
  { on = ["g", "t"],          run = "tasks_show",                                     desc = "Show task manager" },

  # Linemode
  { on = ["m", "s"],          run = "linemode size",                                  desc = "linemode: size" },
  { on = ["m", "p"],          run = "linemode permissions",                           desc = "linemode: permissions" },
  { on = ["m", "b"],          run = "linemode btime",                                 desc = "linemode: btime" },
  { on = ["m", "m"],          run = "linemode mtime",                                 desc = "linemode: mtime" },
  { on = ["m", "o"],          run = "linemode owner",                                 desc = "linemode: owner" },
  { on = ["m", "n"],          run = "linemode none",                                  desc = "linemode: none" },

  # Open
  { on = "o",                 run = "open",                                           desc = "open: selected files" },
  { on = "O",                 run = "open --interactive",                             desc = "open: selected files (interactively)" },
  { on = "<Enter>",           run = "open",                                           desc = "open: selected files" },
  { on = "<S-Enter>",         run = "open --interactive",                             desc = "open: selected files (interactively)" },

  # Operation
  { on = "-",                 run = "link",                                           desc = "Symlink the absolute path of yanked files" },
  { on = "_",                 run = "link --relative",                                desc = "Symlink the relative path of yanked files" },
  { on = "<C-->",             run = "hardlink",                                       desc = "Hardlink yanked files" },
  { on = "d",                 run = "remove",                                         desc = "Trash selected files" },
  { on = "D",                 run = "remove --permanently",                           desc = "Permanently delete selected files" },
  { on = "a",                 run = "create",                                         desc = "Create a file (ends with / for directories)" },
  { on = "r",                 run = "rename --cursor=before_ext",                     desc = "Rename selected file(s)" },

  # Preview
  { on = "<C-k>",             run = "seek -1",                                        desc = "preview: seek up" },
  { on = "<C-j>",             run = "seek 1",                                         desc = "preview: seek down" },

  # Process
  { on = "<C-z>",             run = "suspend",                                        desc = "process: suspend" },
  { on = "q",                 run = "quit --no-cwd-file",                             desc = "process: quit" },
  { on = "Q",                 run = "quit --no-cwd-file",                             desc = "process: quit without outputting cwd-file" },

  # Search
  { on = "<C-s>",             run = "escape --search",                                desc = "search: cancel the ongoing search" },
  { on = ["s", "f"],          run = "search --via=fd",                                desc = "search: files by name via fd" },
  { on = ["s", "s"],          run = "search --via=rg",                                desc = "search: files by content via ripgrep" },
  { on = "/",                 run = "find --smart",                                   desc = "search: next file" },
  { on = "?",                 run = "find --previous --smart",                        desc = "search: previous file" },
  { on = "n",                 run = "find_arrow",                                     desc = "search: goto the next found" },
  { on = "N",                 run = "find_arrow --previous",                          desc = "search: goto the previous found" },

  # Shell
  { on = "!",                 run = 'shell "$SHELL" --block',                        desc = "shell: open here" },
  { on = ";",                 run = "shell --interactive",                            desc = "shell: run a command" },
  { on = ":",                 run = "shell --block --interactive",                    desc = "shell: run a command (block until finishes)" },

  # Sorting
  { on = [",", "M"],          run = ["sort mtime --reverse", "linemode mtime"],       desc = "sort: by modified time (reverse)" },
  { on = [",", "m"],          run = ["sort mtime --reverse=no", "linemode mtime"],    desc = "sort: by modified time" },
  { on = [",", "B"],          run = ["sort btime --reverse", "linemode btime"],       desc = "sort: by birth time (reverse)" },
  { on = [",", "b"],          run = ["sort btime --reverse=no", "linemode btime"],    desc = "sort: by birth time" },
  { on = [",", "S"],          run = ["sort size --reverse", "linemode size"],         desc = "sort: by size (reverse)" },
  { on = [",", "s"],          run = ["sort size --reverse=no", "linemode size"],      desc = "sort: by size" },
  { on = [",", "E"],          run = "sort extension --reverse",                       desc = "sort: by extension (reverse)" },
  { on = [",", "e"],          run = "sort extension --reverse=no",                    desc = "sort: by extension" },
  { on = [",", "A"],          run = "sort alphabetical --reverse",                    desc = "sort: alphabetically (reverse)" },
  { on = [",", "a"],          run = "sort alphabetical --reverse=no",                 desc = "sort: alphabetically" },
  { on = [",", "N"],          run = "sort natural --reverse",                         desc = "sort: naturally (reverse)" },
  { on = [",", "n"],          run = "sort natural --reverse=no",                      desc = "sort: naturally" },
  { on = [",", "r"],          run = "sort random --reverse=no",                       desc = "sort: randomly" },

  # Spot
  { on = "K",                 run = "spot",                                           desc = "spot: hovered file" },

  # Tab
  { on = ["t", "t"],          run = "tab_create --current",                           desc = "tab: new (cwd)" },
  { on = ["t", "d"],          run = "tab_close",                                      desc = "tab: close" },
  { on = ["t", "1"],          run = "tab_switch 0",                                   desc = "tab: focus 1" },
  { on = ["t", "2"],          run = "tab_switch 1",                                   desc = "tab: focus 2" },
  { on = ["t", "3"],          run = "tab_switch 2",                                   desc = "tab: focus 3" },
  { on = ["t", "4"],          run = "tab_switch 3",                                   desc = "tab: focus 4" },
  { on = ["t", "5"],          run = "tab_switch 4",                                   desc = "tab: focus 5" },
  { on = ["t", "6"],          run = "tab_switch 5",                                   desc = "tab: focus 6" },
  { on = ["t", "7"],          run = "tab_switch 6",                                   desc = "tab: focus 7" },
  { on = ["t", "8"],          run = "tab_switch 7",                                   desc = "tab: focus 8" },
  { on = ["t", "9"],          run = "tab_switch 8",                                   desc = "tab: focus 9" },
  { on = ["t", "0"],          run = "tab_switch 9",                                   desc = "tab: focus 10" },
  { on = ["t", ","],          run = "tab_switch -1 --relative",                       desc = "tab: focus left" },
  { on = ["t", "."],          run = "tab_switch 1 --relative",                        desc = "tab: focus right" },
  { on = ["t", "<"],          run = "tab_swap -1",                                    desc = "tab: swap left" },
  { on = ["t", ">"],          run = "tab_swap 1",                                     desc = "tab: swap right" },
  { on = ["t", "["],          run = "tab_switch -1 --relative",                       desc = "tab: focus left" },
  { on = ["t", "]"],          run = "tab_switch 1 --relative",                        desc = "tab: focus right" },
  { on = ["t", "{"],          run = "tab_swap -1",                                    desc = "tab: swap left" },
  { on = ["t", "}"],          run = "tab_swap 1",                                     desc = "tab: swap right" },

  # Toggle
  { on = "<Space>",           run = ["toggle", "arrow 1"],                            desc = "toggle: current selection state" },
  { on = "<C-a>",             run = "toggle_all --state=on",                          desc = "toggle: select all files" },
  { on = "<C-r>",             run = "toggle_all",                                     desc = "toggle: selection of all files" },
  { on = ".",                 run = "hidden toggle",                                  desc = "toggle: hidden files" },

  # Visual
  { on = "<Esc>",             run = "escape",                                         desc = "visual: quit visual mode, clear selected, or cancel search" },
  { on = "v",                 run = "visual_mode",                                    desc = "visual: enter selection mode" },
  { on = "V",                 run = "visual_mode --unset",                            desc = "visual: enter unset mode" },

  # Misc
  { on = "z",                 run = "plugin zoxide",                                  desc = "Jump to a directory via zoxide" },
  { on = ["f", "f"],          run = "plugin fzf",                                     desc = "Jump to a file/directory via fzf" },
]

[help]
prepend_keymap = [
  { on = ["g", "g"],          run = "arrow top",                                      desc = "move: cursor to the top" },
  { on = "G",                 run = "arrow bot",                                      desc = "move: cursor to the bottom" },
]
