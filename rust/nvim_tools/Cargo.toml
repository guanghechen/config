[package]
name = "nvim_tools"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
chrono = "0.4.42"
libc = "0.2.177"
nvim-oxi = { version = "0.6.0", features=["neovim-nightly"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rstd = { path = "../rstd" }
