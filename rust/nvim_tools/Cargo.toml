[package]
name = "nvim_tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
chrono = "0.4.41"
libc = "0.2.155"
md-5 = "0.10.6"
nvim-oxi = { version = "0.6.0", features=["neovim-nightly"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4", "fast-rng"] }

[dev-dependencies]

