[package]
name = "rstd"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4.42"
globset = "0.4.14"
grep = "0.3.1"
ignore = "0.4.22"
libc = "0.2.177"
md-5 = "0.10.6"
mlua = { version = "0.9.9", default-features = false, features = ["luajit", "module"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }
