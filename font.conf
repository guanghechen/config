# Font settings for kitty
font_family                 Maple Mono NF CN
bold_font                   Maple Mono NF CN Bold
italic_font                 Maple Mono NF CN Italic
bold_italic_font            Maple Mono NF CN Bold Italic
font_size                   15.0

# Font features
font_features               MapleMono NF CN Light         +cv01 +ss02 +ss04 +ss05 +zero
font_features               MapleMono NF CN Bold          +cv01 +ss02 +ss04 +ss05 +zero
font_features               MapleMono NF CN Italic        +cv01 +ss02 +ss04 +ss05 +zero
font_features               MapleMono NF CN Bold Italic   +cv01 +ss02 +ss04 +ss05 +zero

# Optional tweaks
disable_ligatures           cursor
modify_font                 cell_width  100%
modify_font                 cell_height 100%

# Nerd Font symbols
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E7C5,U+F000-U+F2E0,U+F300-U+F32D,U+F400-U+F4A9,U+F500-U+F8FF,U+F900-U+FA6D,U+FACE-U+FAD9,U+FB00-U+FB06,U+FE00-U+FE0F Symbols Nerd Font Mono

# Text composition
text_composition_strategy   platform

