confirmOnQuit: false # Don't show confirmation when quitting
disableStartupPopups: true # Don't show introductory popups on startup
notARepository: skip # Skip to most recent repo when opening outside a git repo
promptToReturnFromSubprocess: false # Don't prompt to return after subprocess exits
git:
  autoFetch: false # Don't auto-fetch from remote
  autoForwardBranches: allBranches # Auto fast-forward all local branches after fetch
  autoRefresh: true # Auto-refresh files and submodules
  autoStageResolvedConflicts: true # Auto-stage files after resolving conflicts
  commit:
    signOff: false # Don't add --signoff flag to commits
  commitPrefix: # Auto-generate commit message prefix from branch name
    - pattern: "^(?:user/[^/]+/)?(fix|feat|chore|refactor|docs|test)-(.+)$"
      replace: "$1(#$2): "
  diffContextSize: 5 # Number of context lines in diff
  disableForcePushing: false # Allow force pushing
  fetchAll: false # Don't pass --all to git fetch
  ignoreWhitespaceInDiffView: false # Show whitespace changes in diff
  localBranchSortOrder: alphabetical # Sort local branches alphabetically
  log:
    order: topo-order # Use topo-order for easier graph reading
    showGraph: "always" # Always show git graph in commits panel
    showWholeGraph: false # Don't show commits from all branches by default
  mainBranches: # Branches considered as main branches
    - main
    - master
  diffRenderers: # Use delta as pager (install: cargo install git-delta)
    - colorArg: always
      command: delta --paging=never
  parseEmoji: true # Render emoji strings like :rocket: as 🚀
  remoteBranchSortOrder: alphabetical # Sort remote branches alphabetically
  skipHookPrefix: WIP # Prefix to skip pre-commit hooks
  truncateCopiedCommitHashesTo: 40 # Copy full commit hash (40 chars)
gui:
  animateExplosion: true # Show explosion animation when nuking working tree
  authorColors: # Custom colors for commit authors
    "*": white
    guanghechen: blue
  border: "rounded" # Rounded window borders
  branchColorPatterns: # Custom colors for branch name patterns
    "^(main|master)$": purple
    "^(user/[^/]+/)?feat": green
    "^(user/[^/]+/)?feature": green
    "^(user/[^/]+/)?fix": red
    "^(user/[^/]+/)?release": blue
  commitAuthorShortLength: 4 # Show 4 chars for author name in compact view
  commitHashLength: 9 # Show 9 chars for commit hash
  commitLength: # Show commit message length indicator
    show: true
  expandFocusedSidePanel: false # Don't expand focused side panel (accordion effect)
  filterMode: fuzzy # Use fuzzy filtering when typing '/'
  language: 'en' # UI language
  mainPanelSplitMode: flexible # Split main panel based on window width
  mouseEvents: true # Enable mouse events
  nerdFontsVersion: "3" # Use Nerd Fonts v3 for icons
  scrollOffMargin: 3
  scrollPastBottom: true
  shortTimeFormat: "15:04:05" # Time format for recent commits (HH:mm:SS)
  showBottomLine: false # Hide bottom keybinding hints line
  showBranchCommitHash: true # Show commit hash next to branch names
  showCommandLog: true # Show command log panel
  showDivergenceFromBaseBranch: arrowAndNumber # Show arrow and number for divergence from base branch
  showFileIcons: true # Show file type icons
  showFileTree: true # Display files as tree structure
  showListFooter: true # Show "5 of 20" footer in list views
  showNumstatInFilesView: true # Show lines added/removed in files view
  showPanelJumps: true # Show panel jump keys (1-5) in window titles
  showRandomTip: true # Show random tip on startup
  showRootItemInFileTree: true # Show "/" root item in file tree
  skipAmendWarning: false # Show warning when amending commit
  skipDiscardChangeWarning: false # Show warning when discarding changes
  skipNoStagedFilesWarning: false # Show warning when committing without staged files
  skipRewordInEditorWarning: false # Show warning when rewording in editor
  skipStashWarning: false # Show warning when stashing
  spinner: # Custom spinner animation frames
    frames:
      - ⣾
      - ⣽
      - ⣻
      - ⢿
      - ⡿
      - ⣟
      - ⣯
      - ⣷
  splitDiff: auto # Split diff view when file has staged and unstaged changes
  statusPanelView: allBranchesLog # Show all branches log in status panel
  switchTabsWithPanelJumpKeys: false # Don't switch tabs when pressing panel jump keys on active panel
  tabWidth: 2 # Tab width for diff display
  theme: # Color theme settings
    activeBorderColor:
      - magenta
      - bold
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    defaultFgColor:
      - default
    inactiveBorderColor:
      - white
    inactiveViewSelectedLineBgColor:
      - bold
    markedBaseCommitBgColor:
      - magenta
    markedBaseCommitFgColor:
      - green
    optionsTextColor:
      - yellow
    searchingActiveBorderColor:
      - blue
    selectedLineBgColor:
      - white
    unstagedChangesColor:
      - red
  timeFormat: "2006-01-02 15:04:05" # Time format for older commits (YYYY-MM-DD HH:mm:SS)
  useHunkModeInStagingView: true # Start in hunk mode when entering staging view
  wrapLinesInStagingView: true # Wrap long lines in staging view
keybinding:
  main:
    toggleSelectHunk: '`' # Use backtick to toggle hunk selection
  universal:
    nextBlock-alt2: <disabled> # Disable tab for panel switching
    nextScreenMode: <tab> # Use tab for screen mode switching
    prevBlock-alt2: <disabled> # Disable backtab for panel switching
    prevScreenMode: <backtab> # Use backtab for screen mode switching
os:
  editPreset: "nvim-remote" # Use nvim-remote preset
