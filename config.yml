disableStartupPopups: true
notARepository: skip
promptToReturnFromSubprocess: false
git:
  commit:
    signOff: false
  commitPrefix:
    - pattern: "^(?:user/[^/]+/)?(fix|feat|chore|refactor|docs|test)-(.+)$"
      replace: "$1(#$2): "
  log:
    order: topo-order
    showGraph: "always"
    showWholeGraph: false
  mainBranches:
    - main
    - master
  pagers:
    - # cargo install git-delta
      colorArg: always
      pager: delta --paging=never
  autoFetch: false
  autoRefresh: true
  diffContextSize: 5
  fetchAll: false
  localBranchSortOrder: alphabetical
  ignoreWhitespaceInDiffView: false
  parseEmoji: true
  remoteBranchSortOrder: alphabetical
  skipHookPrefix: WIP
  truncateCopiedCommitHashesTo: 40
gui:
  authorColors:
    guanghechen: blue
    "*": white
  branchColorPatterns:
    "^(main|master)$": purple
    "^(user/[^/]+/)?fix": red
    "^(user/[^/]+/)?feat": green
    "^(user/[^/]+/)?feature": green
    "^(user/[^/]+/)?release": blue
  spinner:
    frames:
      - ⣾
      - ⣽
      - ⣻
      - ⢿
      - ⡿
      - ⣟
      - ⣯
      - ⣷
  theme:
    activeBorderColor:
      - magenta
      - bold
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    defaultFgColor:
      - default
    inactiveBorderColor:
      - white
    inactiveViewSelectedLineBgColor:
      - bold
    markedBaseCommitBgColor:
      - magenta
    markedBaseCommitFgColor:
      - green
    optionsTextColor:
      - yellow
    searchingActiveBorderColor:
      - blue
    selectedLineBgColor:
      - white
    unstagedChangesColor:
      - red
  border: "rounded"
  commitAuthorShortLength: 4
  commitHashLength: 9
  expandFocusedSidePanel: false
  filterMode: fuzzy
  language: 'en'
  mainPanelSplitMode: flexible
  mouseEvents: true
  nerdFontsVersion: "3"
  showBottomLine: false
  showBranchCommitHash: true
  showCommandLog: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showFileTree: true
  showIcons: true
  showNumstatInFilesView: true
  showRandomTip: true
  skipAmendWarning: false
  skipDiscardChangeWarning: false
  skipStashWarning: false
  skipNoStagedFilesWarning: false
  skipRewordInEditorWarning: false
  splitDiff: auto
  tabWidth: 2
  useHunkModeInStagingView: true
  wrapLinesInStagingView: false
os:
  edit: "nvim"
  editAtLine: "nvim --line={{line}} {{filename}}"
  editAtLineAndWait: "nvim --block --line={{line}} {{filename}}"
  editInTerminal: true
  editPreset: "nvim-remote"
  openDirInEditor: "nvim {{dir}}"
keybinding:
  universal:
    nextBlock-alt2: <disabled>
    prevBlock-alt2: <disabled>
    nextScreenMode: <tab>
    prevScreenMode: <backtab>
  main:
    toggleSelectHunk: '`'
