[font]
builtin_box_drawing = true
size = 15

[font.bold]
family = "Maple Mono NF CN"
style = "Regular"

[font.bold_italic]
family = "Maple Mono NF CN"
style = "Italic"

[font.italic]
family = "Maple Mono NF CN"
style = "Italic"

[font.normal]
family = "Maple Mono NF CN"
style = "Light"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = -1

