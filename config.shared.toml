approval_policy = "on-request"
personality = "pragmatic"
project_doc_fallback_filenames = ["CLAUDE.md"]
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
web_search = "live"

model = "gpt-6-astra"
model_provider = "copilot"
model_reasoning_effort = "high"
cli_auth_credentials_store = "ephemeral"

[agents]
enabled = true
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "xhigh"
max_concurrent_threads_per_session = 6
max_depth = 1
interrupt_message = true

[model_providers.copilot]
name = "copilot"
base_url = "http://127.0.0.1:4747/api/codex"
wire_api = "responses"
supports_websockets = true
request_max_retries = 8
stream_max_retries = 8
stream_idle_timeout_ms = 6000000
websocket_connect_timeout_ms = 60000

[model_providers.copilot.auth]
command = "/usr/bin/printenv"
args = ["OPENAI_CODEX_AUTH_TOKEN"]

[model_providers.copilot.http_headers]
x-openai-actor-authorization = "kit-copilot-local"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"
log_user_prompt = false

[features]
apps = false
goals = true
hooks = true
image_generation = true
memories = true
multi_agent = true
plugin_sharing = false
prevent_idle_sleep = true
realtime_conversation = false
remote_plugin = false

[[skills.config]]
name = "imagegen"
enabled = false

[[skills.config]]
name = "plugin-creator"
enabled = false

[[skills.config]]
name = "skill-installer"
enabled = false

[[skills.config]]
name = "review-agent"
enabled = false

[memories]
generate_memories = false
disable_on_external_context = true
use_memories = false

[[hooks.PreToolUse]]
matcher = "apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/pre-tool-use.mjs"'
timeout = 5
statusMessage = "Checking sensitive file access"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/pre-bash-sensitive.mjs"'
timeout = 5
statusMessage = "Checking sensitive path usage"

# Waits on the user for tmux; see script/hook/progress.mjs. Each command names its
# event. Keep these synchronous so terminal events cannot overtake waits in a
# thread; progress.mjs serializes updates and reports across threads.
[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" PermissionRequest'
timeout = 5

[[hooks.PreToolUse]]
matcher = "^(request_user_input|multi_agent_v1send_input)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" PreToolUse'
timeout = 5

[[hooks.PostToolUse]]
matcher = "^(request_user_input|multi_agent_v1(send_input|close_agent))$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" PostToolUse'
timeout = 5

[[hooks.PreModelRequest]]

[[hooks.PreModelRequest.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" PreModelRequest'
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" UserPromptSubmit'
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" Stop'
timeout = 5

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" SubagentStop'
timeout = 5

[[hooks.Interrupt]]

[[hooks.Interrupt.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" Interrupt'
timeout = 3

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" SessionStart'
timeout = 5

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = 'node "${CODEX_HOME}/script/hook/progress.mjs" SessionEnd'
timeout = 3

# Approved progress hooks shared by profiles. Hashes include the rendered
# command paths; a different CODEX_HOME requires approval again.
[hooks.state]

[hooks.state."${CODEX_HOME}/config.toml:pre_model_request:0:0"]
trusted_hash = "sha256:68d73c576af0f19dfa448a7f3387ad8ac515e1bc895590bb8eece4ba87643ab0"

