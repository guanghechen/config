# Shared behavior and layout live here. script/sync.mjs composes this file,
# theme/local.json, and the preserved manual tail into config.toml.
onboarding = false

# tmux uses ctrl+a, so Herdr keeps ctrl+b as a distinct prefix.
[keys]
prefix = "ctrl+b"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[ui]
sidebar_width = 28
sidebar_min_width = 24
sidebar_max_width = 34
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", "agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
