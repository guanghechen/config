profile = "github-copilot"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "all"

[model_providers.github-copilot]
name = "github-copilot"
base_url = "http://localhost:4848"
env_key = "GHC_CODEX_AUTH_TOKEN"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[model_providers.azure]
name = "azure-openai"
# base_url = 
env_key = "AZURE_OPENAI_CODEX_API_KEY"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[model_providers.azure2]
name = "azure-openai"
# base_url = 
env_key = "AZURE_OPENAI_CODEX_API_KEY2"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[notice]
hide_gpt5_1_migration_prompt = true

[tui]
notifications = ["agent-turn-complete", "approval-requested"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[profiles.github-copilot]
# model = "gpt-5.1-codex"
model = "gpt-5.2"
model_reasoning_effort = "high"
model_provider = "github-copilot"

[profiles.azure]
model = "gpt-5-codex"
model_reasoning_effort = "high"
model_provider = "azure"

[profiles.azure2]
model = "gpt-5-codex"
model_reasoning_effort = "high"
model_provider = "azure2"
