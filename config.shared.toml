approval_policy = "on-request"
personality = "pragmatic"
model_reasoning_effort = "xhigh"
project_doc_fallback_filenames = ["CLAUDE.md"]
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
web_search = "disabled"

[features]
goals = true
hooks = true
image_generation = false
memories = true
multi_agent = true
prevent_idle_sleep = true
realtime_conversation = true

[memories]
generate_memories = false
disable_on_external_context = true
use_memories = false

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "xhigh"
max_concurrent_threads_per_session = 6
max_depth = 1
interrupt_message = true

[agents.coder]
description = "Implementation-focused coding agent for writing, modifying, and reviewing code."
config_file = "agents/coder.toml"

[agents.react-engineer]
description = "Frontend specialist for React + TypeScript + Tailwind tasks."
config_file = "agents/react-engineer.toml"

[agents.repair]
description = "Iterative repair agent for bug fixing, optimization, and refactoring."
config_file = "agents/repair.toml"

[agents.code-simplifier]
description = "Refines recently changed code for clarity and maintainability without changing behavior."
config_file = "agents/code-simplifier.toml"

[[hooks.PreToolUse]]
matcher = "apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$HOME/.config/codex/script/hook/pre-tool-use.mjs"'
timeout = 5
statusMessage = "Checking sensitive file access"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'node "$HOME/.config/codex/script/hook/pre-bash-sensitive.mjs"'
timeout = 5
statusMessage = "Checking sensitive path usage"

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
ignore_default_excludes = false
inherit = "all"

[realtime]
version = "v2"
transport = "websocket"
type = "conversational"

[tui]
theme = "local"
notifications = true
notification_method = "bel"
notification_condition = "always"
status_line = [
  "current-dir",
  "git-branch",
  "branch-changes",
  "pull-request-number",
  "model-with-reasoning",
  "context-remaining",
  "context-window-size",
  "approval-mode"
]
terminal_title = ["activity", "project-name", "git-branch", "model-with-reasoning"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[windows]
sandbox = "elevated"

[notice]
