approval_policy = "on-request"
personality = "pragmatic"
profile = "github-copilot"
sandbox_mode = "workspace-write"
suppress_unstable_features_warning = true
web_search = "disabled"

[features]
multi_agent = true
powershell_utf8 = true
prevent_idle_sleep = true
voice_transcription = true

[agents.coder]
description = "Implementation-focused coding agent for writing, modifying, and reviewing code."
config_file = "agents/coder.toml"

[agents.react-engineer]
description = "Frontend specialist for React + TypeScript + Tailwind tasks."
config_file = "agents/react-engineer.toml"

[agents.repair]
description = "Iterative repair agent for bug fixing, optimization, and refactoring."
config_file = "agents/repair.toml"

[agents.code-simplifier]
description = "Refines recently changed code for clarity and maintainability without changing behavior."
config_file = "agents/code-simplifier.toml"

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
inherit = "all"

[model_providers.github-copilot]
name = "github-copilot"
base_url = "http://localhost:4747/api/codex"
env_key = "OPENAI_CODEX_AUTH_TOKEN"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[model_providers.github-copilot-dev]
name = "github-copilot"
base_url = "http://localhost:4747/api/codex"
env_key = "OPENAI_CODEX_AUTH_TOKEN"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[model_providers.azure]
name = "azure-openai"
base_url = "https://*.azure.com/openai/v1"
env_key = "AZURE_OPENAI_CODEX_API_KEY"
wire_api = "responses"
request_max_retries = 3
stream_max_retries = 0
stream_idle_timeout_ms = 3000000

[profiles.github-copilot]
model = "gpt-5.3-codex"
model_provider = "github-copilot"
model_reasoning_effort = "high"
model_context_window = 272000
model_auto_compact_token_limit = 244800

[profiles.github-copilot-dev]
model = "gpt-5.3-codex"
model_provider = "github-copilot-dev"
model_reasoning_effort = "high"
model_context_window = 272000
model_auto_compact_token_limit = 244800

[profiles.azure]
model = "gpt-5.3-codex"
model_reasoning_effort = "high"
model_provider = "azure"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
]

[notice]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_ms = 20_000
